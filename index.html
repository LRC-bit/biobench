<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Kept out of search engines. This page is published to a static host so it
     can be opened from a phone, and the structures it shows are the user's own
     work — a public index of them is not something anyone asked for. -->
<meta name="robots" content="noindex, nofollow">
<title>BioBench Viewer</title>
<script src="3Dmol-min.js"></script>
<style>
  :root {
    --bg: #0b0f14;
    --border: #223040;
    --text: #dbe6f0;
    --muted: #7d8fa3;
    --accent: #4da3ff;
    --ok: #4ade80;
    --warn: #fbbf24;
    --err: #f87171;
  }


  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* ---------- viewer ---------- */
  #viewer-wrap {
    position: absolute;
    inset: 0;
    /* The default backdrop. Overwritten inline by stageApply() when the user
       picks another, which is why it lives here as well as in the JS table:
       this is what shows before the script runs. */
    background: radial-gradient(ellipse at 50% 40%, #16202b 0%, #0b0f14 70%);
  }
  #viewer { width: 100%; height: 100%; }
  /* Follows the cursor over the canvas and names the residue under it. */
  #hover-tip {
    position: absolute;
    z-index: 20;
    pointer-events: none;
    background: rgba(19,26,34,.78);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 12px;
    line-height: 1.45;
    color: var(--text);
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
    backdrop-filter: blur(4px);
  }
  #hover-tip .ht-res { font-weight: 600; }
  #hover-tip .ht-chain { color: var(--muted); margin-left: 6px; }
  #hover-tip .ht-sel { color: var(--accent); margin-left: 6px; }
  /* The empty stage: the name, large, and a line under it saying what this
     is. The name is the first thing anyone sees on a fresh page, and at 18px
     it was smaller than the panel headings beside it — a title that reads as
     a label. The line under it is the one place the page says what it is for,
     so it is kept short enough to read at a glance and quiet enough not to
     compete with the name. */
  #viewer-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    color: var(--muted);
    pointer-events: none;
    text-align: center;
    padding: 20px;
  }
  #viewer-hint.hidden { display: none; }
  /* The mark and the name, side by side and aligned on their centres. */
  #viewer-hint .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #viewer-hint .mark { color: var(--accent); flex-shrink: 0; }
  #viewer-hint .big {
    font-size: 40px;
    font-weight: 300;
    letter-spacing: .14em;
    color: var(--text);
  }
  /* Brighter than --muted: this sits on whatever picture the user chose as
     a backdrop, and a grey tuned for the dark UI can disappear into a dark
     photograph. The text colour is the one that always reads. */
  #viewer-hint .tag {
    font-size: 13px;
    line-height: 1.8;
    max-width: 420px;
    color: var(--text);
    opacity: .82;
  }
  /* The capabilities, as a row of short phrases rather than a sentence. A
     sentence has to be read; a row can be scanned, and this is the line that
     tells someone what they can ask for. */
  #viewer-hint .caps {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 10px;
    margin-top: 2px;
    font-size: 11.5px;
  }
  #viewer-hint .caps span {
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 11px;
    color: var(--text);
    opacity: .62;
    white-space: nowrap;
  }


  /* ---------- top bar ---------- */
  #topbar {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ctl {
    appearance: none;
    -webkit-appearance: none;
    background: rgba(19,26,34,.78);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 999px;
    color: var(--text);
    font-size: 13px;
    padding: 7px 30px 7px 14px;
    cursor: pointer;
    outline: none;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237d8fa3'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
    background-size: 15px;
    transition: border-color .15s;
  }
  .ctl:hover { border-color: rgba(77,163,255,.5); }
  .ctl:disabled { opacity: .45; cursor: default; }
  .ctl option { background: #131a22; color: var(--text); }
  .ctl.icon {
    padding: 7px;
    width: 32px; height: 32px;
    background-image: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ctl.icon svg { width: 15px; height: 15px; fill: var(--muted); }
  .ctl.icon:hover svg { fill: var(--text); }



  /* ---------- metrics panel ---------- */
  /* ---------- left column: metrics + sequence ---------- */
  #left-col {
    position: absolute;
    /* Anchored top and bottom rather than given a max-height, so the column
       always fills the gap between the top bar and the status bar. A
       max-height leaves it as tall as its content and no taller, which on a
       short panel stack wastes most of the available height. */
    top: 58px; bottom: 58px; left: 16px;
    z-index: 10;
    width: min(400px, calc(100% - 300px));
    /* The column itself never scrolls. It is a fixed stack of three panels
       that each scroll inside their own box, so all three stay on screen at
       once — the metrics, the sequence and the selection are all things the
       user compares against each other, and a column that scrolls hides two
       of them to show the third. */
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #left-col:empty { display: none; }

  /* ---------- the two panels, as bottom sheets ---------- */
  /* Both the left column and the agent panel start closed and open as a sheet
     over the bottom of the screen.

     They are the two things that compete with the structure for space. Three
     columns across a 390px phone leaves the structure a card-sized slit, and
     every attempt to make the columns narrower just made their contents
     unreadable. A sheet over the bottom gives the content the full width of
     the screen and keeps the structure visible above it — and on a phone the
     bottom of the screen is where a thumb already is.

     Closed means translated down out of sight and `visibility: hidden`, so
     nothing inside can be tabbed to or scrolled while it is shut. The
     transition is on the transform, which the compositor handles; `visibility`
     flips at the end so the sheet does not vanish mid-slide. */
  #left-col, #agent-panel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    top: auto;
    width: auto;
    min-width: 0;
    max-width: none;
    /* Above the status pill, which sits at the bottom and must stay reachable
       while a sheet is open. */
    padding-bottom: 56px;
    border-radius: 16px 16px 0 0;
    transform: translateY(101%);
    visibility: hidden;
    transition: transform .24s ease, visibility .24s;
    z-index: 30;
  }
  #left-col.open, #agent-panel.open {
    transform: translateY(0);
    visibility: visible;
  }
  /* The sheet is as tall as its content up to a cap, so a short panel does not
     become a tall empty box and a long one still scrolls. */
  #left-col { max-height: 72%; overflow-y: auto; }
  #agent-panel { max-height: 78%; }

  /* The handles. Top of the screen, in the two corners: the topbar is centred
     and leaves both edges free, and the bottom is where the sheets appear —
     a handle down there would be covered by the thing it opens. */
  #left-handle, #agent-handle {
    position: absolute;
    top: 14px;
    z-index: 22;
    width: 40px;
    height: 40px;
    /* Hidden by default and shown by the script on a small screen. The
       `display` here is the desktop value — the script sets `hidden`, and
       `[hidden]` only adds a second lock on a door that is already shut.
       Without this rule the handles would never appear at all. */
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(19, 26, 34, .82);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--text);
    cursor: pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  /* Shown only where the script has cleared `hidden` — a small screen. */
  #left-handle:not([hidden]), #agent-handle:not([hidden]) { display: flex; }
  #left-handle { left: 12px; }
  #agent-handle { right: 12px; }
  #left-handle[hidden], #agent-handle[hidden] { display: none; }
  #left-handle:hover, #agent-handle:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  /* While a sheet is open its handle is the close affordance, so it stays lit
     rather than looking inert. */
  #left-handle.on, #agent-handle.on {
    background: var(--accent);
    color: #04121f;
    border-color: var(--accent);
  }
  /* A sheet open means the other one is shut — two sheets over each other is
     not a thing anyone wants. The idle handle dims rather than hides, so the
     user can still see that the other panel exists. */
  #left-handle.dim, #agent-handle.dim { opacity: .45; }

  /* The panels' own fold buttons are gone: the sheet is the fold. A button
     inside a sheet that closes the sheet would be a second way to do one
     thing, and the handle is already where the user's thumb is. */
  .fold { display: none; }

  /* The sheet's content is laid out for a narrow column on the desktop; at full
     screen width it reads better as rows. */
  #left-col.open #metrics,
  #left-col.open #seq-panel,
  #left-col.open #selection { margin: 0 12px 10px; }
  #left-col.open #metrics:first-child { margin-top: 12px; }

  #metrics {
    background: rgba(19,26,34,.78);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 12px;
    padding: 12px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: none;
    /* The whole panel is one scrollable box, title included. It used to be a
       flex column with the rows and the notes scrolling separately, which
       left the title pinned and two scrollbars doing one job — and a
       max-height that reserved space the content did not fill, so the panel
       ended in eighty pixels of nothing. Now it is as tall as its content and
       scrolls as one piece when the column gives it less than that. */
    /* Bounded, but loosely: the panel takes what its content needs up to
       about a third of the column, and scrolls past that. Without the bound a
       run reporting twenty metrics pushes the panel to two thirds of the
       column and squeezes the sequence and selection to slivers.

       `height: fit-content` is what keeps the short case honest — a
       max-height alone reserves the space whether the content fills it or
       not, which is how the panel came to end in eighty pixels of nothing.
       With it the panel is exactly as tall as its metrics, up to the cap. */
    flex: 0 1 auto;
    height: fit-content;
    max-height: 34%;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  #metrics.show { display: block; }
  #metrics .m-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #metrics .m-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-size: 13px;
    padding: 2px 0;
  }
  #metrics .m-row .k { color: var(--muted); }
  #metrics .m-row .v { font-variant-numeric: tabular-nums; }
  /* Unit / direction hint, dimmed so the number still leads. */
  #metrics .m-hint {
    color: var(--muted);
    font-size: 11px;
    margin-left: 7px;
    opacity: .8;
  }
  #metrics .m-notes {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(34,48,64,.7);
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ---------- sequence panel ---------- */
  #seq-panel {
    background: rgba(19,26,34,.78);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 14px;
    padding: 12px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
    display: none;
    /* Scrolls inside its own box. The sequence is the longest thing in the
       column — thirty-odd chains of residues — and it gets the larger share
       of the height because it is the one most often read end to end. */
    flex: 1.4 1 0;
    min-height: 120px;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  #seq-panel.show { display: block; }
  #seq-panel .seq-head {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  #seq-panel .seq-body {
    font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--text);
    word-break: break-all;
    white-space: pre-wrap;
  }
  #seq-panel .seq-chain { margin-bottom: 10px; }
  #seq-panel .seq-chain:last-child { margin-bottom: 0; }
  #seq-panel .seq-chain-head {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 3px;
  }
  #seq-panel .seq-chain-name { letter-spacing: .02em; }
  #seq-panel .seq-eye {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    line-height: 1;
    color: #ffffff;
    opacity: .55;
    display: inline-flex;
    align-items: center;
  }
  #seq-panel .seq-eye svg { width: 13px; height: 13px; fill: currentColor; }
  #seq-panel .seq-eye:hover { opacity: 1; }
  #seq-panel .seq-eye.off { color: var(--muted); opacity: .8; }
  #seq-panel .seq-chain-seq { color: var(--text); }
  /* One span per residue so a drag can hit-test. Monospace keeps the
     letters on a fixed grid, which makes a drag across them land where the
     user expects rather than wherever a proportional font happens to put
     the next glyph. */
  #seq-panel .seq-chain-seq {
    font-family: monospace;
    line-height: 1.7;
    /* Letter spacing on the container, not the letters: it applies between
       every pair including the last of one row and the first of the next,
       so the grid stays even. In px rather than em so the pitch is exactly
       the 7 px asked for — the glyph is 6.4 px wide on its own, so this
       adds 0.6 px between neighbours. */
    letter-spacing: 0.6px;
    /* No word-break: the sequence is laid out in fixed 50-residue rows
     * rather than wrapped wherever the panel happens to end. Rows of a
     * known length line up between chains, so the same position in two
     * chains sits at the same x — which is what makes a comparison
     * readable. */
    user-select: none;
    cursor: crosshair;
  }
  /* One row of the sequence. `display: block` with the letters inline
     inside means the row is exactly as wide as its 50 letters and never
     breaks, so every row starts at the same x.
   *
     The negative right margin cancels the trailing letter-spacing that
     letter-spacing adds after the last letter — without it every row is
     one gap wider than its content, and a short last row leaves a visible
     stub of space. */
  #seq-panel .seq-row {
    display: block;
    white-space: nowrap;
    margin-right: -0.6px;
  }
  #seq-panel .seq-aa { border-radius: 2px; }
  #seq-panel .seq-aa:hover { background: rgba(77,163,255,.22); }
  /* The range being dragged right now. A hard colour rather than a tint:
     the letters underneath are already coloured by chain, and a translucent
     overlay on top of that reads as "dimmed" rather than "selected". */
  #seq-panel .seq-aa.seq-drag {
    background: var(--accent);
    color: #0b0f14;
  }
  /* Inside the drag and already selected: this one comes off when the
     mouse is released. Hollow rather than filled, so the two directions of
     the toggle read differently at a glance. */
  #seq-panel .seq-aa.seq-drag-off {
    background: transparent;
    color: var(--muted);
    text-decoration: line-through;
    opacity: .55;
  }
  /* Selected residues. The colour is set inline from the selection's own
     swatch, so a letter matches the highlight in the 3D view and the row in
     the Selection panel.
   *
   * No font-weight change: the sequence is monospace, and bolding it makes
   * every glyph wider, so selecting a residue shifts the letters after it
   * and the whole row reflows. The background already says "selected" — the
   * weight only made the text jump. */
  #seq-panel .seq-aa.seq-sel {
    color: #0b0f14;
  }

  /* ---------- selection panel ---------- */
  /* A card in the left column, under the sequence panel, rather than a
     floating overlay on the right. It used to sit over the viewer at the
     top right, where it covered whatever the user had just selected and
     fought with the structure label for the same corner. In the column it
     scrolls with the rest and never covers the model. */
  #selection {
    background: rgba(19,26,34,.78);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 14px;
    padding: 12px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
    display: none;
    /* Scrolls inside its own box, like the sequence. A selection can run to
       dozens of residues, and it has to stay reachable without pushing the
       other two panels off the screen. */
    flex: 1 1 0;
    min-height: 120px;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  #selection.show { display: block; }
  /* Two rows: the title, then the mode switch and clear. One row crammed
     four mode buttons and "clear all" against the title and wrapped. */
  #selection .s-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  #selection .s-tools {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0 10px;
  }
  #selection .s-clear {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 11px;
    cursor: pointer;
    padding: 0;
    text-transform: none;
    letter-spacing: 0;
  }
  #selection .s-clear:hover { text-decoration: underline; }
  #selection .s-mode {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
  }
  #selection .s-mode-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 3px 8px;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  #selection .s-mode-btn:hover { color: var(--text); }
  #selection .s-mode-btn.on {
    background: rgba(77,163,255,.18);
    color: var(--accent);
  }
  #selection .s-empty { font-size: 12px; color: var(--muted); line-height: 1.6; }
  /* The list scrolls on its own once it is tall, so a selection of forty
     residues does not push the metrics and sequence panels off the top of
     the column. */
  /* No cap here either, for the same reason: the column scrolls, so a second
     scrollbar inside it only splits the selection across two controls. */
  #sel-list {
    scrollbar-width: thin;
  }
  #selection .s-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 7px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  #selection .s-row:hover { background: rgba(77,163,255,.1); }
  #selection .s-swatch {
    width: 10px; height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  #selection .s-name { flex: 1; font-family: ui-monospace, Menlo, monospace; }
  #selection .s-del {
    background: none; border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
  }
  #selection .s-del:hover { color: var(--err); }

  /* ---------- agent panel ---------- */
  /* Sits against the right edge, full height between the top bar and the
     status bar. Collapsed it is a tab only, so the viewer keeps its width
     until the user asks for the chat. */
  #agent-panel {
    position: absolute;
    top: 58px; right: 16px; bottom: 58px;
    z-index: 12;
    width: min(400px, calc(100% - 480px));
    min-width: 300px;
    display: flex;
    flex-direction: column;
    background: rgba(19,26,34,.78);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 14px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
    overflow: hidden;
  }
  /* Collapsed: the panel becomes its own header, docked to the right edge.
     The body is display:none rather than height:0 so nothing inside it can
     be tabbed to or scrolled while it is shut. */
  #agent-panel.collapsed {
    top: 58px;
    bottom: auto;
    width: auto;
    min-width: 0;
  }
  #agent-panel.collapsed .ag-body { display: none; }
  #agent-panel.collapsed #ag-collapse { transform: rotate(180deg); }

  /* Narrow screens — a phone in landscape, or a small laptop.
     
     The desktop widths above are two fixed numbers that assume there is room
     for both: the left column takes up to 400px and the agent panel refuses to
     go under 300px. At 740px wide that leaves the 3D view minus two pixels,
     and at 800-900px it leaves a 40px slit. The structure is the thing being
     looked at, so it is the one that gets the space back.
     
     Both columns become a share of the screen rather than a size of their
     own, and the agent panel's min-width goes with them: 300px is a desktop
     comfort, and a panel that will not shrink is a panel that takes the
     stage.
     
     The layout stays three-across. A phone in landscape is wide enough for
     that, and re-flowing to a stacked layout would be a different interface
     rather than a smaller one.
     
     These come after the desktop rules on purpose. CSS lets the later rule
     win, so a media query placed before the block it is meant to override is
     overridden by it and does nothing at all. */
  /* A phone in portrait is asked to turn, not turned by force.
     
     The viewer is a three-across workspace: structure in the middle, metrics
     and sequence on the left, the agent panel on the right. At 390px wide
     there is no arrangement of that which is not cramped — the columns would
     take 125px each and leave a 100px slit for the thing being looked at.
     
     Rotating the page with a transform was tried and is not what this does.
     It works, but it fights the user: the address bar ends up on the side,
     the browser's own rotate prompt appears over it, and a page that has
     physically turned when the phone has not reads as broken rather than as
     guidance. So the page stays as it is and says what it wants.
     
     What it does instead: the agent panel starts collapsed, so the portrait
     screen is the structure plus the left column rather than three things
     competing; and a notice asks for landscape, which the user can satisfy
     by turning the phone — the one gesture that needs no explanation.
     
     The Screen Orientation API is still asked for, where it exists. It is a
     request the browser may refuse, and a refusal is fine: the notice is the
     fallback that always works. */
  /* A phone in portrait: the structure gets the screen, everything else is a
     drawer.

     The desktop layout is three columns because a desktop has the width for
     three. A portrait phone does not, and shrinking all three to fit is how
     you get an interface where nothing is comfortable: a 130px column of
     10px text, a 3D view the width of a business card, and touch targets
     sized for a mouse.

     So the phone gets one thing at a time. The structure fills the screen.
     The left column becomes a drawer that slides over it, opened by a button
     and closed by tapping the stage — the pattern every mobile app uses for
     secondary panels. The agent panel is a tab until asked for, as it is in
     landscape.

     What this buys, concretely, on a 390x844 screen:
       - the structure: 390px wide instead of ~150px
       - touch targets: the drawer's rows are full-width, not 130px
       - the top bar: one row of controls, not three columns of them

     The drawer is `visibility`-toggled rather than `display`, so the panels
     inside keep their scroll positions and their open/closed state while it
     is shut — reopening it does not rebuild what was there. */
  /* A small screen gets the desktop layout, scaled.
     
     Everything above is written for a screen with room for three columns, and
     every attempt to re-flow it for a phone has been worse than scaling it:
     three columns at 130px each with 10px type and mouse-sized touch targets
     is not a phone interface, it is a cramped desktop one. A drawer, a
     scrolling toolbar and a folded panel each fixed one symptom and introduced
     another.
     
     So the layout is left exactly as it is and the whole thing is scaled down.
     `#bb-scale` is a wrapper the script puts around everything in the body;
     the script measures how wide and tall the layout actually is and scales it
     to fit the screen. A phone held sideways gets the desktop layout at
     whatever fraction of its size fits — small, as asked for, and
     *proportionally* small: the same layout, the same relationships, nothing
     overlapping anything.
     
     The scale is a transform, so it costs nothing at layout time and the
     browser composites it on the GPU. What it does not do is reflow text, so
     nothing wraps differently than it does on a desktop — which is the point.
     
     The wrapper is only created below the desktop's minimum width. Above it
     the page is the page and no transform is involved. */
  @media (max-width: 1023px) {
    html, body { overflow: hidden; }
    /* The wrapper's size is set by the script, from the panels' own extents.
       It starts at the viewport so the first measurement has something to
       measure against, and grows to whatever the layout actually occupies. */
    #bb-scale {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
      width: 100%;
      height: 100%;
    }
  }

  #agent-panel .ag-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid rgba(34,48,64,.7);
    flex-shrink: 0;
  }
  /* The conversation list, dropped down over the transcript. Absolute so it
     does not squeeze the log when it opens, and capped in height so a long
     history scrolls instead of covering the whole panel. */
  #agent-panel .ag-sessions {
    position: absolute;
    top: 40px; left: 0; right: 0;
    z-index: 5;
    max-height: 60%;
    overflow-y: auto;
    background: rgba(19,26,34,.78);
    border-bottom: 1px solid rgba(34,48,64,.9);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    scrollbar-width: thin;
  }
  #agent-panel .ag-sessions[hidden] { display: none; }
  #agent-panel .ag-ses-head {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    padding: 9px 12px 5px;
  }
  #agent-panel .ag-ses-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 12px;
  }
  #agent-panel .ag-ses-row:hover { background: rgba(77,163,255,.1); }
  #agent-panel .ag-ses-row.on { background: rgba(77,163,255,.14); }
  #agent-panel .ag-ses-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #agent-panel .ag-ses-row.on .ag-ses-title { color: var(--accent); }
  #agent-panel .ag-ses-turns {
    font-size: 10px;
    color: var(--muted);
    flex-shrink: 0;
  }
  #agent-panel .ag-ses-del {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0 3px;
    flex-shrink: 0;
    visibility: hidden;
  }
  #agent-panel .ag-ses-row:hover .ag-ses-del { visibility: visible; }
  #agent-panel .ag-ses-del:hover { color: var(--err); }
  #agent-panel .ag-ses-empty {
    padding: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  #agent-panel .ag-title {
    flex: 1;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  /* The conversation buttons, hidden along with the body when the panel is
     collapsed. A collapsed panel is a tab, and a tab with three buttons on it
     is a toolbar the user did not ask for — the one thing worth keeping is the
     control that opens it again. */
  #agent-panel.collapsed .ag-head-btn { display: none; }
  #agent-panel .ag-icon-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 0 4px;
    transition: transform .15s, color .12s;
  }
  #agent-panel .ag-icon-btn:hover { color: var(--text); }

  /* The auto-approve switch, lit while it is on. The colour is the warning
     one because that is what it is: with it on, the agent runs commands
     nobody approved. A switch that looks the same in both states is a switch
     the user cannot read at a glance, and this one changes what the agent is
     allowed to do. */
  #ag-auto.on { color: var(--warn); }
  #ag-auto.on:hover { color: var(--warn); }

  #agent-panel .ag-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* The transcript. It is the only thing that scrolls, so the compose box
     and the context line stay put while the conversation grows. */
  #agent-panel .ag-log {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scrollbar-width: thin;
  }
  .ag-msg { display: flex; flex-direction: column; gap: 4px; max-width: 100%; }
  .ag-msg .ag-who {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .ag-msg .ag-text {
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    padding: 8px 11px;
    border-radius: 10px;
  }
  /* The model writes `code` for identifiers — chain ids, SMILES, file names.
     Monospacing them is what makes a reply scannable, and it costs one rule. */
  .ag-msg .ag-text code {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    background: rgba(11,15,20,.55);
    border-radius: 4px;
    padding: 0 4px;
  }
  /* A fenced block, which is how the model lays out anything columnar — a
     parameter summary, a chain list, a score table. Monospace and
     whitespace-preserving, because the alignment in the source is done with
     spaces and a proportional font collapses them into nothing. Without this
     the block arrives as ragged prose and the columns are gone. */
  .ag-msg .ag-text pre.ag-pre,
  .ag-msg .ag-think-text pre.ag-pre {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 11.5px;
    line-height: 1.5;
    white-space: pre;
    overflow-x: auto;
    background: rgba(11,15,20,.55);
    border: 1px solid rgba(34,48,64,.7);
    border-radius: 8px;
    padding: 9px 11px;
    margin: 6px 0;
    scrollbar-width: thin;
  }
  .ag-msg .ag-text b { color: var(--text); font-weight: 600; }
  .ag-msg.user { align-items: flex-end; }
  .ag-msg.user .ag-text {
    background: rgba(77,163,255,.16);
    border: 1px solid rgba(77,163,255,.28);
  }
  .ag-msg.assistant .ag-text {
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(34,48,64,.9);
  }
  .ag-msg.error .ag-text {
    background: rgba(248,113,113,.12);
    border: 1px solid rgba(248,113,113,.35);
    color: var(--err);
  }
  /* A tool call the model made, shown as a line under its message. The user
     asked about the structure; knowing the model looked at the selection
     before answering is the difference between an answer and a guess. */
  /* The tools the model called, folded the same way as the working above it.
     Both are the record of what happened before the answer, and both are
     long — a turn that reads four files produces four lines of paths. Shown
     open they push the answer off the bottom of a narrow panel; folded, the
     answer is what the user sees first and the evidence is one click away. */
  .ag-msg .ag-tools {
    margin-top: 2px;
  }
  .ag-msg .ag-tools > summary {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    cursor: pointer;
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    user-select: none;
  }
  .ag-msg .ag-tools > summary::-webkit-details-marker { display: none; }
  .ag-msg .ag-tools > summary::before {
    content: "▸";
    font-size: 9px;
    transition: transform .15s;
  }
  .ag-msg .ag-tools[open] > summary::before { transform: rotate(90deg); }
  .ag-msg .ag-tools > summary:hover { color: var(--text); }
  .ag-msg .ag-tools > summary .ag-tool-count {
    color: var(--accent);
    letter-spacing: 0;
  }
  .ag-tool-line {
    font-size: 11px;
    color: var(--muted);
    font-family: ui-monospace, Menlo, monospace;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 0 2px 14px;
    word-break: break-all;
  }
  .ag-tool-line::before {
    content: "⚙";
    font-size: 10px;
    color: var(--accent);
    flex-shrink: 0;
  }
  /* The model's working, shown above its answer and collapsed by default.
     A reasoning model's answer is easier to trust when the reading that
     produced it is visible — on a question about a specific structure the
     working is often where the actual looking happened. It is collapsed
     because it is long, and the answer is what the user asked for. */
  .ag-msg .ag-think {
    margin-bottom: 2px;
  }
  .ag-msg .ag-think > summary {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    cursor: pointer;
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    user-select: none;
  }
  .ag-msg .ag-think > summary::-webkit-details-marker { display: none; }
  .ag-msg .ag-think > summary::before {
    content: "▸";
    font-size: 9px;
    transition: transform .15s;
  }
  .ag-msg .ag-think[open] > summary::before { transform: rotate(90deg); }
  .ag-msg .ag-think > summary:hover { color: var(--text); }
  .ag-msg .ag-think-text {
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
    white-space: pre-wrap;
    word-break: break-word;
    background: rgba(11,15,20,.55);
    border-left: 2px solid rgba(77,163,255,.3);
    border-radius: 0 8px 8px 0;
    padding: 8px 11px;
    margin-top: 5px;
    max-height: 260px;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .ag-msg.pending .ag-text { opacity: .6; }
  .ag-msg.pending .ag-text::after {
    content: "▍";
    animation: ag-blink 1s steps(2) infinite;
    color: var(--accent);
  }
  @keyframes ag-blink { 50% { opacity: 0; } }

  /* While a turn runs, the header says so. A blinking cursor alone reads as
     "stuck" when the model is reading files or a skill script is running —
     both take real time and produce no text. Naming the state is the
     difference between a slow agent and a broken one. */
  /* On the message itself rather than on the (now absent) name row, so it
     still shows now that the agent's messages carry no label. */
  .ag-msg.pending::before {
    content: "运行中";
    align-self: flex-start;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(77,163,255,.16);
    color: var(--accent);
    font-size: 9px;
    letter-spacing: .04em;
    animation: ag-pulse 1.6s ease-in-out infinite;
  }
  @keyframes ag-pulse { 50% { opacity: .45; } }

  /* A permission request. The agent is blocked until this is answered, so it
     is styled as something waiting rather than as another log line — amber,
     because it is the one thing in the transcript that needs a decision. */
  /* A permission request, docked to the bottom of the panel above the
     compose box. It used to sit inside the transcript, where a long
     conversation pushed it out of sight — and the agent is blocked until it
     is answered, so an unseen prompt is a hung turn. Here it is always where
     the user is looking, and it goes away once answered. */
  #ag-perm {
    background: rgba(251,191,36,.1);
    border-top: 1px solid rgba(251,191,36,.35);
    padding: 9px 12px;
    flex-shrink: 0;
  }
  #ag-perm[hidden] { display: none; }
  #ag-perm .ag-perm-head {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--warn);
    margin-bottom: 5px;
  }
  #ag-perm .ag-perm-cmd {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 11px;
    color: var(--text);
    word-break: break-all;
    margin-bottom: 8px;
    max-height: 72px;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  #ag-perm .ag-perm-btns { display: flex; gap: 6px; }
  #ag-perm .ag-perm-btns button {
    flex: 1;
    border-radius: 7px;
    font-size: 11px;
    padding: 5px 8px;
    cursor: pointer;
    transition: background .12s;
  }
  #ag-perm .ag-perm-allow {
    background: rgba(74,222,128,.16);
    border: 1px solid rgba(74,222,128,.35);
    color: var(--ok);
  }
  #ag-perm .ag-perm-allow:hover { background: rgba(74,222,128,.26); }
  #ag-perm .ag-perm-deny {
    background: rgba(248,113,113,.14);
    border: 1px solid rgba(248,113,113,.35);
    color: var(--err);
  }
  #ag-perm .ag-perm-deny:hover { background: rgba(248,113,113,.24); }

  /* What the model can see, stated rather than implied. Without it the user
     cannot tell whether "the selection" means what they selected or nothing
     at all. */
  #agent-panel .ag-context {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 6px 12px;
    border-top: 1px solid rgba(34,48,64,.7);
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
  }
  #agent-panel .ag-ctx-label {
    text-transform: uppercase;
    letter-spacing: .06em;
    flex-shrink: 0;
  }
  #agent-panel .ag-ctx-text {
    font-family: ui-monospace, Menlo, monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #agent-panel .ag-compose {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid rgba(34,48,64,.7);
    flex-shrink: 0;
  }  #agent-panel .ag-compose textarea {
    flex: 1;
    resize: none;
    background: rgba(11,15,20,.55);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 10px;
    color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 8px 10px;
    max-height: 140px;
    outline: none;
  }
  #agent-panel .ag-compose textarea:focus { border-color: rgba(77,163,255,.5); }
  #agent-panel .ag-compose textarea::placeholder { color: var(--muted); }
  #agent-panel #ag-send {
    background: rgba(77,163,255,.18);
    border: 1px solid rgba(77,163,255,.35);
    border-radius: 10px;
    color: var(--accent);
    cursor: pointer;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .12s;
  }
  #agent-panel #ag-send:hover { background: rgba(77,163,255,.28); }
  #agent-panel #ag-send:disabled { opacity: .4; cursor: default; }

  /* While a turn runs the button is a stop control, and it is styled as one:
     amber rather than the send blue, and spinning. The rotation is what says
     "something is in progress" without the user having to read anything, and
     the colour change says the same click now does the opposite thing. */
  #agent-panel #ag-send.stopping {
    background: rgba(251,191,36,.18);
    border-color: rgba(251,191,36,.4);
    color: var(--warn);
  }
  #agent-panel #ag-send.stopping:hover { background: rgba(251,191,36,.3); }
  #agent-panel #ag-send.stopping #ag-stop-icon {
    animation: ag-spin 1.1s linear infinite;
  }
  /* The two icons are swapped with the `hidden` attribute, which the browser
     applies as `display: none` — but the button is a flex container, and a
     flex item's display is overridden by the layout, so the attribute alone
     leaves both icons drawn. The rule has to be spelled out. */
  #agent-panel #ag-send svg[hidden] { display: none; }
  @keyframes ag-spin { to { transform: rotate(360deg); } }

  #agent-panel .ag-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 12px 8px;
    flex-shrink: 0;
  }
  #agent-panel .ag-hint { font-size: 10px; color: var(--muted); }

  /* ---------- status bar ---------- */
  /* The status bar and the publish notice share one centred anchor. The
     wrapper is what is positioned and centred; the two pills inside it are
     laid out in a row, so the notice sits flush against the bar's left edge
     at any bar width. */
  #status-wrap {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    max-width: calc(100% - 32px);
  }
  #status {
    position: static;
    display: none;
    align-items: center;
    gap: 12px;
    background: rgba(19,26,34,.78);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 999px;
    padding: 9px 20px;
    font-size: 13px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0,0,0,.55),
                0 0 0 1px rgba(77,163,255,.08);
    max-width: calc(100% - 32px);
  }
  #status[data-state="running"] {
    border-color: rgba(77,163,255,.45);
    box-shadow: 0 8px 32px rgba(0,0,0,.55),
                0 0 18px rgba(77,163,255,.18);
  }
  #status[data-state="done"] { border-color: rgba(74,222,128,.45); }
  #status[data-state="error"] { border-color: rgba(248,113,113,.45); }
  #status.show { display: flex; }
  #status .dot {
    width: 15px; height: 15px;
    border-radius: 50%;
    border: 2px solid rgba(125,143,163,.35);
    border-top-color: var(--muted);
    flex-shrink: 0;
  }
  #status[data-state="running"] .dot {
    border-color: rgba(77,163,255,.25);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  #status[data-state="done"] .dot {
    border: none;
    width: 15px; height: 15px;
    background: var(--ok);
    border-radius: 50%;
    /* checkmark via clip-path */
    clip-path: polygon(
      14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
  }
  #status[data-state="error"] .dot {
    border: none;
    width: 15px; height: 15px;
    background: var(--err);
    border-radius: 50%;
    clip-path: polygon(
      20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%,
      50% 70%, 80% 100%, 100% 80%, 70% 50%,
      100% 20%, 80% 0%, 50% 30%);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* The message is one line, always. A long one used to wrap and grow the
     pill from a slim bar into a block covering the viewer — the status bar is
     the one thing that must stay out of the way while a run is going. It is
     capped and ellipsized instead, with the full text in the title attribute
     and in the history menu, where there is room to read it.

     `min-width: 0` is what lets the cap take effect: a flex item defaults to
     its content's width and will not shrink below it without it. */
  #status .msg {
    color: var(--text);
    min-width: 0;
    max-width: 46vw;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    flex-shrink: 1;
  }
  #status[data-state="error"] .msg { color: var(--err); }
  #status .bar {
    width: 120px; height: 6px;
    background: rgba(34,48,64,.9);
    border-radius: 3px;
    overflow: hidden;
    flex-shrink: 0;
  }
  #status .bar > div {
    height: 100%;
    background: linear-gradient(90deg, #2b7fd4, var(--accent));
    width: 0%;
    transition: width .5s ease;
    background-size: 20px 20px;
    background-image: linear-gradient(
      135deg,
      rgba(255,255,255,.22) 25%, transparent 25%,
      transparent 50%, rgba(255,255,255,.22) 50%,
      rgba(255,255,255,.22) 75%, transparent 75%);
    animation: stripes 1s linear infinite;
  }
  @keyframes stripes {
    from { background-position: 0 0; }
    to   { background-position: 20px 0; }
  }
  #status[data-state="done"] .bar > div {
    background: var(--ok);
    background-image: none;
    animation: none;
  }
  #status[data-state="error"] .bar > div {
    background: var(--err);
    background-image: none;
    animation: none;
  }
  #status .step { color: var(--muted); font-size: 12px; flex-shrink: 0; }

  /* ---------- machine load readout ---------- */
  /* Sits at the right end of the status pill. A vertical rule separates it
     from the progress text so the two groups read as one thing each. */
  #status .sys {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 12px;
    margin-left: 2px;
    border-left: 1px solid rgba(34,48,64,.9);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    flex-shrink: 0;
  }
  #status .sys-item {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    white-space: nowrap;
  }
  #status .sys-item .k { opacity: .65; }
  #status .sys-item .v { color: var(--text); }
  /* Colour the number by how loaded the machine is, so a busy GPU is
     visible at a glance without reading the digits. */
  #status .sys-item.warn .v { color: #fbbf24; }
  #status .sys-item.hot .v { color: var(--err); }

  /* ---------- status history ---------- */
  /* The pill is centred near the bottom of the screen, so the menu opens
     upward from it rather than downward into the viewer. */
  #status .st-hist {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    /* Sits at the left end of the pill, so the gap goes on its right. */
    margin-right: 2px;
    padding: 0;
    background: none;
    border: 1px solid transparent;
    border-radius: 5px;
    color: var(--muted);
    cursor: pointer;
    flex-shrink: 0;
  }
  #status .st-hist:hover {
    background: rgba(77,163,255,.14);
    border-color: rgba(77,163,255,.35);
    color: var(--accent);
  }
  #status .st-hist svg { width: 15px; height: 15px; fill: currentColor; }
  /* A structure was published while the user was elsewhere. It carries the
     accent colour and the structure's name, because unlike the history
     button it is not a control the user goes looking for — it is something
     that happened and is waiting.

     A sibling of #status, positioned against the same centre point and
     pulled left by its own width plus the gap, so it sits flush against the
     status bar's left edge. The negative right margin closes the seam: the
     notice's right border-radius is squared off and the status pill's left
     one is too, so the two read as one control rather than two pills that
     happen to touch.

     `[hidden]` is restated because the display rule below would otherwise
     win on specificity and the button would never disappear. */
  /* A structure was published while the user was elsewhere. A small circle
     with a bell, matching the status bar's own dot in size and weight — it
     says "something is waiting" without claiming any of the bar's width, and
     the structure's name is in the tooltip.

     A sibling of #status inside #status-wrap, so it sits beside the bar
     rather than stretching it.

     `[hidden]` is restated because the display rule below would otherwise
     win on specificity and the button would never disappear. */
  .st-notice[hidden] { display: none; }
  .st-notice {
    display: flex;
    align-items: center;
    gap: 7px;
    /* A pill rather than the circle it used to be, because it now carries a
       label. The height still matches the status pill — 9px of padding
       either side of a 13px line — so the two sit on the same optical line
       instead of one looming over the other. */
    height: 39px;
    padding: 0 15px 0 13px;
    margin-right: 8px;
    /* Amber, not the accent blue. The status bar already uses blue for a run
       in progress, so a blue notice reads as more of the same and gets skimmed
       past; red is taken for errors, and a new structure is not an error. It
       is something waiting, which is what amber means everywhere else. */
    background: rgba(251,191,36,.14);
    border: 1px solid rgba(251,191,36,.55);
    border-radius: 999px;
    color: var(--warn);
    cursor: pointer;
    flex-shrink: 0;
    font-size: 13px;
    white-space: nowrap;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .st-notice:hover {
    background: rgba(251,191,36,.26);
    border-color: rgba(251,191,36,.95);
  }
  .st-notice svg { width: 17px; height: 17px; fill: currentColor; flex-shrink: 0; }
  /* The name is kept in the DOM for the tooltip and for tests, but it is not
     drawn — the label and the bell are what the user reads. */
  .st-notice-name { display: none; }
  #status .st-menu {
    position: absolute;
    /* Absolute, so it does not take a slot in the pill's flex row and
       push the progress bar off centre while closed. Anchored to the left
       edge, under the chevron that opens it. */
    bottom: calc(100% + 8px);
    left: 0;
    width: min(420px, calc(100vw - 32px));
    max-height: 60vh;
    overflow-y: auto;
    background: rgba(19,26,34,.78);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 10px;
    padding: 5px;
    box-shadow: 0 -10px 32px rgba(0,0,0,.5);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 30;
    scrollbar-width: thin;
  }
  #status .st-menu:empty { display: none; }
  /* ---------- a task and its steps ---------- */
  /* A long run is a sequence of small tasks. Each step keeps its own row so
     a finished one stays visible and clickable, and the task heading above
     them says which run they belong to and how far it has got. */
  #status .st-task {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 9px 3px;
    font-size: 11.5px;
    color: var(--text);
  }
  #status .st-task-name {
    font-weight: 600;
    letter-spacing: .01em;
  }
  #status .st-task-prog {
    margin-left: auto;
    font-size: 10px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  /* Clear the whole task. The task list is the record of every run this
     session, and without this it grows into a history of everything rather
     than a list of what is open now. It sits on the heading rather than a
     step because it removes all of them, and it is quiet until hovered so
     the heading still reads as a name and a count. */
  #status .st-task-del {
    margin-left: 6px;
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity .12s, background .12s, color .12s;
  }
  #status .st-task:hover .st-task-del { opacity: .7; }
  #status .st-task-del:hover {
    opacity: 1;
    background: rgba(255,107,107,.16);
    color: #ff8f8f;
  }
  #status .st-task-del:disabled {
    cursor: default;
    opacity: .25;
  }
  /* Steps sit under their task heading, indented so the hierarchy reads at
     a glance without a tree widget. */
  #status .st-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 7px 9px 7px 20px;
    border-radius: 7px;
    font-size: 12px;
    line-height: 1.45;
  }
  #status .st-row + .st-row {
    border-top: 1px solid rgba(34,48,64,.5);
  }
  #status .st-row .st-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
    background: var(--muted);
  }
  #status .st-row[data-state="running"] .st-dot { background: var(--accent); }
  #status .st-row[data-state="done"] .st-dot { background: var(--ok); }
  #status .st-row[data-state="error"] .st-dot { background: var(--err); }
  /* A step that published a structure. The bar on the left is the same
     accent the running dot uses, which reads as "this one produced
     something" rather than as another state — the state is already on the
     dot, and this is about what the step left behind. */
  #status .st-row[data-has-structure] {
    box-shadow: inset 2px 0 0 var(--accent);
  }
  /* The marker in the meta line, so the distinction survives a scan of the
     text rather than only the row's edge. */
  #status .st-row[data-has-structure] .st-meta { color: var(--accent); }
  #status .st-row .st-body { flex: 1; min-width: 0; }
  /* One line here too, for the same reason as the pill: a row that wraps to
     four lines pushes the other steps of the task out of view, and the menu
     is a list to scan rather than a place to read. The full text is in the
     row's title. */
  #status .st-row .st-msg {
    color: var(--text);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  #status .st-row[data-state="error"] .st-msg { color: var(--err); }
  #status .st-row .st-meta {
    display: flex;
    gap: 8px;
    margin-top: 2px;
    font-size: 10.5px;
    color: var(--muted);
  }
  /* Group headings — 运行中 / 排队中 / 已完成. Small caps rather than a
     coloured bar: the menu is already dense, and the dot on each row carries
     the state. */
  #status .st-group {
    padding: 8px 9px 4px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    opacity: .75;
  }
  #status .st-group:first-child { padding-top: 4px; }
  /* The step currently on the pill, so the menu says which row is the one
     being shown at the bottom of the screen. */
  #status .st-row.on { background: rgba(77,163,255,.14); }
  /* A finished step leads somewhere. The pointer and the hover tint say so
     without adding a chevron or a label — the row already carries a state
     dot, and a third affordance would be noise. */
  #status .st-row.st-clickable { cursor: pointer; }
  #status .st-row.st-clickable:hover { background: rgba(77,163,255,.12); }
  /* A running step's progress, inline under its message. Narrower than the
     pill's bar — this one is a glance, not the primary readout. */
  #status .st-row .st-bar {
    width: 100%;
    height: 3px;
    margin-top: 5px;
    background: rgba(34,48,64,.9);
    border-radius: 2px;
    overflow: hidden;
  }
  #status .st-row .st-bar > div {
    height: 100%;
    background: var(--accent);
    transition: width .5s ease;
  }
  #status .st-row .st-skill { color: var(--accent); opacity: .8; }
  /* A step's own numbers, under its message. Same label/value layout as the
     metrics panel so a figure reads identically in both places, at the
     smaller size the menu runs at. */
  #status .st-metrics {
    margin-top: 5px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  #status .st-metrics .m-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 11px;
    line-height: 1.5;
  }
  #status .st-metrics .m-row .k { color: var(--muted); }
  #status .st-metrics .m-row .v {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  #status .st-metrics .m-hint {
    color: var(--muted);
    font-size: 10px;
    margin-left: 6px;
    opacity: .8;
  }
  #status .st-empty {
    padding: 14px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

</style>
</head>
<body>

<div id="viewer-wrap">
  <div id="viewer"></div>
  <div id="hover-tip" hidden></div>
  <!-- The empty stage. One word, because the panel beside it already says
       what to type and the agent's own replies say what it can do — a
       paragraph here was the page explaining itself twice. -->
  <div id="viewer-hint">
    <!-- The mark and the name on one line. Inline SVG rather than a file: it
         is a handful of shapes, it scales with the text, and it inherits the
         accent colour instead of carrying its own that may not match. -->
    <div class="brand">
      <svg class="mark" viewBox="0 0 48 48" width="46" height="46"
           fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" aria-hidden="true">
        <!-- A small molecule: three atoms in a ring with a substituent, which
             is the shape most of this platform's work starts from. -->
        <path d="M24 8 L37 16 L37 32 L24 40 L11 32 L11 16 Z" opacity=".38"/>
        <path d="M24 8 L24 20 M37 16 L27 25 M37 32 L27 25 M11 16 L21 25 M11 32 L21 25"
              opacity=".38"/>
        <circle cx="24" cy="8" r="3.4" fill="currentColor" stroke="none"/>
        <circle cx="37" cy="16" r="3.4" fill="currentColor" stroke="none"/>
        <circle cx="37" cy="32" r="3.4" fill="currentColor" stroke="none"/>
        <circle cx="11" cy="32" r="3.4" fill="currentColor" stroke="none"/>
        <circle cx="11" cy="16" r="3.4" fill="currentColor" stroke="none"/>
        <!-- The centre atom is the one the design is built around, so it is
             drawn larger and hollow rather than solid like the rest. -->
        <circle cx="24" cy="24" r="5.2" fill="var(--bg)" stroke-width="2"/>
      </svg>
      <div class="big">BioBench</div>
    </div>
    <div class="tag">
      生物分子设计工作台 — 用自然语言驱动对接、设计与分析，
      结果直接显示在这个舒视器里。
    </div>
    <!-- The capabilities, named after the skills that actually exist. A tag
         for something the agent cannot do is worse than no tag: the user asks
         for it, is told no, and every other tag is now in doubt. -->
    <div class="caps">
      <span>分子对接</span>
      <span>结合剂设计</span>
      <span>分子生成</span>
      <span>序列设计</span>
      <span>分子动力学</span>
      <span>结构对比</span>
    </div>
  </div>
</div>


<!-- Two handles for the two panels, both of which live at the bottom of the
     screen when open.

     The left column and the agent panel are the two things that compete with
     the structure for space, and on a small screen they win too often: three
     columns across a 390px phone leaves the structure a card-sized slit. So
     both start closed and both open as a sheet over the bottom of the screen,
     where there is room for their content and where a thumb can reach them.

     The handles sit at the top, beside the structure name, because that is
     where the user is already looking and because the bottom of the screen is
     where the sheets appear — a handle at the bottom would be covered by the
     thing it opens. -->
<button id="left-handle" type="button" title="指标与序列">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
       stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
       aria-hidden="true">
    <path d="M4 7h16M4 12h16M4 17h10"/>
  </svg>
</button>
<button id="agent-handle" type="button" title="对话">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
       stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
       stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/>
  </svg>
</button>


<div id="topbar">
    <select id="style-picker" class="ctl" disabled>
      <option value="surface">Surface</option>
      <option value="cartoon">Cartoon</option>
      <option value="stick">Stick</option>
      <option value="sphere">Sphere</option>
      <option value="line">Line</option>
    </select>
    <select id="color-picker" class="ctl" disabled>
      <option value="chain">By chain</option>
      <option value="spectrum">Spectrum</option>
      <option value="secondary">Secondary</option>
    </select>
    <select id="ligand-style-picker" class="ctl" disabled title="Ligand rendering">
      <option value="stick">Stick</option>
      <option value="ballstick">Ball &amp; stick</option>
      <option value="spacefill">Space fill</option>
      <option value="line">Line</option>
    </select>
    <!-- The backdrop the structure is drawn on. Not a rendering option — the
         model is the same in all three — but a choice about the surround it is
         read against, which is why it sits with the view controls and not with
         the style pickers. -->
    <select id="stage-sel" class="ctl" title="背景">
      <option value="dark">背景：深蓝</option>
      <option value="grey">背景：灰</option>
      <option value="black">背景：纯黑</option>
      <option value="custom">背景：自定义…</option>
    </select>
    <!-- Hidden until the custom backdrop is chosen. A visible file input in
         the toolbar is a control that does nothing most of the time; this one
         only appears when there is a reason to press it. -->
    <!-- The accept list is the four types the server writes, not image/*.
         A wider filter lets the picker offer BMP, HEIC or AVIF, which are
         refused after the file has been chosen and read — the user picks a
         picture and is told no, with nothing to show for the round trip. -->
    <input type="file" id="stage-file"
          accept="image/png,image/jpeg,image/webp,image/gif" hidden>
    <!-- Opens the picker for a custom backdrop. Hidden until the custom
         option is chosen, so the toolbar gains a control only when there is
         a reason to press it. -->
    <button id="stage-pick" class="ctl" type="button" hidden
            title="选择背景图片">选图</button>
    <button id="reset-btn" class="ctl icon" disabled title="Reset view">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97-.7-2.8L3.84 11.66C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" opacity="0"/><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>

<div id="left-col">
  <div id="metrics">
    <div class="m-title">Metrics</div>
    <div id="metrics-rows"></div>
    <div class="m-notes" id="metrics-notes"></div>
  </div>

  <div id="seq-panel">
    <div class="seq-head">
      <span id="seq-title">Sequence</span>
      <span id="seq-len"></span>
    </div>
    <div class="seq-body" id="seq-body"></div>
  </div>

  <div id="selection">
    <div class="s-head">
      <span>Selection</span>
      <button class="s-clear" id="sel-clear">clear all</button>
    </div>
    <div class="s-tools">
      <span class="s-mode" id="sel-mode" title="What a click selects: a residue, a whole chain, a single atom, or a bond">
        <button class="s-mode-btn on" data-mode="res">Res</button>
        <button class="s-mode-btn" data-mode="chain">Chain</button>
        <button class="s-mode-btn" data-mode="atom">Atom</button>
        <button class="s-mode-btn" data-mode="bond">Bond</button>
      </span>
    </div>
    <div id="sel-list"></div>

    <!-- Full screen. A button rather than something the page does to itself,
         because the browser allows nothing else: requestFullscreen() outside a
         user gesture is refused every time, so a page that tries on load gets a
         rejection in the console and no full screen. One tap is the whole cost,
         and what it buys on a phone is the 80-100px the address bar and the
         browser toolbar were taking.

         Hidden where it cannot work — no Fullscreen API, or an iPhone, where
         Safari has never supported it. On an iPhone the equivalent is "add to
         home screen", which opens in a standalone window with no browser chrome
         at all. -->
    <button id="fs-btn" class="ctl" type="button" title="全屏观看" hidden>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
           stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
    </button>
  </div>
</div>

<!-- ---------- agent panel (right) ---------- -->
<!-- A chat with the model that drives the skills. It is a sibling of the
     viewer rather than an overlay on it: the model is asked about the
     structure on screen, so both have to be visible at once, and a panel
     that covers half the model to answer a question about it is worse than
     no panel.

     The panel is collapsed to a tab by default. It costs a third of the
     width when open, and most of the time the user is looking at the
     structure rather than talking to it. -->
<div id="agent-panel">
  <div class="ag-head">
    <!-- The panel is named once, here. It used to read "Agent" with the model
         beside it, which was two labels for one thing; the name is what the
         user needs and the model is an implementation detail. -->
    <span class="ag-title" id="ag-model" title="The model answering">biobench</span>
    <!-- Automatic approval. Off by default: the permission prompt is the one
         place the user sees what the agent is about to run. On, every request
         is answered without asking, which is what makes a long skill sequence
         run unattended — and what makes it unsafe to leave on around a
         structure you care about. The state is on the server, so it survives
         a reload and is shared by every tab. -->
    <button class="ag-icon-btn ag-head-btn" id="ag-auto" type="button"
            title="自动许可：关闭（点击开启）">⏵</button>
    <button class="ag-icon-btn ag-head-btn" id="ag-new" type="button" title="新建对话">＋</button>
    <button class="ag-icon-btn ag-head-btn" id="ag-history-btn" type="button" title="历史对话">☰</button>
    <button class="ag-icon-btn" id="ag-collapse" type="button" title="收起面板">›</button>
  </div>

  <!-- The conversation list. A dropdown rather than a sidebar: it is looked at
       occasionally to switch or delete, and a sidebar would cost panel width
       the rest of the time. -->
  <div class="ag-sessions" id="ag-sessions" hidden>
    <div class="ag-ses-head">历史对话</div>
    <div class="ag-ses-list" id="ag-ses-list"></div>
  </div>

  <div class="ag-body" id="ag-body">
    <div class="ag-log" id="ag-log"></div>

    <div class="ag-context" id="ag-context" hidden>
      <span class="ag-ctx-label">上下文</span>
      <span class="ag-ctx-text" id="ag-ctx-text"></span>
    </div>

    <!-- A permission request, docked here rather than inside the transcript.
         The agent blocks until it is answered, so a prompt buried under a
         long conversation is a turn that hangs with no visible cause. Hidden
         until there is something to ask. -->
    <div id="ag-perm" hidden>
      <div class="ag-perm-head"></div>
      <div class="ag-perm-cmd"></div>
      <div class="ag-perm-btns"></div>
    </div>

    <form class="ag-compose" id="ag-compose" autocomplete="off">
      <textarea id="ag-input" rows="1" placeholder="问 Agent，或让它改这个结构…"
                spellcheck="false"></textarea>
      <!-- One button, two jobs. While a turn runs it becomes a stop control:
           the same corner of the panel is where the user looks for "make this
           stop", and a disabled send button there says nothing can be done
           when the one thing worth doing is to cancel. -->
      <button type="submit" id="ag-send" title="发送">
        <svg id="ag-send-icon" viewBox="0 0 24 24" width="16" height="16"
             fill="currentColor">
          <path d="M3 20l18-8L3 4v6l12 2-12 2z"/>
        </svg>
        <svg id="ag-stop-icon" viewBox="0 0 24 24" width="16" height="16"
             fill="currentColor" hidden>
          <rect x="7" y="7" width="10" height="10" rx="1.5"/>
        </svg>
      </button>
    </form>

    <div class="ag-foot">
      <span class="ag-hint" id="ag-hint">Enter 发送 · Shift+Enter 换行</span>
    </div>
  </div>
</div>

<!-- A structure was published while the user was looking at something else.
     The tab is already open; this says so, and clicking it goes there.

     A sibling of #status rather than a child, so it keeps its own pill shape
     and sits beside the status bar instead of stretching it. The two are
     positioned against the same point and the notice carries a negative
     right margin, so they read as one control with the notice as its left
     end — which is where the one thing waiting for the user belongs. -->
<!-- The status bar and the publish notice share one centred anchor, so they
     are wrapped: the wrapper is what gets centred and the two pills sit in it
     side by side. Centred separately, each would land wherever its own width
     put it and the notice would not line up with the bar. -->
<div id="status-wrap">
<!-- A structure was published while the user was looking at something else.
     The tab is already open — the poll adds it — so this is not the only way
     to reach the structure, it is the way that does not require the user to
     notice a new entry in the switcher. Clicking it goes there and clears it.

     The label says what happened rather than leaving a bell to be decoded: a
     bare icon is a thing to interpret, and "新任务已完成" next to it is not.
     It is bound to the newest publish every time one arrives, whether or not
     the user clicked the last one — an unclicked notice is not a dismissed
     one, and the button has to keep pointing at what is actually new. -->
<button class="st-notice" id="st-notice" type="button" hidden
        title="有新结构发布，点击查看">
  <span class="st-notice-label">新任务已完成</span>
  <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25-2 6.5-2 6.5h18S19 14.25 19 9a7 7 0 0 0-7-7zM9.5 19a2.5 2.5 0 0 0 5 0z"/></svg>
  <span class="st-notice-name"></span>
</button>

<div id="status">
  <!-- Past runs. The pill shows only the newest status, so without this a
       finished run leaves no trace of what it did. The chevron points up
       because the menu opens upward from the pill — the same triangle the
       structure switcher uses at the top left, turned over, so the two read
       as the same kind of control. It sits at the left end so the progress
       text and machine load stay together on the right. -->
  <button class="st-hist" id="st-hist" type="button" title="历史任务">
    <svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5z"/></svg>
  </button>
  <span class="dot"></span>
  <span class="msg"></span>
  <span class="bar"><div></div></span>
  <span class="step"></span>
  <!-- Machine load, so a slow run can be told apart from a hung one. -->
  <span class="sys" id="sys">
    <span class="sys-item" id="sys-cpu" title="CPU 占用率"></span>
    <span class="sys-item" id="sys-gpu" title="GPU 占用率" hidden></span>
    <span class="sys-item" id="sys-mem" title="内存占用"></span>
  </span>
  <div class="st-menu" id="st-menu" hidden></div>
</div>
</div>

<script>
// A browser caps the number of live WebGL contexts (~16 in Chrome). Each
// 3Dmol viewer holds one, so a page that has created and abandoned many
// viewers — or several tabs of this app — eventually gets null back from
// getContext and the canvas stays blank with no explanation. Detect that
// and say so, with the fix.
function webglAvailable() {
  try {
    const c = document.createElement("canvas");
    return !!(c.getContext("webgl2") || c.getContext("webgl"));
  } catch (e) {
    return false;
  }
}

const viewer = $3Dmol.createViewer("viewer", { backgroundColor: "#0b0f14" });

// Keep the canvas matched to its container.
//
// 3Dmol sizes the WebGL canvas once, from the container's box at the moment
// createViewer runs. Nothing revisits it afterwards, so every later change of
// that box leaves the drawing at the old size — stretched, letterboxed, or
// clipped, depending on which way it moved.
//
// Two things move it here. A window resize is the obvious one. The other is
// the portrait rotation: the page is turned with a CSS transform, which
// changes the container's on-screen size without any resize event firing at
// all, so the listener alone would miss it. The orientation listener covers
// that, and a rAF-deferred resize lets the transform land before the canvas
// is measured.
//
// Debounced, because a drag-resize fires this per pixel and a resize per
// pixel is a shuck of the GL context for no benefit.
(function watchViewerSize() {
  let queued = null;
  const apply = () => {
    queued = null;
    try {
      viewer.resize();
      viewer.render();
    } catch (e) { /* mid-teardown; the next event rebuilds it */ }
  };
  const schedule = () => {
    if (queued !== null) return;
    queued = requestAnimationFrame(apply);
  };
  window.addEventListener("resize", schedule);
  // Fires on the rotation the CSS performs, and on a device turn the Screen
  // Orientation API performs. Either way the box has changed.
  window.addEventListener("orientationchange", schedule);
  // The rotation is applied by a media query, which can also change under a
  // fold, a dock, or a browser chrome appearing on scroll. matchMedia is the
  // only hook for those.
  const portrait = window.matchMedia("(orientation: portrait)");
  if (portrait.addEventListener) portrait.addEventListener("change", schedule);
})();

/* ---------------- stage theme ---------------- */

// The backdrop the structure is drawn on.
//
// Only the viewer's surround changes — the panels, the text and the accents
// stay as they are. A structure is read like a figure, and the right ground
// behind it is a matter of the room and the eyes doing the reading; the rest
// of the interface is not part of that question and re-theming it too would
// make the choice bigger than it needs to be.
//
// Each entry is the gradient the page draws and the colour the canvas is
// painted with. They are the same colour in two forms because the canvas is
// transparent where nothing is drawn, and a mismatch shows as a seam around
// the model.
const STAGES = {
  dark:  { css: ["#16202b", "#0b0f14"], hex: "#0b0f14" },
  grey:  { css: ["#3a424d", "#232930"], hex: "#232930" },
  black: { css: ["#1a1a1a", "#000000"], hex: "#000000" },
};

const STAGE_KEY = "biobench.stage";
const STAGE_IMAGE_KEY = "biobench.stageImage";

function stageApply(name) {
  const wrap = document.getElementById("viewer-wrap");
  const sel = document.getElementById("stage-sel");
  // "custom" is not in the table — it is the one option that means "the
  // image on disk" rather than a colour. Everything else has to be a name in
  // the table, and one that is not — a backdrop that was removed, or one
  // saved by an older build — falls back to the default rather than being
  // treated as custom, which would leave the select saying "custom" over a
  // colour backdrop.
  const isCustom = name === "custom";
  // A name that is no longer in the table — a backdrop that was removed, or
  // one saved by an older build — is applied as the default. Done here
  // rather than by falling through, because the branch below is the custom
  // image and a stale name must not be mistaken for it.
  const stage = isCustom ? null : (STAGES[name] || STAGES.dark);

  if (stage) {
    // A colour backdrop. Written on the wrapper rather than the body, so
    // nothing outside the viewer can be affected by the choice.
    if (wrap) {
      wrap.style.background =
        `radial-gradient(ellipse at 50% 40%, ${stage.css[0]} 0%, ${stage.css[1]} 70%)`;
    }
    // The canvas is repainted too. Without this the model keeps the colour it
    // was drawn with and the surround changes around it, which leaves a
    // visible edge where the two meet.
    // Alpha 1, stated rather than left to the default: the custom mode sets
    // it to 0, and a canvas left transparent under a colour backdrop shows
    // the page's own background through the model instead of the stage's.
    try {
      viewer.setBackgroundColor(stage.hex, 1);
    } catch (e) { /* a viewer that has not finished initialising */ }
    if (sel) sel.value = name;
    return;
  }

  // The custom image. The canvas stays transparent so the picture shows
  // through it — painting the canvas a colour here would cover the image
  // with that colour, which is the one thing this mode exists to avoid.
  if (stageImageUrl) {
    if (wrap) {
      wrap.style.background =
        `center / cover no-repeat url("${stageImageUrl}")`;
    }
    // The canvas is made transparent so the picture behind it shows through.
    //
    // setBackgroundColor's second argument is alpha, and it is the only way
    // to get a see-through canvas: the WebGL renderer clears to an opaque
    // colour by default, and an opaque canvas covers whatever the page put
    // behind it — which is the whole picture, in this mode. The colour itself
    // is irrelevant at alpha 0, but a value still has to be given because
    // 3Dmol resolves it through its colour table and an unknown name logs an
    // error and leaves the previous colour in place.
    try {
      viewer.setBackgroundColor("#000000", 0);
    } catch (e) { /* not initialised yet */ }
  }
  if (sel) sel.value = "custom";
  // The pick button stays: the user is in custom mode and may well want to
  // swap the picture, which is one press rather than going back through the
  // select.
  if (stagePickBtn) stagePickBtn.hidden = false;
}

// The URL of the backdrop image on the server, or "" when there is none.
//
// Remembered so a reload puts the same picture back without asking for the
// file again — the bytes are already on disk, and a file picker on every
// page load is a request the user cannot do anything useful with.
let stageImageUrl = "";

function stageLoad() {
  let name = "dark";
  try {
    name = localStorage.getItem(STAGE_KEY) || "dark";
    stageImageUrl = localStorage.getItem(STAGE_IMAGE_KEY) || "";
  } catch (e) { /* private mode */ }
  // A saved image that the server no longer has — cleared from the
  // directory, or a fresh checkout — falls back to the colour backdrop
  // rather than showing an empty stage.
  if (name === "custom" && !stageImageUrl) name = "dark";
  stageApply(name);
}

/* ================= state =================
 *
 * Everything mutable lives here. The viewer previously kept eight
 * top-level variables — selection, hiddenChains, tabs, activeTab, chains,
 * state.meta, lastUpdated, state.structureName — and every one of them was
 * read and written from several unrelated functions. That is what made the
 * tab bugs so hard to pin down: a state.selection could be saved, cleared, and
 * repainted by three different callers with no single place to look.
 *
 * One object, mutated only through the helpers below, so the question
 * "what is selected right now" has exactly one answer.
 */
const state = {
  /** Chains of the loaded structure: [{chain, seq, residues}] */
  chains: [],
  /** current.json of the active structure */
  meta: {},
  /** Timestamp of the contract file the active tab was loaded from */
  lastUpdated: null,
