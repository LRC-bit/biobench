  agentFormat(body, reasoning);
  d.append(sum, body);
  return d;
}

// The tools the model called, folded like the working above it.
//
// `open` starts false: the answer is what the user asked for, and a turn that
// read four files produces four lines of paths that would push it off the
// bottom of a narrow panel. The count is in the summary so the evidence is
// still visible without opening anything.
function agentToolBox(tools) {
  const d = document.createElement("details");
  d.className = "ag-tools";
  const sum = document.createElement("summary");
  const count = document.createElement("span");
  count.className = "ag-tool-count";
  count.textContent = `${tools.length} 次调用`;
  sum.append(document.createTextNode("工具调用"), count);
  d.appendChild(sum);
  tools.forEach(t => {
    const line = document.createElement("div");
    line.className = "ag-tool-line";
    line.textContent = t;
    d.appendChild(line);
  });
  return d;
}

function agentAppend(role, text, tools, reasoning) {
  const wrap = document.createElement("div");
  wrap.className = `ag-msg ${role}`;

  // No label on the agent's own messages. The panel is the agent — there is
  // nothing else it could be, and a name above every reply is a line of
  // chrome that says the same thing each time. The user's messages keep
  // theirs, because there the label is what tells the two apart.
  const who = document.createElement("div");
  who.className = "ag-who";
  who.textContent = role === "user" ? "你"
    : role === "error" ? "错误" : "";
  who.hidden = role !== "user" && role !== "error";

  // The order is the order the work happened in: the model thinks, acts on
  // what it found, then answers. Reading it that way round is following the
  // reasoning through to its conclusion; with the answer first it is a
  // justification after the fact.
  if (reasoning) wrap.appendChild(agentThinkBlock(reasoning));

  // The tools the model called, named between the working and the answer.
  // The user asked about the structure on screen; seeing that the model
  // actually looked at it is the difference between trusting the answer and
  // not — and it belongs here, where it was in the sequence, rather than
  // after an answer it was the basis for.
  if (tools && tools.length) {
    wrap.appendChild(agentToolBox(tools));
  }

  const body = document.createElement("div");
  body.className = "ag-text";
  agentFormat(body, text);

  wrap.append(who, body);

  agentLog.appendChild(wrap);
  agentScrollToEnd();
  return wrap;
}

function agentSetBusy(on) {
  agentBusy = on;
  // The button stays enabled while a turn runs — it is the stop control. The
  // textarea stays enabled too: a turn that runs a skill takes minutes, and
  // the user often knows what they want to ask next while it works. Locking
  // the box threw that away and left them waiting with nothing to do.
  //
  // What is locked is sending, not typing. A message typed during a turn is
  // held in the box and sent when the turn ends — see agentQueueDraft().
  agentSend.disabled = false;
  agentSend.classList.toggle("stopping", on);
  // setAttribute rather than the `hidden` property: on an SVG element that
  // property is not the HTML boolean attribute, and assigning to it does
  // nothing the CSS can see — both icons stay drawn, one on top of the other.
  if (on) {
    agentSendIcon.setAttribute("hidden", "");
    agentStopIcon.removeAttribute("hidden");
  } else {
    agentSendIcon.removeAttribute("hidden");
    agentStopIcon.setAttribute("hidden", "");
  }
  agentSend.title = on ? "停止" : "发送";
  // The placeholder is the only feedback there is while the answer streams,
  // so it says what the panel is doing rather than repeating the hint.
  if (!agentWatchedJobs) {
    agentInput.placeholder = on ? "Agent 正在工作…"
                                : "问 Agent，或让它改这个结构…";
  }
}

// What the model can see, stated in the panel rather than left implicit.
// Without it the user cannot tell whether "the selection" means what they
// selected or nothing at all — and a model answering about an empty
// selection looks like it is ignoring them.
// What the user has selected, as a line the model can read.
//
// Attached to every message so the agent does not have to spend a tool call
// finding out what is being pointed at. The form matches what the Selection
// panel already shows the user, so the two never disagree about what is
// chosen — and the residue names carry their chain and number, which is what
// makes "this" resolvable to a specific part of the structure.
function agentSelectionSummary() {
  const keys = Object.keys(state.selection);
  if (!keys.length) return "";

  const byKind = { res: [], chain: [], atom: [], bond: [], pocket: [] };
  keys.forEach(k => {
    const item = state.selection[k];
    const kind = item.sel && item.sel.kind ? item.sel.kind
               : (item.pocket ? "pocket" : "res");
    (byKind[kind] || byKind.res).push(item.label || k);
  });

  const parts = [];
  if (byKind.res.length) {
    parts.push(`选中的残基（${byKind.res.length}）：${byKind.res.join(", ")}`);
  }
  if (byKind.chain.length) {
    parts.push(`选中的链（${byKind.chain.length}）：${byKind.chain.join(", ")}`);
  }
  if (byKind.atom.length) {
    parts.push(`选中的原子（${byKind.atom.length}）：${byKind.atom.join(", ")}`);
  }
  if (byKind.bond.length) {
    parts.push(`选中的键（${byKind.bond.length}）：${byKind.bond.join(", ")}`);
  }
  if (byKind.pocket.length) {
    parts.push(`选中的口袋（${byKind.pocket.length}）：${byKind.pocket.join(", ")}`);
  }

  const name = (state.meta && state.meta.name) || "";
  const head = name ? `[当前结构：${name}]` : "[当前结构]";
  return `${head}\n${parts.join("\n")}`;
}

function agentRefreshContext() {
  const n = Object.keys(state.selection).length;
  const name = (state.meta && state.meta.name) || "";
  if (!name && !n) {
    agentCtx.hidden = true;
    return;
  }
  const parts = [];
  if (name) parts.push(name);
  if (n) parts.push(`${n} 项选中`);
  agentCtxText.textContent = parts.join(" · ");
  agentCtx.hidden = false;
}

// Read one SSE frame off a stream. Frames are separated by a blank line and
// each carries one `data:` line; a chunk can hold several frames or half of
// one, so the buffer is kept across reads.
async function agentReadFrame(reader, dec, buf) {
  while (!buf.s.includes("\n\n")) {
    const { value, done } = await reader.read();
    if (done) return null;
    buf.s += dec.decode(value, { stream: true });
  }
  const i = buf.s.indexOf("\n\n");
  const frame = buf.s.slice(0, i);
  buf.s = buf.s.slice(i + 2);
  for (const line of frame.split("\n")) {
    if (line.startsWith("data:")) {
      try {
        return JSON.parse(line.slice(5));
      } catch (e) { /* a partial frame; the next read completes it */ }
    }
  }
  return {};
}

// A message typed while a turn runs, waiting to be sent.
//
// The box stays usable during a turn — a skill run takes minutes and the user
// often knows their next question while it works. Sending it immediately would
// queue it behind the turn in progress, which opencode answers only after the
// current one finishes and which the panel has no way to show. So it is held
// here and sent the moment the turn ends.
let agentDraft = "";

async function agentSubmit() {
  const text = agentInput.value.trim();
  if (!text) return;
  // Mid-turn: keep the text, clear the box, say so. The message is not lost
  // and the user can see it is queued rather than wondering whether the click
  // did anything.
  if (agentBusy) {
    agentDraft = text;
    agentInput.value = "";
    agentInput.style.height = "";
    agentInput.placeholder = "已排队，当前回答完就发…";
    return;
  }
  agentInput.value = "";
  agentInput.style.height = "";
  await agentTurn(text);
}

// Send whatever was typed during the turn that just ended.
//
// Called from the turn's finally block, after the panel is no longer busy. A
// watched background task keeps the panel busy, so the draft waits for the
// wake-up turn instead — which is right: the user typed it before the result
// existed, and sending it now would answer the wrong question.
function agentFlushDraft() {
  if (!agentDraft || agentBusy || agentWatchedJobs) return;
  const text = agentDraft;
  agentDraft = "";
  agentTurn(text);
}

// One turn, from a message that is already decided.
//
// Split from agentSubmit so the wake-up after a background task can send a
// message the user never typed. That message has to go through exactly the
// same path — same selection summary, same streaming, same history — or the
// model is woken into a conversation that is missing the turn before it.
//
// `attach` names a session to watch instead of starting a turn. Nothing is
// sent to the model; the panel subscribes to a turn that is already running
// and renders it as it continues. See agentAttach().
//
// The two modes are mutually exclusive and each has its own guard, because
// they refuse for opposite reasons: a turn cannot start while one is already
// running, and a turn cannot be attached to while this panel is running one
// of its own. Getting either backwards is silent — the caller has already
// cleared the input box, so a refused turn is a message that vanishes.
async function agentTurn(text, attach) {
  if (attach) {
    if (agentBusy) return;
  } else {
    if (!text || agentBusy) return;
  }

  // The selection goes with the question, spelled out.
  //
  // The agent can read selection.json for itself, and used to — but that
  // costs a tool call and a round trip before it knows what the user is
  // pointing at, and on a question like "design a binder for this" the
  // selection *is* the question. Sending it inline means the first thing the
  // model sees is what was selected, next to what was asked of it.
  //
  // Only the summary is attached, not the raw file: the panel shows the user
  // the same short form it already displays, and the agent still has the file
  // for anything the summary leaves out.
  //
  // The file is written first, so what the message says and what the agent
  // reads off disk are the same selection. They can disagree otherwise — a
  // selection made since the last persist — and a model told one thing and
  // shown another has to stop and work out which to believe.
  persistSelection(Object.keys(state.selection));
  const selSummary = agentSelectionSummary();
  const sent = selSummary ? `${text}\n\n${selSummary}` : text;

  // Attaching shows no new user message — the question was asked before the
  // user switched away, and it is already in the restored transcript.
  if (!attach) {
    agentAppend("user", text);
    agentMessages.push({ role: "user", content: sent });
  }
  agentSetBusy(true);

  // Attaching continues the turn that is already on screen. The transcript
  // was rebuilt from the session's history a moment ago, and its last
  // assistant message is this turn's answer so far — so that block is filled
  // in as the turn continues rather than a second one being started below
  // it, which would show the same reply twice.
  let pending = null;
  // Whether the block being filled in is one this call created, or the last
  // assistant message already on screen. Attaching reuses the latter, and a
  // reused block must not be removed on the error paths below — it is part of
  // the conversation's history, not a placeholder this call owns.
  let pendingIsMine = true;
  if (attach) {
    const rows = agentLog.querySelectorAll(".ag-msg.assistant");
    if (rows.length) {
      pending = rows[rows.length - 1];
      pendingIsMine = false;
    }
  }
  if (!pending) {
    pending = agentAppend("assistant", "…");
    pending.classList.add("pending");
  }
  const pendingText = pending.querySelector(".ag-text");
  let thinkBlock = null;
  let toolBox = null;
  let reply = "";
  // Held where the stop button can reach it. Aborting the fetch closes the
  // stream, which is what unblocks the read loop below; the turn itself is
  // stopped by the request to /agent/abort, without which opencode would keep
  // running and the next message would queue behind it.
  agentAbort = new AbortController();

  // The reply is filled in as it arrives. A turn that runs a skill takes
  // minutes, and a panel that shows nothing until it finishes looks broken —
  // the model emits text the whole time, so it is rendered as it comes.
  try {
    const res = await fetch("agent", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(attach
        ? { messages: agentMessages, agent: agentName, attach }
        : { messages: agentMessages, agent: agentName }),
      signal: agentAbort.signal,
    });

    // A non-streamed error arrives as JSON with a normal status.
    const ct = res.headers.get("Content-Type") || "";
    if (!ct.includes("event-stream")) {
      const data = await res.json();
      if (pendingIsMine) pending.remove();
      agentAppend("error", data.error || `HTTP ${res.status}`);
      return;
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    const buf = { s: "" };
    for (;;) {
      const ev = await agentReadFrame(reader, dec, buf);
      if (ev === null) break;
      if (ev.type === "text") {
        reply = ev.text || "";
        agentFormat(pendingText, reply);
        agentScrollToEnd();
      } else if (ev.type === "reasoning") {
        // The working is created on first sight and then updated in place,
        // so it grows with the turn rather than appearing only at the end.
        // It starts open: while the turn runs there is no answer yet, and a
        // collapsed block would leave the user watching a blinking cursor
        // with nothing to read. It is collapsed when the turn finishes, by
        // which point the answer is what matters.
        if (!thinkBlock) {
          thinkBlock = agentThinkBlock(ev.text || "");
          thinkBlock.open = true;
          pending.insertBefore(thinkBlock, pendingText);
        } else {
          agentFormat(thinkBlock.querySelector(".ag-think-text"), ev.text || "");
        }
      } else if (ev.type === "tool") {
        if (!toolBox) {
          toolBox = agentToolBox([]);
          // Inserted before the answer rather than appended after it, so the
          // finished message reads in the order the work happened: working,
          // what it looked at, then the answer.
          pending.insertBefore(toolBox, pendingText);
        }
        const line = document.createElement("div");
        line.className = "ag-tool-line";
        line.textContent = ev.tool;
        toolBox.appendChild(line);
        // The count in the summary is the only thing visible while the turn
        // runs, so it has to be kept current as calls arrive.
        const c = toolBox.querySelector(".ag-tool-count");
        if (c) c.textContent =
          `${toolBox.querySelectorAll(".ag-tool-line").length} 次调用`;
        agentScrollToEnd();
      } else if (ev.type === "permission") {
        // The agent is blocked until this is answered. Without a prompt it
        // waits forever and the panel shows a turn that never finishes.
        if (ev.session) agentSessionId = ev.session;
        agentAskPermission(ev);
      } else if (ev.type === "error") {
        if (pendingIsMine) pending.remove();
        agentAppend("error", ev.message);
        return;
      } else if (ev.type === "waiting") {
        // The model started a background task and stopped talking. The turn is
        // over as far as the stream is concerned, but the work is not — the
        // skill scripts publish their progress to status.json and run for
        // minutes. The panel takes over watching so the model's "I'll report
        // when it's done" is a promise something keeps.
        agentWatchJobs(ev.jobs || []);
      } else if (ev.type === "done") {
        reply = ev.reply || reply;
        if (ev.session) agentSessionId = ev.session;
        agentFormat(pendingText, reply || "（无回复）");
      }
    }
    pending.classList.remove("pending");
    // The working collapses once the answer is there. It was open while the
    // turn ran because there was nothing else to read; now the answer is
    // what the user asked for, and the working is one click away.
    if (thinkBlock) thinkBlock.open = false;
    if (!reply) agentFormat(pendingText, "（无回复）");
    // Not recorded when attaching. The transcript was rebuilt from the
    // session's history a moment ago, which already holds this turn's
    // earlier messages — pushing the reply again would send the model its
    // own words twice on the next turn.
    if (!attach) agentMessages.push({ role: "assistant", content: reply });
  } catch (e) {
    // An abort is the user's doing, not a fault, so it is reported as one:
    // whatever arrived before the stop is kept and marked, rather than
    // replaced by an error the user did not make.
    if (e.name === "AbortError") {
      pending.classList.remove("pending");
      if (thinkBlock) thinkBlock.open = false;
      if (reply) {
        agentFormat(pendingText, reply + "\n\n_（已停止）_");
        if (!attach) {
          agentMessages.push({ role: "assistant", content: reply });
        }
      } else {
        if (pendingIsMine) pending.remove();
        agentAppend("assistant", "（已停止）");
      }
      return;
    }
    if (pendingIsMine) pending.remove();
    agentAppend("error", `请求失败：${e.message}`);
  } finally {
    agentAbort = null;
    // A watched task keeps the panel busy after the turn ends — the button
    // stays a stop control, because there is something in flight the user may
    // want to cancel. Clearing busy here would let a second message queue
    // behind the wake-up turn that is about to happen.
    if (!agentWatchedJobs) agentSetBusy(false);
    agentScrollToEnd();
    agentInput.focus();
    // Whatever was typed during the turn goes now. After the flush rather
    // than before it, so the panel is idle when the next turn starts and the
    // draft is not sent into a panel that still looks busy.
    agentFlushDraft();
  }
}

// Stop the turn in progress. Both ends have to be told: the fetch is aborted
// so the panel stops waiting, and /agent/abort stops opencode, which would
// otherwise keep running and make the next message queue behind a turn the
// user already gave up on.
function agentStop() {
  if (agentAbort) agentAbort.abort();
  // A watched task is dropped too. Leaving the poll running would wake the
  // model for a run the user just cancelled, which is the opposite of what
  // pressing stop asked for.
  if (agentJobTimer) {
    clearInterval(agentJobTimer);
    agentJobTimer = null;
  }
  agentWatchedJobs = null;
  // The panel is released here rather than waiting for the aborted fetch to
  // unwind. The stream is already closed, so the turn is over as far as the
  // user is concerned; holding the button in its stopping state until the
  // server answers made a stop that had already worked look like it had not.
  agentSetBusy(false);
  agentInput.placeholder = "问 Agent，或让它改这个结构…";
  // The server is told, and the answer is checked rather than dropped. An
  // abort that failed leaves opencode running with the next message queued
  // behind it, which is the one failure the user cannot see from here — so
  // it is said out loud instead of swallowed.
  fetch("agent/abort", { method: "POST" })
    .then(r => r.json())
    .then(d => {
      if (d && d.error) agentAppend("error", `停止失败：${d.error}`);
    })
    .catch(e => agentAppend("error", `停止失败：${e.message}`));
}

/* ---------------- watching a background task ---------------- */

// The tasks the panel is waiting on, and the timer that checks them.
//
// A turn that starts a skill run ends before the run does: the model says
// "started, I'll report when it's done" and stops, and the script keeps going
// for minutes. Nothing was keeping that promise — the panel showed a finished
// turn and the result arrived as a publish notice the user had to act on. The
// panel watches instead, and sends the model back in when the work lands.
let agentWatchedJobs = null;
let agentJobTimer = null;

function agentWatchJobs(jobs) {
  if (!jobs.length) return;
  agentWatchedJobs = jobs;
  // The panel stays busy even though the turn is over: the button stays a stop
  // control, because there is something in flight the user may want to cancel.
  // The box stays usable — a message typed now is held and sent after the
  // wake-up turn, which is when it can actually be answered.
  // The wait is stated in the compose box rather than in the transcript. The
  // model's own reply already says it started the run, and a second message
  // saying the same thing one line below it is the panel talking over the
  // model. The placeholder is where a status belongs: it is the one line that
  // is always visible while the user decides what to type next, and it is
  // replaced by the live step as the run progresses.
  const names = jobs.map(j => j.step || j.group || j.id).filter(Boolean);
  agentInput.placeholder =
    `等待任务完成… ${names.join("、")}`;

  // Polled on the same 2s tick as everything else the panel watches. The
  // server reads status.json, which the skills write as they go, so this is
  // the run's own progress rather than a guess from timing.
  agentJobTimer = setInterval(agentPollJobs, 2000);
}

async function agentPollJobs() {
  if (!agentWatchedJobs) return;
  let jobs = [];
  let finished = [];
  try {
    const r = await fetch("agent/jobs");
    if (r.ok) {
      const d = await r.json();
      jobs = d.jobs || [];
      // The tail of what just finished, sent with the empty list. Read on the
      // server because the panel does not know where the skills keep their
      // logs.
      finished = d.finished || [];
    }
  } catch (e) {
    return;  // the server is between restarts; the next tick tries again
  }

  if (jobs.length) {
    // Still running. The placeholder says which step, so a long run shows
    // where it is rather than a spinner with no noun.
    const cur = jobs[0];
    const label = cur.step || cur.group || cur.id;
    agentInput.placeholder = cur.message
      ? `等待任务完成… ${label}：${cur.message}`
      : `等待任务完成… ${label}`;
    return;
  }

  // Nothing left running. The watched set is cleared before the wake-up is
  // sent, so a second completion — a task that published twice — does not
  // start another turn.
  clearInterval(agentJobTimer);
  agentJobTimer = null;
  const watched = agentWatchedJobs;
  agentWatchedJobs = null;
  // The panel goes idle before the wake-up is sent. It was held busy across
  // the wait so the button stayed a stop control, but agentTurn refuses to
  // start while busy — and the wake-up is a turn like any other.
  agentSetBusy(false);

  // The wake-up. It is a user-role message because that is what the panel
  // sends, and it says what finished rather than "continue" — the model has
  // been idle for minutes and its own last words are the only context it has
  // for what it was doing.
  const names = watched.map(j => j.step || j.group || j.id)
    .filter(Boolean).join("、");
  let wake = `后台任务已完成：${names}。请查看结果并汇报。`;

  // The log's tail goes with it. Without it the model's first act on waking is
  // to read the log — a tool call and a round trip before it can say
  // anything, on a turn whose whole purpose is to report. With it, the numbers
  // are already in the message.
  //
  // Only the jobs that were actually watched are reported. `finished` is
  // whatever ended most recently, which after a long session may be a run from
  // an hour ago that has nothing to do with this wait.
  const watchedGroups = new Set(
    watched.map(j => j.group || j.id).filter(Boolean));
  const mine = finished.filter(f =>
    watchedGroups.has(f.group || f.id) || !f.group && !f.id);
  if (mine.length) {
    const parts = mine.map(f => {
      const head = `—— ${f.step || f.group || f.id}` +
        (f.state === "error" ? "（失败）" : "") + " ——";
      return `${head}\n${f.log_tail}`;
    });
    wake += `\n\n任务日志的最后几行：\n\n${parts.join("\n\n")}`;
  }
  agentTurn(wake);
}

agentCompose.addEventListener("submit", ev => {
  ev.preventDefault();
  // The same button sends and stops, so which one it is depends on whether a
  // turn is running.
  if (agentBusy) {
    agentStop();
    return;
  }
  agentSubmit();
});

// Enter sends, Shift+Enter makes a new line — the convention every chat
// uses, and the one a user will try first.
agentInput.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && !ev.shiftKey) {
    ev.preventDefault();
    // The same key sends and stops, exactly as the button does. Without the
    // check, Enter during a turn queued the text as a draft and did nothing
    // else — the user pressed the key every chat uses for "go" and watched
    // nothing happen, with no way to tell that the button beside the box was
    // the only thing that would have stopped it.
    if (agentBusy) {
      agentStop();
      return;
    }
    agentSubmit();
  }
});

// Grow with the content up to the CSS max-height, so a pasted paragraph is
// visible rather than scrolled inside a two-line box.
agentInput.addEventListener("input", () => {
  agentInput.style.height = "auto";
  agentInput.style.height = Math.min(agentInput.scrollHeight, 140) + "px";
});

agentCollapse.addEventListener("click", () => {
  agentPanel.classList.toggle("collapsed");
  agentCollapse.textContent = agentPanel.classList.contains("collapsed")
    ? "‹" : "›";
  agentCollapse.title = agentPanel.classList.contains("collapsed")
    ? "展开面板" : "收起面板";
});

const hoverTip = document.getElementById("hover-tip");

// 3Dmol gives us the atom under the cursor but not the pointer position,
// so track that ourselves and place the tip next to it.
let hoverPos = { x: 0, y: 0 };

// True while a mouse button is down on the viewer, which is how 3Dmol rotates
// and pans. The tooltip is suppressed for the duration — see onAtomHover.
let viewerDragging = false;

// Bound to the viewer's own canvas rather than to the page, so a drag that
// starts on the structure and ends over a panel still counts as one gesture.
// mouseup is on the window: the button is often released outside the canvas,
// and missing that would leave the tooltip off until the next click.
const viewerCanvas = document.getElementById("viewer");
viewerCanvas.addEventListener("mousedown", () => {
  viewerDragging = true;
  onHoverOut();
});
window.addEventListener("mouseup", () => {
  if (!viewerDragging) return;
  viewerDragging = false;
  // The cursor is still over whatever residue it stopped on, but 3Dmol has
  // already fired its hover for it and will not fire again until the pointer
  // moves. So the tip is cleared rather than left showing a stale residue,
  // and the next mousemove brings it back.
  onHoverOut();
});

function onAtomHover(atom) {
  // While the structure is being rotated or dragged, the tooltip is off. The
  // cursor sweeps across dozens of residues on its way, and each one would
  // raise a tip naming a residue the user is not looking at — so the tip
  // flickers through the whole chain and covers the part being rotated. It
  // comes back when the button is released.
  if (viewerDragging) {
    onHoverOut();
    return;
  }
  if (!atom) {
    onHoverOut();
    return;
  }
  const resn = atom.resn || "?";
  const resi = atom.resi != null ? atom.resi : "";
  const chain = atom.chain || "_";
  const elem = atom.elem ? ` ${atom.elem}` : "";

  hoverTip.innerHTML = "";
  const res = document.createElement("span");
  res.className = "ht-res";
  res.textContent = `${resn} ${resi}${elem}`;
  hoverTip.appendChild(res);

  const ch = document.createElement("span");
  ch.className = "ht-chain";
  ch.textContent = `chain ${chain}`;
  hoverTip.appendChild(ch);

  // Say whether this residue is already selected, so the user knows what
  // a click will do before making it.
  const key = `${chain}:${resi}`;
  if (state.selection[key] || state.selection[`chain:${chain}`]) {
    const sel = document.createElement("span");
    sel.className = "ht-sel";
    sel.textContent = "selected";
    hoverTip.appendChild(sel);
  }

  // In atom/bond mode the atom name is the thing being picked, so lead
  // with it rather than burying it after the residue.
  if (state.selMode === "atom" || state.selMode === "bond") {
    const name = document.createElement("span");
    name.className = "ht-chain";
    name.textContent = atom.atom || atom.elem || "";
    hoverTip.appendChild(name);
    const akey = atomKey(atom);
    if (state.selection[akey]) {
      const sel = document.createElement("span");
      sel.className = "ht-sel";
      sel.textContent = "selected";
      hoverTip.appendChild(sel);
    }
  }

  hoverTip.hidden = false;
  positionTip();

  // Preview the selection, but only after the pointer has rested on this
  // residue for a moment. Sweeping the mouse across the structure would
  // otherwise repaint every residue it crosses, which reads as flicker.
  //
  // The tooltip appears immediately — naming a residue is cheap and the
  // user asked for it by pointing. Only the 3D repaint waits.
  const prev = state.hover;
  // Same residue means nothing to repaint — 3Dmol fires hover on every
  // mouse move within a residue.
  const same = prev && prev.chain === atom.chain && prev.resi === atom.resi;
  state.hover = atom;
  if (same) return;

  // Drop whatever preview is pending or already on screen. 3Dmol only
  // calls the hover-out handler when the pointer leaves the model
  // entirely, so moving between residues never clears it — without this
  // the previous residue keeps its highlight while the new one waits.
  clearTimeout(hoverPreviewTimer);
  if (hoverPreviewed) {
    hoverPreviewed = false;
    applyStyle();
  }

  hoverPreviewTimer = setTimeout(() => {
    // The pointer may have moved on while the timer was pending.
    if (state.hover && state.hover.chain === atom.chain
        && state.hover.resi === atom.resi) {
      hoverPreviewed = true;
      applyStyle();
    }
  }, HOVER_PREVIEW_MS);
}

function onHoverOut() {
  hoverTip.hidden = true;
  clearTimeout(hoverPreviewTimer);
  if (state.hover || hoverPreviewed) {
    state.hover = null;
    hoverPreviewed = false;
    applyStyle();
  }
}

// Keep the tip inside the viewer: flip it to the other side of the cursor
// when it would run off the right or bottom edge.
function positionTip() {
  const wrap = document.getElementById("viewer-wrap").getBoundingClientRect();
  const w = hoverTip.offsetWidth;
  const h = hoverTip.offsetHeight;
  let x = hoverPos.x + 14;
  let y = hoverPos.y + 14;
  if (x + w > wrap.width - 8) x = hoverPos.x - w - 14;
  if (y + h > wrap.height - 8) y = hoverPos.y - h - 14;
  hoverTip.style.left = `${Math.max(8, x)}px`;
  hoverTip.style.top = `${Math.max(8, y)}px`;
}

document.getElementById("viewer-wrap").addEventListener("mousemove", (e) => {
  const wrap = e.currentTarget.getBoundingClientRect();
  hoverPos = { x: e.clientX - wrap.left, y: e.clientY - wrap.top };
  if (!hoverTip.hidden) positionTip();
});

document.getElementById("viewer-wrap").addEventListener("mouseleave", () => {
  hoverTip.hidden = true;
});

// Paint the sequence letters to match state.selection. Without this a
// residue chosen in the 3D view — or by a drag, or by a skill through
// --select — shows up in the Selection panel and in the structure but the
// sequence still reads as untouched, so the two halves of the screen
// disagree about what is chosen.
//
// Runs from applyStyle, which every selection change already routes
// through, so there is no second place to keep in sync.
function paintSequenceSelection() {
  // Residue keys are "chain:resi"; chain selections cover every letter of
  // that chain. Atom and bond selections name no residue, so they leave
  // the sequence alone — an atom is smaller than a letter can show.
  const byChain = {};
  Object.entries(state.selection).forEach(([key, item]) => {
    if (item.atom || item.bond || item.pocket) return;
    if (item.chain) {
      byChain[item.sel.chain] = { all: true, color: item.color };
      return;
    }
    if (item.sel && item.sel.resi !== undefined) {
      const c = item.sel.chain;
      if (!byChain[c]) byChain[c] = { all: false, resi: {}, color: item.color };
      byChain[c].resi[String(item.sel.resi)] = item.color;
    }
  });

  document.querySelectorAll(".seq-aa").forEach(el => {
    const c = byChain[el.dataset.chain];
    let color = null;
    if (c) {
      color = c.all ? c.color : (c.resi[el.dataset.resi] || null);
    }
    if (color) {
      el.style.background = color;
      el.style.color = "#0b0f14";
      el.classList.add("seq-sel");
      el.title = `${el.dataset.chain}:${el.dataset.resi}`;
    } else {
      el.style.background = "";
      el.style.color = "";
      el.classList.remove("seq-sel");
      el.title = "";
    }
  });
}

function renderSelectionPanel() {
  const keys = Object.keys(state.selection);
  selList.innerHTML = "";
  selectionPanel.classList.add("show");

  persistSelection(keys);
  // The agent panel says what it can see. It reads the same selection, so
  // it has to be told when it changes — otherwise it keeps describing a
  // selection the user has since cleared.
  agentRefreshContext();

  if (!keys.length) {
    const hint = {
      res: "Click residues in the viewer to select them. Click again to " +
           "deselect. Switch to <b>Chain</b> to select a whole chain at once.",
      chain: "Click any atom to select its whole chain.",
      atom: "Click an atom to select just that atom.",
      bond: "Click an atom to select the bond to a neighbour. Click again " +
            "to walk to the next bond around that atom.",
    }[state.selMode] || "";
    selList.innerHTML = `<div class="s-empty">${hint}</div>`;
    return;
  }

  keys.forEach(key => {
    const item = state.selection[key];
    const row = document.createElement("div");
    row.className = "s-row";

    const sw = document.createElement("span");
    sw.className = "s-swatch";
    sw.style.background = item.color;

    const name = document.createElement("span");
    name.className = "s-name";
    name.textContent = item.label;

    const del = document.createElement("button");
    del.className = "s-del";
    del.textContent = "×";
    del.title = "Remove";
    del.addEventListener("click", ev => {
      ev.stopPropagation();
      delete state.selection[key];
      applyStyle();
      renderSelectionPanel();
    });

    // Clicking the row flies the camera to that state.selection. The panel lists
    // things picked from all over the complex, and without this the only
    // way back to one is to hunt for it in the 3D view.
    row.addEventListener("click", () => seekToSelection(item.sel));

    row.append(sw, name, del);
    selList.appendChild(row);
  });
}

// Centre the camera on a state.selection spec. zoomTo takes a 3Dmol state.selection,
// not coordinates — it resolves the atoms itself and frames them, so a
// single atom and a whole chain both work through the same call.
//
// A lone atom has no extent, and zoomTo's own minimum framing is 5 units,
// which would leave it lost in the middle of the screen. Widen the
// state.selection to the atom's residue in that case so the framing has
// something to work with.
function seekToSelection(sel) {
  if (!sel) return;
  const model = viewer.getModel();
  if (!model) return;

  let target = sel;
  if (sel.index !== undefined) {
    const atoms = Array.isArray(sel.index) ? sel.index : [sel.index];
    const found = atoms.map(i => model.atoms.find(a => a.index === i))
                        .filter(Boolean);
    if (!found.length) return;
    if (found.length === 1) {
      // one atom: frame its residue instead, so the view has context
      target = { chain: found[0].chain, resi: found[0].resi };
    } else {
      target = { index: atoms };
    }
  }

  viewer.zoomTo(target, 600);
  viewer.render();
}

// Colour for the next state.selection. Derived from how many things are already
// selected rather than from a running counter, so the sequence is stable:
// selecting the same residues in the same order always yields the same
// colours, and cancelling one in the middle does not shift the rest.
//
// Residues on the same chain share a colour, which keeps a multi-residue
// state.selection on one chain visually coherent.
function nextColor(chainId) {
  const used = new Set(Object.values(state.selection).map(s => s.color));
  const sameChain = Object.values(state.selection).find(
    s => s.sel && s.sel.chain === chainId);
  if (sameChain) return sameChain.color;
  const free = PALETTE.find(c => !used.has(c));
  return free || PALETTE[Object.keys(state.selection).length % PALETTE.length];
}

function addSelection(atom) {
  const key = selKey(atom);
  if (state.selection[key]) return;
  // An alpha-sphere cloud is one pocket, not one residue: every sphere in
  // it shares residue number 1, so selecting by residue would collapse
  // 74 spheres into a single entry and fade only one of them. Select the
  // whole chain instead, and mark it so the styling knows to fade rather
  // than recolour.
  if (atom.resn === "STP") {
    const chainKey = `chain:${atom.chain}`;
    if (state.selection[chainKey]) return;
    state.selection[chainKey] = {
      sel: { chain: atom.chain, resn: "STP" },
      label: `Pocket ${atom.chain}`,
      color: nextColor(atom.chain),
      chain: true,
      pocket: true,
    };
    return;
  }
  state.selection[key] = {
    sel: { chain: atom.chain, resi: atom.resi },
    label: selLabel(atom),
    color: nextColor(atom.chain),
  };
}

function addChainSelection(chainId) {
  const key = `chain:${chainId}`;
  if (state.selection[key]) return;
  const info = state.chains.find(c => c.chain === chainId);
  state.selection[key] = {
    sel: { chain: chainId },
    label: `Chain ${chainId}${info ? ` (${info.seq.length} aa)` : ""}`,
    color: nextColor(chainId),
    chain: true,
  };
}

// A single atom. The style spec matches on 3Dmol's index, which is the
// only per-atom selector setStyle accepts.
//
// The PDB serial comes from the atom's own `pdbline`, not from 3Dmol's
// `serial` field. That field is 3Dmol's own per-model counter, starting at 1
// for every model it builds — so on a structure whose ligand is numbered
// 4075-4103 it reports 8, and a skill told "serial 8" edits the receptor's
// eighth atom instead of the oxygen that was clicked. It happens to agree
// with the PDB serial whenever a structure's atoms are numbered from 1,
// which is why the mistake survived as long as it did.
function pdbSerial(atom) {
  if (atom.pdbline && atom.pdbline.length >= 11) {
    const s = parseInt(atom.pdbline.slice(6, 11), 10);
    if (Number.isFinite(s)) return s;
  }
  return atom.serial;
}

function addAtomSelection(atom) {
  const key = atomKey(atom);
  if (state.selection[key]) return;
  state.selection[key] = {
    sel: {
      index: atom.index,
      // The PDB atom number, kept beside 3Dmol's index. 3Dmol reorders atoms
      // when it builds a model, so its index is not a position in the file
      // and cannot be walked back to a serial — a skill that needs to edit
      // the structure has to be told which atom was meant.
      serial: pdbSerial(atom),
      resn: atom.resn,
      resi: atom.resi,
      chain: atom.chain,
    },
    label: atomLabel(atom),
    color: nextColor(atom.chain),
    atom: true,
    serial: pdbSerial(atom),
  };
}

// A bond between the clicked atom and one of its neighbours. 3Dmol reports
// no bond on click, so the neighbour is picked from the atom's `bonds`
// list — the first one that is not already selected, so repeated clicks
// walk around the atom rather than re-picking the same bond.
function addBondSelection(atom) {
  const model = viewer.getModel();
  const byIndex = {};
  (model.atoms || []).forEach(a => { byIndex[a.index] = a; });
  const neighbours = (atom.bonds || []).map(i => byIndex[i]).filter(Boolean);
  if (!neighbours.length) return;

  const taken = new Set(
    Object.keys(state.selection)
      .filter(k => k.startsWith("bond:"))
      .map(k => k.slice(6).split("-").map(Number))
      .flat()
  );
  const other = neighbours.find(n => !taken.has(n.index)) || neighbours[0];

  const key = bondKey(atom.index, other.index);
  if (state.selection[key]) {
    delete state.selection[key];
    return;
  }
  state.selection[key] = {
    sel: { index: [atom.index, other.index] },
    label: bondLabel(atom, other),
    color: nextColor(atom.chain),
    bond: true,
  };
}

// 3Dmol click handling: nearest atom within a pixel radius.
// What a click selects depends on the Res/Chain toggle in the Selection
// panel: in "res" mode it toggles the single residue, in "chain" mode it
// toggles that residue's whole chain. Clicking an already-selected target
// deselects it. Alt/Option + click always removes.
function onAtomClick(atom) {
  if (!atom) return;
  const alt = window.event && window.event.altKey;

  if (state.selMode === "chain") {
    const key = `chain:${atom.chain}`;
    if (alt || state.selection[key]) {
      delete state.selection[key];
    } else {
      addChainSelection(atom.chain);
    }
  } else if (state.selMode === "atom") {
    const key = atomKey(atom);
    if (alt || state.selection[key]) {
      delete state.selection[key];
    } else {
      addAtomSelection(atom);
    }
  } else if (state.selMode === "bond") {
    if (alt) {
      // Alt-click removes whichever selected bond touches this atom.
      const touched = Object.keys(state.selection).filter(k => {
        if (!k.startsWith("bond:")) return false;
        const [a, b] = k.slice(6).split("-").map(Number);
        return a === atom.index || b === atom.index;
      });
      touched.forEach(k => delete state.selection[k]);
    } else {
      addBondSelection(atom);
    }
  } else {
    // An alpha-sphere cloud is keyed by chain, not residue: every sphere
    // in a pocket shares residue number 1, so the residue key would never
    // match the entry addSelection stored and a second click would not
    // toggle it off.
    if (atom.resn === "STP") {
      const key = `chain:${atom.chain}`;
      if (alt || state.selection[key]) {
        delete state.selection[key];
      } else {
        addSelection(atom);
      }
      applyStyle();
      renderSelectionPanel();
      return;
    }
    const key = selKey(atom);
    if (alt || state.selection[key]) {
      delete state.selection[key];
    } else {
      addSelection(atom);
    }
  }
  applyStyle();
  renderSelectionPanel();
}

// Res/Chain toggle
document.querySelectorAll("#sel-mode .s-mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    state.selMode = btn.dataset.mode;
    document.querySelectorAll("#sel-mode .s-mode-btn")
      .forEach(b => b.classList.toggle("on", b === btn));
  });
});

selClear.addEventListener("click", () => {
  state.selection = {};
  applyStyle();
  renderSelectionPanel();
});

/* ---------------- machine load ---------------- */

// The status pill shows what the skill is doing; these numbers show what the
// machine is doing while it does it. A run that looks stuck but is burning a
// core is a different problem from one that is genuinely idle, and the only
// way to tell them apart from the browser is to look here.

const sysCpu = document.getElementById("sys-cpu");
const sysGpu = document.getElementById("sys-gpu");
const sysMem = document.getElementById("sys-mem");

// Above these the number changes colour: warn at 70%, hot at 90%.
const SYS_WARN = 70;
const SYS_HOT = 90;

function sysClass(pct) {
  if (pct >= SYS_HOT) return "sys-item hot";
  if (pct >= SYS_WARN) return "sys-item warn";
  return "sys-item";
}

function sysSet(el, label, value, pct) {
  if (!el) return;
  el.className = sysClass(pct);
  el.innerHTML = `<span class="k">${label}</span>` +
                 `<span class="v">${value}</span>`;
}

async function renderSysinfo() {
  try {
    const res = await fetch("sysinfo.json?t=" + Date.now());
    if (!res.ok) return;
    const s = await res.json();

    if (typeof s.cpu_percent === "number") {
      sysSet(sysCpu, "CPU", `${Math.round(s.cpu_percent)}%`, s.cpu_percent);
    }

    // No nvidia-smi or no NVIDIA GPU: the server omits the block, and the
    // span stays hidden rather than showing a permanent 0%.
    if (s.gpu && typeof s.gpu.util_percent === "number") {
      sysGpu.hidden = false;
      sysSet(sysGpu, "GPU", `${Math.round(s.gpu.util_percent)}%`, s.gpu.util_percent);
      // Unified-memory parts report no dedicated VRAM; the tooltip then
      // says so instead of showing undefined.
      sysGpu.title = (typeof s.gpu.mem_used_gb === "number")
        ? `GPU 占用率 · 显存 ${s.gpu.mem_used_gb}/${s.gpu.mem_total_gb} GB`
        : "GPU 占用率 · 统一内存架构，无独立显存";
    } else {
      sysGpu.hidden = true;
    }

    if (s.memory && typeof s.memory.percent === "number") {
      sysSet(sysMem, "RAM",
             `${s.memory.used_gb}/${s.memory.total_gb}G`, s.memory.percent);
    }
  } catch (e) { /* server unreachable */ }
}

/* ---------------- status bar ---------------- */

// The pill shows one job — whichever the publisher marked active, or the one
// that produced the structure on screen when `jobId` is given. Everything
// else, running or finished, is in the pull-up menu behind the chevron.
//
// The two cases are different questions. While a run is in progress the
// interesting one is "what is happening now", which is what active answers.
// Once the user switches to an older structure it becomes "what made this",
// and only the tab's own job can answer that.
function renderStatus(s, jobId) {
  // The file may still be in the old single-object shape, written before
  // jobs existed. Reading it as one keeps the last run on screen instead of
  // blanking the pill.
  let active = (s && s.active) || (s && s.state ? s : null);
  if (jobId && s && Array.isArray(s.jobs)) {
    active = s.jobs.find(j => j.id === jobId) || active;
  }
  // "idle" is a queued job, not the absence of one — it has a plan and is
  // waiting its turn, so it belongs on screen. Only a missing active hides
  // the pill.
  if (!active) {
    statusBar.classList.remove("show");
    return;
  }
  statusBar.dataset.state = active.state;
  const msgEl = statusBar.querySelector(".msg");
  msgEl.textContent = active.message || active.state;
  // The pill shows one line and ellipsizes the rest, so the full text goes in
  // the tooltip — otherwise a long message is unreadable rather than merely
  // abbreviated.
  msgEl.title = active.message || active.state || "";

  // A step of a larger task reports its position within it, so the pill
  // reads "3/6 环肽设计" rather than a bare step name.
  const total = active.total || 0;
  const idx = active.index || 0;
  const pct = total > 0 ? Math.round((idx / total) * 100) : 0;
  statusBar.querySelector(".bar > div").style.width = pct + "%";
  statusBar.querySelector(".step").textContent =
    total > 0 ? `${idx}/${total} ${active.step || ""}`.trim() : "";

  statusBar.classList.add("show");
  renderStatusHistory(s);
}

/* ---------------- status history ---------------- */

// The pill shows one job. This menu shows the rest: what is running, what is
// waiting, and what has finished. Several skills can proceed at once — the
// publisher tracks them as separate jobs — and without this only one of them
// would be visible at a time.

// The last status.json the poll saw. Kept so switching tabs can re-render
// the pill for a different task without waiting for the next poll — the
// file itself has not changed, only which part of it is relevant.
let lastStatus = null;

const stHistBtn = document.getElementById("st-hist");
const stMenu = document.getElementById("st-menu");

// Elapsed time from an ISO start to an ISO end, as "3m 12s". Ends in the
// future are clamped to zero rather than showing a negative duration, which
// happens when the two timestamps come from clocks a hair apart.
function stElapsed(startIso, endIso) {
  if (!startIso) return "";
  const t0 = new Date(startIso).getTime();
  const t1 = endIso ? new Date(endIso).getTime() : Date.now();
  let s = Math.max(0, Math.round((t1 - t0) / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  s -= m * 60;
  if (m < 60) return `${m}m ${s}s`;
  return `${Math.floor(m / 60)}h ${m % 60}m`;
}

function stGroupLabel(text) {
  const h = document.createElement("div");
  h.className = "st-group";
  h.textContent = text;
  return h;
}

function stJobRow(j, isActive) {
  const row = document.createElement("div");
  row.className = "st-row" + (isActive ? " on" : "");
  row.dataset.state = j.state || "";
  // Whether this step leads to a structure. The row is styled on it, so the
  // distinction is visible before the meta line is read.
  if (j.structure) row.dataset.hasStructure = "1";

  const dot = document.createElement("span");
  dot.className = "st-dot";
  row.appendChild(dot);

  const body = document.createElement("div");
  body.className = "st-body";

  const msg = document.createElement("div");
  msg.className = "st-msg";
  // A step that has not started has no message of its own — it has only the
  // name the plan gave it. Showing the raw state there instead would put
  // "queued" on screen four times, which says nothing the dot and the
  // group heading do not already say.
  msg.textContent = j.message || j.step || j.state || "";
  // The row is one line and ellipsizes, so the full text goes in the tooltip.
  msg.title = msg.textContent;
  body.appendChild(msg);

  // A running step gets its own progress bar, so the menu answers "how far
  // along" without having to switch the pill to it.
  if (j.state === "running" && j.total) {
    const bar = document.createElement("div");
    bar.className = "st-bar";
    const fill = document.createElement("div");
    fill.style.width =
      Math.round((j.index || 0) / j.total * 100) + "%";
    bar.appendChild(fill);
    body.appendChild(bar);
  }

  const meta = document.createElement("div");
  meta.className = "st-meta";
  const bits = [];
  if (j.skill) bits.push(j.skill);
  // A step that published a structure says so. Without it the row is
  // indistinguishable from one that only reported a state, and the user has
  // no way to tell which steps of a run lead somewhere before clicking.
  if (j.structure) bits.push("\u2192 \u7ed3\u6784");
  // Elapsed time only once the step has actually run. A queued step's
  // "started" is when the plan was declared, so counting from it would
  // report the whole task's age as this step's — "0s" for a step that has
  // not begun, which reads as a measurement rather than an absence.
  if (j.state === "running" || j.state === "done" || j.state === "error") {
    bits.push(stElapsed(j.started, j.state === "running" ? null : j.updated));
  }
  meta.textContent = bits.filter(Boolean).join(" · ");
  body.appendChild(meta);

  // The step's own numbers, when it reported any.
  //
  // The metrics panel reads them off the structure on screen, so a step that
  // published none — a sequence search, a property analysis — had nowhere to
  // show what it found. Rendering them here puts them where the finding
  // belongs, and reuses the panel's formatting so a number reads the same in
  // both places.
  if (j.metrics && typeof j.metrics === "object") {
    const keys = Object.keys(j.metrics);
    if (keys.length) {
      const rows = document.createElement("div");
      rows.className = "st-metrics";
      keys.forEach(k => {
        const { label, value, hint } = metricParts(k, j.metrics[k]);
        const row = document.createElement("div");
        row.className = "m-row";
        row.innerHTML = `<span class="k"></span><span class="v"></span>`;
        row.querySelector(".k").textContent = label;
        const v = row.querySelector(".v");
        v.textContent = (value === undefined || value === null)
          ? "" : formatMetric(value);
        if (hint) {
          const h = document.createElement("span");
          h.className = "m-hint";
          h.textContent = hint;
          v.appendChild(h);
        }
        rows.appendChild(row);
      });
      body.appendChild(rows);
    }
  }

  row.appendChild(body);

  // A finished step is the way to reach what it produced. Clicking it jumps
  // to the structure that step published — which is why the tab switcher
  // groups by task too: a task that published several structures shows them
  // together, and this click lands on the right one rather than the first.
  //
  // A step that published nothing of its own — preparing a receptor,
  // analysing a trajectory — inherits the task's structure, so every row
  // leads somewhere. Several steps sharing one structure is intended: they
  // are all part of producing it, and clicking any of them shows what the
  // task made. The publisher does the assigning, so a row without a
  // structure means the task never published one at all.
  //
  // A structure that is not among the open tabs is not a dead row. The tabs
  // are capped at MAX_TABS and the status history is not, so a session that
  // has run several pipelines has finished steps whose structures were
  // pushed out — and those rows used to render without a click handler at
  // all, which is the one thing the status menu must not do. The structure
  // is reopened from the archive instead, which is a fetch of one file
  // rather than a resident tab.
  if (j.state === "done" || j.state === "error") {
    const target = j.structure || null;
    if (target) {
      row.classList.add("st-clickable");
      row.title = "Show this task's result";
      row.addEventListener("click", () => {
        // Close the menu first. switchTab returns early when the target is
        // already on screen, and putting the close after it left the menu
        // hanging open over the very structure the user just asked for.
        stMenu.hidden = true;
        openStructureByName(target);
        // Pin this step, so the pill and the menu highlight keep describing
        // it. The structure it opens may belong to another task — the input
        // this run prepared — and without the pin the pill would follow the
        // tab to that task and drop the row the user clicked. switchTab
        // clears the pin, so this goes after it.
        state.pinnedJob = j.id;
        syncPillToTab();
      });
    }
  }
  return row
}

// The task a step belongs to, as the user should read it. The id is what a
// skill passes to --job and what a structure records, so it stays short and
// stable; the label is what the publisher declared for display.
function stGroupName(g, groups) {
  const entry = (groups || {})[g];
  return (entry && entry.label) || g;
}

// How far a task has got, as "3/6". Steps are numbered by the publisher
// when the plan is declared, so this is a lookup rather than a count.
function stGroupProgress(g, jobs) {
  const steps = jobs.filter(j => (j.group || j.id) === g);
  if (!steps.length) return "";
  const total = Math.max(...steps.map(j => j.total || 0));
  if (!total) return "";
  const done = steps.filter(j => j.state === "done" || j.state === "error").length;
  return `${done}/${total}`;
}

// The menu's last rendered fingerprint. Null forces a rebuild.
let stMenuSig = null;

// Clear a task: its steps, and the structures nothing else points at.
//
// The task list is the record of every run this session, and a finished one
// stays there forever — the menu grows into a history of everything rather
// than a list of what is currently open. This is the way out.
//
// The server does the deleting because only it can see every task's
// references at once: a structure two tasks published, or one the user
// opened by hand, has to survive. The viewer then closes the tabs that went
// away, which it can only do after the server says which those were.
async function stDeleteTask(group, btn) {
  if (btn) btn.disabled = true;
  let result = null;
  try {
    const res = await fetch("task.json", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ group }),
    });
    result = await res.json();
    if (!res.ok) {
      console.warn("delete task failed:", result);
      if (btn) btn.disabled = false;
      return;
    }
  } catch (e) {
    console.warn("delete task failed:", e);
    if (btn) btn.disabled = false;
    return;
  }

  // Close the tabs whose structures were dropped. A tab left open would show
  // a structure that no longer exists in the archive, so a reload would
  // silently lose it — and the user just asked for it to go.
  const gone = new Set(result.removed_structures || []);
  if (gone.size) {
    for (let i = state.tabs.length - 1; i >= 0; i--) {
      if (gone.has(state.tabs[i].meta.name)) closeTab(i, true);
    }
  }

  // The pinned step may have been one of the deleted ones.
  if (state.pinnedJob &&
      (state.pinnedJob === group || state.pinnedJob.startsWith(group + "/"))) {
    state.pinnedJob = null;
  }

  // Force a rebuild even though the next poll would also do it: the user
  // should see the task leave now, not up to two seconds later.
  stMenuSig = null;
  if (lastStatus) renderStatus(lastStatus, pillJob());
  // The notice may have been offering one of the structures that just went.
  // Left up it points at something that cannot be opened, and clicking it
  // does nothing at all.
  dropStaleNotice();
}

// Drop the notice if the structure it offers is no longer among the tabs.
//
// The notice is cleared on click, and on nothing else — so a task deleted or a
// tab closed underneath it leaves a button that names a structure the viewer
// can no longer show. Clicking it then calls openStructureByName for a name
// that is in neither the tabs nor the archive, and nothing happens.
function dropStaleNotice() {
  if (!state.noticeName) return;
  if (state.tabs.some(t => t.meta.name === state.noticeName)) return;
  clearPublishNotice();
}

// Put the viewer back to the state it opens in: no model, no label, the hint
// back on screen. Called when the last tab is closed — the viewer has to be
// emptiable, and the empty state is the one the page already knows how to
// show.
function showEmptyState() {
  viewer.removeAllModels();
  state.chains = [];
  state.meta = {};
  state.selection = {};
  state.hiddenChains = new Set();
  hint.classList.remove("hidden");
  // The panels describe a structure that is no longer there.
  document.getElementById("metrics-rows").replaceChildren();
  document.getElementById("metrics-notes").textContent = "";
  const seqBody = document.getElementById("seq-body");
  if (seqBody) seqBody.replaceChildren();
  persistSelection(Object.keys(state.selection));
}

// A fingerprint of everything the menu renders. The poll runs every 2s and
// used to rebuild the menu each time, which wiped the rows out from under
// the user's cursor: a row they were about to click left the DOM, the click
// landed on nothing, and the menu read as broken. Rebuilding only when the
// content actually changed keeps the rows alive between polls.
//
// Only what the rows themselves show goes in here. The highlighted row is
// deliberately left out — it follows the tab on screen, which changes as the
// user navigates, and including it would make the signature differ on every
// tab switch and rebuild the menu for a change that is one CSS class. The
// highlight is applied by re-rendering only when the content changed, so a
// stale highlight is corrected on the next real change.
function stMenuSignature(s) {
  const jobs = (s && s.jobs) || [];
  const groups = (s && s.groups) || {};
  const rows = jobs.map(j => [
    j.id, j.group || j.id, j.step, j.index, j.total, j.state,
    j.message, j.skill, j.structure, j.started, j.updated,
    j.metrics ? JSON.stringify(j.metrics) : "",
  ].join("\u0001")).join("\u0002");
  const labels = Object.keys(groups).sort()
    .map(g => g + "\u0001" + (groups[g] || {}).label).join("\u0002");
  return rows + "\u0003" + labels;
}

function renderStatusHistory(s) {
  const jobs = (s && s.jobs) || [];
  // Which row to mark is whichever job the pill is actually showing — not
  // whichever one published last. Those are the same while a run is in
  // progress and different the moment the user switches to an older
  // structure, and marking the wrong one leaves a highlight on a task whose
  // result is not on screen.
  const shownId = pillJob() || (s && s.active ? s.active.id : null);
  stHistBtn.hidden = !jobs.length;

  // Nothing changed since the last render — leave the rows alone so an open
  // menu stays open and its rows stay clickable. The highlight still moves,
  // because it follows the tab on screen rather than the status file.
  const sig = stMenuSignature(s);
  if (sig === stMenuSig && stMenu.childElementCount) {
    stHighlight(shownId);
    return;
  }
  stMenuSig = sig;

  stMenu.innerHTML = "";
  if (!jobs.length) {
    const empty = document.createElement("div");
    empty.className = "st-empty";
    empty.textContent = "暂无任务";
    stMenu.appendChild(empty);
    return;
  }

  // Grouped by task, in the order the user cares: what is running now, what
  // is waiting behind it, what has finished. A task's steps stay together
  // under one heading — the finished ones are the record of what it did, and
  // the ones still queued are what it will do next.
  const groups = (s && s.groups) || {};
  const order = [];
  const byGroup = {};
  jobs.forEach(j => {
    const g = j.group || j.id;
    if (!byGroup[g]) {
      byGroup[g] = [];
      order.push(g);
    }
    byGroup[g].push(j);
  });

  const rank = g => {
    const steps = byGroup[g];
    if (steps.some(j => j.state === "running")) return 0;
    if (steps.some(j => j.state === "queued" || j.state === "idle")) return 1;
    return 2;
  };
  order.sort((a, b) => rank(a) - rank(b));

  const LABEL = {0: "运行中", 1: "排队中", 2: "已完成"};
  let lastRank = -1;
  order.forEach(g => {
    const r = rank(g);
    if (r !== lastRank) {
      const n = order.filter(x => rank(x) === r).length;
      stMenu.appendChild(stGroupLabel(`${LABEL[r]} · ${n}`));
      lastRank = r;
    }
    // The task heading carries its name and how far it has got, so a
    // six-step pipeline reads as one thing with six parts rather than six
    // unrelated rows.
    const head = document.createElement("div");
    head.className = "st-task";
    const name = document.createElement("span");
    name.className = "st-task-name";
    name.textContent = stGroupName(g, groups);
    head.appendChild(name);
    const prog = stGroupProgress(g, jobs);
    if (prog) {
      const p = document.createElement("span");
      p.className = "st-task-prog";
      p.textContent = prog;
      head.appendChild(p);
    }
    // Clear the task. Everything under this heading goes, and with it the
    // structures nothing else points at — the server decides which those
    // are, because only it can see every task's references at once.
    const del = document.createElement("button");
    del.type = "button";
    del.className = "st-task-del";
    del.textContent = "×";
    del.title = `删除任务：${stGroupName(g, groups)}`;
    del.addEventListener("click", ev => {
      // The heading is not itself clickable, but the menu closes on an
      // outside click and this button is inside it — stop the event here so
      // the menu stays open long enough to show the task disappear.
      ev.stopPropagation();
      stDeleteTask(g, del);
    });
    head.appendChild(del);
    stMenu.appendChild(head);

    // Steps in the order the task declared them, so the list reads as the
    // route rather than as whatever happened to publish last.
    byGroup[g]
      .slice()
      .sort((a, b) => (a.index || 0) - (b.index || 0))
      .forEach(j => {
        const row = stJobRow(j, j.id === shownId);
        // The job id on the element, so the highlight can be moved without
        // rebuilding the row. See stHighlight below.
        row.dataset.jobId = j.id;
        stMenu.appendChild(row);
      });
  });

  stHighlight(shownId);
}

// Move the "this is what is on screen" highlight without touching the rows.
//
// The rows are rebuilt only when their content changes, so the highlight —
// which follows the tab the user is looking at — has to be applied on its
// own. Rebuilding for it would defeat the whole point of the signature.
function stHighlight(shownId) {
  stMenu.querySelectorAll(".st-row.on").forEach(r => {
    r.classList.remove("on");
  });
  if (!shownId) return;
  const row = stMenu.querySelector(`.st-row[data-job-id="${CSS.escape(shownId)}"]`);
  if (row) row.classList.add("on");
}

stHistBtn.addEventListener("click", ev => {
  ev.stopPropagation();
  stMenu.hidden = !stMenu.hidden;
});

/* ---------------- publish notice ---------------- */

const stNotice = document.getElementById("st-notice");
const stNoticeName = stNotice.querySelector(".st-notice-name");

// A structure was published while the user was looking at something else.
//
// The tab is already open — the poll adds it — so this is not the only way
// to reach the structure, it is the way that does not require the user to
// notice a new entry in the switcher. Clicking it goes there and clears it.
//
// One notice at a time, and it always names the newest publish. A run that
// publishes several structures in a row would otherwise stack up a queue of
// bells, each one a thing to dismiss; the newest subsumes the rest, because
// the switcher lists every tab and the older ones are still one click away
// from there.
function raisePublishNotice(meta) {
  state.noticeName = meta.name || "structure";
  stNoticeName.textContent = state.noticeName;
  stNotice.title = `新结构已发布：${state.noticeName}，点击查看`;
  stNotice.hidden = false;
}

function clearPublishNotice() {
  state.noticeName = null;
  stNotice.hidden = true;
}

stNotice.addEventListener("click", ev => {
  ev.stopPropagation();
  const name = state.noticeName;
  clearPublishNotice();
  if (name) openStructureByName(name);
});

// A click anywhere else closes it, the way any dropdown behaves.
//
// Two details matter here. The check covers the button's subtree, not just
// the button: clicking the chevron's <svg> or <path> reports that element as
// the target, and comparing against the button alone would close the menu on
// the very click that opened it. And this listens for pointerdown on window
// rather than click on document, because 3Dmol's canvas handler consumes
// clicks — a click listener never fires for presses that land on the viewer,
// which is most of the screen.
window.addEventListener("pointerdown", ev => {
  if (stMenu.hidden) return;
  if (stMenu.contains(ev.target)) return;
  if (stHistBtn.contains(ev.target)) return;
  stMenu.hidden = true;
});

/* ---------------- structure tabs ---------------- */

const MAX_TABS = 12;

// A republish of the same name replaces that tab rather than adding a
// second one — rerunning a skill should not pile up duplicates.
// `activate` decides whether the new tab also takes over the screen. A
// publish while the user is on an older tab records the structure but
// leaves the view where it is; the caller then keeps activeTab as it was.
// A tab holds where its structure lives, not the structure itself.
//
// Keeping the text for every open tab meant a dozen archived structures sat in
// memory at once — eight megabytes of PDB strings for a session that had run
// several pipelines — and the browser eventually refused every request with
// ERR_INSUFFICIENT_RESOURCES, which silently broke the selection write. The
// text is now fetched when a tab is opened and dropped when it is left, so at
// most one structure is resident.
function addTab(text, meta, activate = true) {
  const name = meta.name || "structure";
  const existing = state.tabs.findIndex(t => t.meta.name === name);
  if (existing >= 0) {
    // Keep whatever the user had selected on this tab; only the
    // structure and its metadata are new.
    const kept = state.tabs[existing].state;
    state.tabs[existing] = { file: meta.file || null, text, meta, state: kept };
    if (activate) state.activeTab = existing;
  } else {
    state.tabs.push({ file: meta.file || null, text, meta, state: null });
    if (activate) {
      state.activeTab = state.tabs.length - 1;
      if (state.tabs.length > MAX_TABS) {
        state.tabs.shift();
        state.activeTab -= 1;
      }
    } else if (state.tabs.length > MAX_TABS) {
      state.tabs.shift();
      if (state.activeTab > 0) state.activeTab -= 1;
    }
  }
  renderTabs();
}

// Drop the text of every tab but the one on screen. Called after a switch so
// the memory is released once the new structure is already rendered.
function trimTabText() {
  state.tabs.forEach((t, i) => {
    if (i !== state.activeTab && t.text) t.text = null;
  });
}

// Fetch a tab's structure text, or return the cached copy.
async function tabText(t) {
  if (t.text) return t.text;
  if (!t.file) return null;
  const r = await fetch(t.file + "?t=" + Date.now());
  if (!r.ok) return null;
  t.text = await r.text();
  return t.text;
}

// The structure switcher is gone. It was a button plus a menu that listed
// every open structure, and it lived in the label at the top left — the one
// piece of chrome that survived from the desktop layout onto a phone, where
// it cost the corner the handles now use and named a structure the user is
// already looking at.
//
// The tabs themselves are not gone: the poll still opens one per publish and
// switchTab still moves between them. What is gone is the control for doing
// it by hand. With one structure open there was nothing to switch to, and
// with several the newest publish takes the screen on its own — which is the
// case the switcher existed for.
//
// renderTabs is kept as a no-op rather than deleted because four call sites
// invoke it after mutating the tab list, and each of them would otherwise
// throw. A function that does nothing is the honest version of a control
// whose job is finished.
function renderTabs() {}

async function closeTab(i, alreadyDeleted = false) {
  if (i < 0 || i >= state.tabs.length) return;
  const closing = state.tabs[i];
  const name = closing && closing.meta ? closing.meta.name : null;

  // Tell the server first. Closing the tab only in the browser left the
  // archive entry in place, so a reload brought it straight back — the close
  // button appeared not to work. The server drops the archived copy and
  // clears the steps that pointed at it.
  //
  // A failure is not fatal: the tab still closes, and the next reload will
  // simply restore it, which is the behaviour before this was added.
  //
  // `alreadyDeleted` is for the caller that just deleted the whole task: the
  // server has already dropped these structures, and asking again would be a
  // second round trip for nothing.
  if (name && !alreadyDeleted) {
    try {
      await fetch("task.json", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ structure: name }),
      });
    } catch (e) { /* offline; the tab still closes */ }
  }

  state.tabs.splice(i, 1);
  // The pinned step described a structure that may be the one just closed.
  state.pinnedJob = null;

  // The last one is allowed to go. Refusing it left a structure on screen with
  // no way to dismiss it: the switcher hides itself below two tabs, so with one
  // left there is no close button anywhere and the viewer can never be emptied.
  // The empty state is the one the page opens with, so it is already handled.
  if (!state.tabs.length) {
    state.activeTab = -1;
    state.structureName = null;
    showEmptyState();
    renderTabs();
    dropStaleNotice();
    syncPillToTab();
    return;
  }

  if (state.activeTab >= state.tabs.length) state.activeTab = state.tabs.length - 1;
  else if (i < state.activeTab) state.activeTab -= 1;
  // switchTab would bail on i === state.activeTab, and the surviving tab has
  // to be drawn regardless — render it directly.
  const t = state.tabs[state.activeTab];
  state.structureName = t.meta.name || null;
  const text = await tabText(t);
  if (text !== null) renderStructure(text, t.meta, t.state);
  renderTabs();
  dropStaleNotice();
  syncPillToTab();
}

async function switchTab(i) {
  if (i < 0 || i >= state.tabs.length || i === state.activeTab) return;
  // Save the outgoing tab's state before the incoming one overwrites the
  // singletons.
  if (state.activeTab >= 0 && state.tabs[state.activeTab]) {
    state.tabs[state.activeTab].state = captureState();
  }
  state.activeTab = i;
  const t = state.tabs[i];
  state.structureName = t.meta.name || null;
  // The text may have been dropped to keep memory down; fetch it back.
  const text = await tabText(t);
  if (text === null) {
    // The archive entry is gone. Leave the view where it was rather than
    // rendering nothing.
    state.activeTab = state.tabs.findIndex((x, j) => j !== i && x.text);
    if (state.activeTab < 0) state.activeTab = i;
    renderTabs();
    return;
  }
  renderStructure(text, t.meta, t.state);
  renderTabs();
  trimTabText();
  // The pill describes the task that produced what is on screen. Switching
  // to a structure from another task has to move it, or the progress bar
  // and message keep describing a run whose result is no longer displayed.
  //
  // The pin goes too: arriving by tab means the user chose a structure, not
  // a step, so the pill should describe the structure's own task. A caller
  // that wants the pin — a status row click — sets it after this returns.
  state.pinnedJob = null;
  syncPillToTab();
}

// Show a structure by name, opening it from the archive if it is not open.
//
// The status menu's rows outlive the tabs: the tabs are capped at MAX_TABS
// and the status history is not, so a finished step from several pipelines
// ago names a structure that is no longer among them. Those rows used to
// render with no click handler, which made most of the menu dead — and a
// status row that cannot be clicked is the one thing this menu must not
// contain. The archive still has the structure, so it is reopened from
// there: one fetch, and the tab is added at the end like any other.
async function openStructureByName(name) {
  const idx = state.tabs.findIndex(t => t.meta.name === name);
  if (idx >= 0) {
    await switchTab(idx);
    return;
  }
  // Not open. Look for it in the archive index the publisher maintains.
  let entry = null;
  try {
    const r = await fetch("structures.json?t=" + Date.now());
    if (r.ok) {
      const list = await r.json();
      entry = (Array.isArray(list) ? list : [])
        .find(e => e && e.meta && e.meta.name === name) || null;
    }
  } catch (e) { /* no archive */ }
  if (!entry || !entry.file) return;

  // Save the outgoing tab's state, the way switchTab does.
  if (state.activeTab >= 0 && state.tabs[state.activeTab]) {
    state.tabs[state.activeTab].state = captureState();
  }
  state.tabs.push({ file: entry.file, text: null, meta: entry.meta, state: null });
  if (state.tabs.length > MAX_TABS) state.tabs.shift();
  state.activeTab = state.tabs.length - 1;
  state.structureName = entry.meta.name || null;
  const text = await tabText(state.tabs[state.activeTab]);
  if (text === null) {
    // The archive entry is gone after all. Drop the tab rather than
    // rendering nothing.
    state.tabs.pop();
    state.activeTab = state.tabs.length - 1;
    renderTabs();
    return;
  }
  renderStructure(text, entry.meta, null);
  renderTabs();
  trimTabText();
  state.pinnedJob = null;
  syncPillToTab();
}
// Point the status pill at the job that produced the active tab's structure.
//
// The pill is normally driven by whatever published last, which is right
// while a run is in progress. But once the user switches to an older
// structure the two have come apart, and the honest answer to "what is this"
// is the task that made it — not the most recent thing that happened.
// Which step the pill should describe.
//
// Normally the one that produced the structure on screen — the pill answers
// "what is this", and only the tab's own task can. The exception is a run in
// progress: if something is running, its progress is what the user wants to
// watch, and it takes the pill even while an older structure is displayed.
// The pull-up menu still lists everything, so nothing is hidden either way.
//
// A structure records the task that made it, not the step, so the tab's job
// is matched against a step's group. The publisher records which structure
// each step produced, so that is the exact match; the task's newest step is
// the fallback for a structure no step claimed.
//
// A pin wins over all of it. Clicking a status row is the user saying "show
// me this step", and the structure it opens may belong to a different task —
// the input a docking run prepared, say. Following the tab there would swap
// the pill to that other task and lose the row the user chose.
function pillJob() {
  if (state.pinnedJob) return state.pinnedJob;
  const t = state.tabs[state.activeTab];
  const tabJob = t && t.meta ? (t.meta.job || "") : "";
  const tabName = t && t.meta ? (t.meta.name || "") : "";
  const jobs = (lastStatus && lastStatus.jobs) || [];
  const running = jobs.find(j => j.state === "running");
  if (running) return running.id;
  if (tabJob) {
    const mine = jobs.filter(j => (j.group || j.id) === tabJob);
    const exact = mine.find(j => j.structure === tabName);
    if (exact) return exact.id;
    if (mine.length) {
      return mine.reduce((a, b) =>
        ((b.index || 0) > (a.index || 0) ? b : a)).id;
    }
  }
  return undefined;
}

function syncPillToTab() {
  if (!lastStatus) return;
  renderStatus(lastStatus, pillJob());
}

/* ---------------- polling ---------------- */

// Whether a task has finished since the last poll.
//
// The notice means "a run finished, there is a structure to look at" — so it
// is keyed on the task's state, not on the contract file's timestamp. Every
// publish rewrites current.json, including the `--status --state running` one
// a skill makes before it does any work, so watching the timestamp raised the
// notice the moment a task was queued and again when it finished. Two bells
// for one run, the first of them a lie.
//
// A job is "newly done" when it is done now and was not done last time. The
// set of ids seen done is what makes that decidable: a job that was already
// done when the page loaded is not news, and neither is one that has been
// done for several polls.
function newlyDoneJobs(status, seen) {
  const jobs = (status && status.jobs) || [];
  const out = [];
  for (const j of jobs) {
    if (!j || j.state !== "done" || !j.id) continue;
    if (seen.has(j.id)) continue;
    seen.add(j.id);
    out.push(j);
  }
  return out;
}

async function poll() {
  try {
    const res = await fetch("current.json?t=" + Date.now());
    if (res.ok) {
      const meta = await res.json();
      // Compare against the contract's own last-seen timestamp, not the
      // active tab's. A tab switched to an older structure has an older
      // timestamp, and using it here would make every poll think the
      // contract had changed.
      //
      // The first poll of a page load only records the timestamp. It starts
      // null and the contract file carries whatever was published last —
      // possibly hours ago — so the two never match on that first read, and
      // every reload raised a notice for a structure the user had already
