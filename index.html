  /** Timestamp last seen in current.json, independent of which tab is shown */
  contractUpdated: null,
  /**
   * Ids of jobs already seen in the `done` state, or null before the first
   * status read.
   *
   * The publish notice is raised for a job that turned done since the last
   * poll, so the ones already done when the page loaded have to be recorded
   * without being announced — otherwise every reload rings the bell for runs
   * that finished hours ago. Null is what makes the first read seed the set
   * instead of comparing against an empty one, which would announce all of
   * them.
   */
  seenDoneJobs: null,
  /** Name of the structure the publish notice is offering, or null if none */
  noticeName: null,
  /** Name of the active structure, for selection.json */
  structureName: null,
  /** key → {sel, label, color, chain?, atom?, bond?, pocket?} */
  selection: {},
  /** Chain IDs hidden by the eye toggles */
  hiddenChains: new Set(),
  /** "res" | "chain" | "atom" | "bond" */
  selMode: "res",
  /** Residue currently under the cursor, for the hover preview */
  hover: null,
  /** Loaded structures: [{text, meta, state}] */
  tabs: [],
  /** Index into tabs of the structure on screen */
  activeTab: -1,
  /**
   * Job id the user pinned by clicking a status row, or null.
   *
   * Clicking a step shows the structure that step belongs to, which is not
   * always a structure that step's task produced — "preparing the receptor"
   * points at the input, which another task published. Deriving the pill
   * from the tab alone would then show that other task's status, and the row
   * the user just clicked would stop being the one on screen. The pin keeps
   * the clicked step selected until something else takes over: a new
   * publish, or the user clicking another row.
   */
  pinnedJob: null,
};

// Snapshot the per-structure part of the state, so a tab can restore it.
function captureState() {
  return {
    selection: JSON.parse(JSON.stringify(state.selection)),
    hiddenChains: [...state.hiddenChains],
  };
}

// Install a snapshot taken by captureState. Called before anything reads
// the state.selection — applyStyle() paints from it, so restoring afterwards
// leaves the previous structure's highlights on screen.
function restoreState(snap) {
  state.selection = snap && snap.selection ? snap.selection : {};
  state.hiddenChains = new Set(snap && snap.hiddenChains ? snap.hiddenChains : []);
}

if (!webglAvailable()) {
  const hint = document.getElementById("viewer-hint");
  hint.classList.remove("hidden");
  hint.innerHTML =
    '<div class="big">3D 渲染不可用</div>' +
    '<div class="small">浏览器已达到 WebGL 上下文上限。' +
    '关闭其他标签页后刷新此页面即可恢复。</div>';
}

const hint = document.getElementById("viewer-hint");
const metricsPanel = document.getElementById("metrics");
const metricsRows = document.getElementById("metrics-rows");
const metricsNotes = document.getElementById("metrics-notes");
const seqPanel = document.getElementById("seq-panel");
const seqTitle = document.getElementById("seq-title");
const seqLen = document.getElementById("seq-len");
const seqBody = document.getElementById("seq-body");
const statusBar = document.getElementById("status");

// Shapes and labels are kept separately because 3Dmol removes them through
// different calls — removeShape for the cylinder, removeLabel for the text
// sprite. Passing one to the other's remover is a silent no-op, which would
// leave the old label on screen forever.
//
// Declared here, next to the other DOM handles, because renderStructure
// clears them and runs long before the distance-line code below.
let distShapes = [];
let distLabels = [];

const AA3TO1 = {
  ALA:'A', ARG:'R', ASN:'N', ASP:'D', CYS:'C', GLN:'Q', GLU:'E', GLY:'G',
  HIS:'H', ILE:'I', LEU:'L', LYS:'K', MET:'M', PHE:'F', PRO:'P', SER:'S',
  THR:'T', TRP:'W', TYR:'Y', VAL:'V',
  MSE:'M', SEC:'U', PYL:'O', HYP:'P', SEP:'S', TPO:'T', PTR:'Y'
};

/* ---------------- structure rendering ---------------- */

function extractChains(model) {
  if (!model || !model.selectedAtoms) return [];
  let atoms = [];
  try { atoms = model.selectedAtoms({}) || []; } catch (e) { return []; }

  const byChain = new Map();
  atoms.forEach(a => {
    if (!a) return;
    const one = AA3TO1[(a.resn || "").toUpperCase()];
    if (!one) return;
    const chain = a.chain || "_";
    if (!byChain.has(chain)) byChain.set(chain, new Map());
    const residues = byChain.get(chain);
    const key = a.resi != null ? a.resi : a.serial;
    if (!residues.has(key)) residues.set(key, one);
  });

  return [...byChain.entries()].map(([chain, residues]) => ({
    chain,
    seq: [...residues.values()].join(""),
    residues: [...residues.keys()]
  }));
}

// Chains the user has hidden. Kept across style/state.selection changes so
// hiding survives a re-render; restored per tab when switching.
function chainHidden(chainId) {
  return state.hiddenChains.has(chainId);
}

// Eye / eye-off icons. Inline SVG rather than emoji so the colour can be
// controlled and the glyph stays crisp at 13px.
const EYE_ON =
  '<svg viewBox="0 0 24 24"><path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>';
const EYE_OFF =
  '<svg viewBox="0 0 24 24"><path d="M2 4.3 3.4 3 21 20.6 19.6 22l-3.1-3.1A11 11 0 0 1 12 19c-5 0-9.3-3.1-11-7a12.6 12.6 0 0 1 4.2-5.2L2 4.3zM12 7a5 5 0 0 1 4.7 6.7l-2-2A3 3 0 0 0 10.3 9.3l-2-2A5 5 0 0 1 12 7zm10 5c-.6 1.4-1.6 2.7-2.9 3.8l-1.5-1.5A9.9 9.9 0 0 0 19.4 12a9.8 9.8 0 0 0-4.4-4.3l-1.5-1.5A11 11 0 0 1 12 5c5 0 9.3 3.1 11 7z"/></svg>';

// Residues per line in the sequence panel. A fixed count rather than
// wrapping to the panel width: rows of a known length line up between
// chains, so the same position in two chains sits at the same x and the
// two can be read against each other. 50 is the convention sequence
// viewers have settled on and fits the panel without scrolling.
const SEQ_ROW_LEN = 50;

// One row per chain: an eye toggle on the left, the chain name, and the
// sequence underneath. Clicking the eye hides that chain in the 3D view.
function chainRow(chainId, label, seqText) {
  const row = document.createElement("div");
  row.className = "seq-chain";

  const head = document.createElement("div");
  head.className = "seq-chain-head";

  const hidden = chainHidden(chainId);
  const eye = document.createElement("button");
  eye.className = "seq-eye" + (hidden ? " off" : "");
  eye.type = "button";
  eye.title = hidden ? "Show this chain" : "Hide this chain";
  eye.innerHTML = hidden ? EYE_OFF : EYE_ON;
  eye.addEventListener("click", () => {
    if (state.hiddenChains.has(chainId)) {
      state.hiddenChains.delete(chainId);
    } else {
      state.hiddenChains.add(chainId);
    }
    // Rebuild the sequence first, then style. applyStyle ends with
    // paintSequenceSelection, which paints the selection onto the
    // .seq-aa elements — and renderSequence replaces those elements via
    // innerHTML. The other order paints the old DOM and the new letters
    // come up blank, so a selected residue loses its highlight the moment
    // any chain's eye is toggled.
    renderSequence(null);
    applyStyle();
  });

  const name = document.createElement("span");
  name.className = "seq-chain-name";
  name.textContent = label;

  head.append(eye, name);
  row.appendChild(head);

  if (seqText) {
    const body = document.createElement("div");
    body.className = "seq-chain-seq";
    // One span per residue rather than a single text node: a drag across
    // the sequence has to know which residues it crossed, and that needs
    // something to hit-test against. `residues` is the parallel array of
    // residue numbers from extractChains — same order as the letters.
    const resNums = (state.chains.find(c => c.chain === chainId) || {}).residues || [];
    const letters = [...seqText];
    // Fixed-width rows of SEQ_ROW_LEN. Letting the browser wrap wherever
    // the panel ends puts a different number of letters on each line, so
    // residue 100 sits at one x in chain A and another in chain B — the two
    // sequences cannot be read against each other. Rows of a known length
    // line up, and the last row is simply short.
    for (let start = 0; start < letters.length; start += SEQ_ROW_LEN) {
      const line = document.createElement("span");
      line.className = "seq-row";
      for (let i = start; i < Math.min(start + SEQ_ROW_LEN, letters.length); i++) {
        const s = document.createElement("span");
        s.className = "seq-aa";
        s.textContent = letters[i];
        s.dataset.chain = chainId;
        if (resNums[i] !== undefined) s.dataset.resi = resNums[i];
        line.appendChild(s);
      }
      body.appendChild(line);
    }
    row.appendChild(body);
  }
  return row;
}

/* ---------------- sequence drag selection ---------------- */

// Dragging across the sequence selects every residue crossed, the same way
// dragging across text in an editor selects a range. Clicking a single
// letter still selects just that residue.
//
// The letters are spans with data-chain / data-resi, so the range is read
// off the DOM rather than computed from pixel offsets — which would need
// the font metrics and break the moment the panel is scrolled or wrapped.

let seqDrag = null;   // { chain, anchorResi, currentResi } while dragging
let seqDragMoved = false;

function seqLetterFromEvent(ev) {
  const el = ev.target.closest ? ev.target.closest(".seq-aa") : null;
  if (!el || el.dataset.resi === undefined) return null;
  return { chain: el.dataset.chain, resi: el.dataset.resi, el };
}

// Residues between two positions in one chain, inclusive, in sequence
// order. The letters are laid out in the order extractChains saw them, so
// the index range is the answer — no need to sort by residue number, which
// would be wrong for a chain with insertion codes or non-contiguous
// numbering.
function seqRange(chainId, fromResi, toResi) {
  const info = state.chains.find(c => c.chain === chainId);
  if (!info) return [];
  const i = info.residues.findIndex(r => String(r) === String(fromResi));
  const j = info.residues.findIndex(r => String(r) === String(toResi));
  if (i < 0 || j < 0) return [];
  const [lo, hi] = i <= j ? [i, j] : [j, i];
  return info.residues.slice(lo, hi + 1);
}

function seqApplyDrag() {
  if (!seqDrag) return;
  const { chain, anchorResi, currentResi } = seqDrag;
  const range = seqRange(chain, anchorResi, currentResi);

  // Toggle the dragged range against what is already selected.
  //
  // A drag adds the residues it covers, except the ones already selected —
  // those come off. That makes the gesture its own inverse: drag the same
  // stretch twice and it is back to unselected, and dragging across a
  // selection that runs off the end of the range trims it rather than
  // growing it. Selecting a set of hotspots is a process of refinement, and
  // without this the only way to remove a residue is to find its row in the
  // Selection panel and click the ×.
  //
  // A plain click on one letter lands here with a one-element range, so it
  // toggles that single residue — the same behaviour as clicking it in the
  // 3D view.
  range.forEach(resi => {
    const key = `${chain}:${resi}`;
    if (state.selection[key]) {
      delete state.selection[key];
      return;
    }
    const atom = (viewer.getModel().atoms || [])
      .find(a => a.chain === chain && String(a.resi) === String(resi));
    state.selection[key] = {
      sel: { chain, resi: isNaN(Number(resi)) ? resi : Number(resi) },
      label: atom ? selLabel(atom) : `${chain}:${resi}`,
      color: nextColor(chain),
    };
  });
  applyStyle();
  renderSelectionPanel();
  persistSelection(Object.keys(state.selection));
}

// Paint the range as it is dragged, so the user sees what the gesture will
// do. Letters already selected and inside the range are marked for removal
// rather than addition — the preview has to show the toggle, not just the
// add, or dragging over an existing selection looks like it will do
// nothing.
function seqPaintDrag() {
  if (!seqDrag) return;
  const { chain, anchorResi, currentResi } = seqDrag;
  const inRange = new Set(seqRange(chain, anchorResi, currentResi).map(String));
  document.querySelectorAll(".seq-aa").forEach(el => {
    if (el.dataset.chain !== chain) return;
    el.classList.remove("seq-drag", "seq-drag-off");
    if (!inRange.has(el.dataset.resi)) return;
    const key = `${chain}:${el.dataset.resi}`;
    if (state.selection[key]) {
      el.classList.add("seq-drag-off");
    } else {
      el.classList.add("seq-drag");
    }
  });
}

document.addEventListener("mousedown", ev => {
  // Ignore a press that lands outside the sequence, and ignore a second
  // press while a drag is already running — without the guard a stray
  // mousedown mid-drag re-anchors the range and the selection jumps to
  // wherever the pointer happened to be.
  if (seqDrag) return;
  const hit = seqLetterFromEvent(ev);
  if (!hit) return;
  // Only the primary button starts a drag; a right-click should still open
  // the context menu.
  if (ev.button !== 0) return;
  ev.preventDefault();
  seqDrag = { chain: hit.chain, anchorResi: hit.resi, currentResi: hit.resi };
  seqDragMoved = false;
  seqPaintDrag();
});

document.addEventListener("mousemove", ev => {
  if (!seqDrag) return;
  const hit = seqLetterFromEvent(ev);
  // A drag stays inside one chain: crossing into another chain's block
  // leaves the range where it was rather than measuring across two
  // different sequences, whose residue numbers are unrelated.
  if (!hit || hit.chain !== seqDrag.chain) return;
  if (hit.resi !== seqDrag.currentResi) {
    seqDrag.currentResi = hit.resi;
    seqDragMoved = true;
    seqPaintDrag();
  }
});

document.addEventListener("mouseup", () => {
  if (!seqDrag) return;
  const drag = seqDrag;
  seqDrag = null;
  // Both preview classes, not just the add one. Leaving seq-drag-off
  // behind strands the strikethrough on letters that are no longer being
  // dragged — and since the class also drops the background, the letter
  // reads as deselected while the Selection panel still lists it.
  document.querySelectorAll(".seq-aa.seq-drag, .seq-aa.seq-drag-off")
    .forEach(el => el.classList.remove("seq-drag", "seq-drag-off"));
  // A click that never moved is a single-residue selection, which
  // seqApplyDrag already produces from a one-element range — so both paths
  // go through the same code.
  seqDrag = drag;
  seqApplyDrag();
  seqDrag = null;
});

function renderSequence(chainInfo) {
  if (!chainInfo) {
    // "All chains" selected — one block per chain, each with its own hide
    // toggle. Ligand chains carry no amino acids so extractChains skips
    // them; take them from the metadata so every chain on screen is listed.
    const ligandChains = (state.meta.chains || []).filter(c => c.ligand);
    if (!state.chains.length && !ligandChains.length) {
      seqPanel.classList.remove("show");
      return;
    }
    seqTitle.textContent = "All chains";
    seqLen.textContent = `${state.chains.length + ligandChains.length} chains`;
    seqBody.innerHTML = "";
    state.chains.forEach(c => {
      const role = ((state.meta.chains || []).find(m => m.id === c.chain) || {}).role;
      const label = `Chain ${c.chain}${role ? " — " + role : ""}  (${c.seq.length} aa)`;
      seqBody.appendChild(chainRow(c.chain, label, c.seq));
    });
    ligandChains.forEach(c => {
      const label = `Ligand ${c.id}${c.role ? " — " + c.role : ""}  (${c.residues} res)`;
      seqBody.appendChild(chainRow(c.id, label, ""));
    });
    seqPanel.classList.add("show");
    return;
  }
  seqTitle.textContent = `Chain ${chainInfo.chain}`;
  seqLen.textContent = `${chainInfo.seq.length} residues`;
  seqBody.innerHTML = "";
  seqBody.appendChild(chainRow(
    chainInfo.chain,
    `Chain ${chainInfo.chain}  (${chainInfo.seq.length} aa)`,
    chainInfo.seq));
  seqPanel.classList.add("show");
}

// Metrics come from many tools and span wildly different scales — an
// e-value of 1.4e-30 and a bit score of 1516 both have to stay readable.
// toFixed(3) turns the former into "0.000", so very small and very large
// magnitudes fall back to exponential / compact notation.
//
// Decimals are kept as written rather than rounded to a fixed width: a
// cLogP of -4.73 is a measurement with two significant decimals, and
// showing -4.7 silently drops one. Only trailing zeros are trimmed, so
// 0.570 still reads as 0.57 and 12 stays 12.
function formatMetric(v) {
  if (typeof v !== "number") return String(v);
  if (v === 0) return "0";
  const abs = Math.abs(v);
  if (abs < 0.001 || abs >= 1e6) return v.toExponential(2);
  if (Number.isInteger(v)) return String(v);
  // Enough places to keep the value's own precision, then trim the zeros.
  return parseFloat(v.toFixed(4)).toString();
}

// A metric entry is either a bare value or an object the skill wrote
// itself:
//   {"label": "ri 柔性对接", "value": -9.12, "hint": "kcal/mol，越负越强"}
// The viewer keeps no vocabulary of its own — the skill names its metrics
// and decides how much to explain. A bare number still renders, so a
// quick publish never has to invent a label.
function metricParts(key, entry) {
  if (entry && typeof entry === "object" && !Array.isArray(entry)) {
    return {
      label: entry.label || key,
      value: "value" in entry ? entry.value : "",
      hint: entry.hint || ""
    };
  }
  return { label: key, value: entry, hint: "" };
}

function renderMetrics(meta) {
  const m = meta.metrics || {};
  const keys = Object.keys(m);
  if (!keys.length && !meta.notes) {
    metricsPanel.classList.remove("show");
    return;
  }
  metricsRows.innerHTML = "";
  keys.forEach(k => {
    const { label, value, hint } = metricParts(k, m[k]);
    const row = document.createElement("div");
    row.className = "m-row";
    row.innerHTML = `<span class="k"></span><span class="v"></span>`;
    row.querySelector(".k").textContent = label;
    const v = row.querySelector(".v");
    v.textContent = (value === undefined || value === null)
      ? "" : formatMetric(value);
    if (hint) {
      const h = document.createElement("span");
      h.className = "m-hint";
      h.textContent = hint;
      v.appendChild(h);
    }
    metricsRows.appendChild(row);
  });
  // notes carries the skill's explanation and suggestion; keep it verbatim
  // so the wording the skill chose is what the user reads.
  metricsNotes.textContent = meta.notes || "";
  metricsNotes.style.display = meta.notes ? "" : "none";
  metricsPanel.classList.add("show");
}

const stylePicker = document.getElementById("style-picker");
const colorPicker = document.getElementById("color-picker");
const ligandStylePicker = document.getElementById("ligand-style-picker");
const resetBtn = document.getElementById("reset-btn");
const stageSel = document.getElementById("stage-sel");
const stageFile = document.getElementById("stage-file");
const stagePickBtn = document.getElementById("stage-pick");

// Changing the backdrop repaints the canvas and re-themes the page. The choice
// is remembered so the next load opens on the same stage.
stageSel.addEventListener("change", () => {
  const name = stageSel.value;
  // The custom option is not a backdrop in itself — it is a request for a
  // file, and the picker is opened by the button beside the select rather
  // than from here. Calling input.click() out of a change event is a
  // synthetic gesture, and browsers are entitled to refuse it: the dialog
  // simply never opens, which looks like the control doing nothing at all.
  // A real button the user presses is a gesture no browser argues with.
  if (name === "custom") {
    stagePickBtn.hidden = false;
    stagePickBtn.focus();
    return;
  }
  stagePickBtn.hidden = true;
  stageApply(name);
  try { localStorage.setItem(STAGE_KEY, name); } catch (e) { /* private mode */ }
});

// The button that opens the file picker for a custom backdrop.
//
// Separate from the select because a select's change handler cannot reliably
// open a file dialog — see the note there. It appears next to the select only
// while the custom option is chosen, so the toolbar carries one more control
// only when there is a reason for it.
stagePickBtn.addEventListener("click", () => stageFile.click());

// A file was chosen. It is read in the browser and posted as a data URL, so
// the server writes one file and the page uses a plain URL afterwards — no
// second request to read the bytes back, and no multipart form to parse.
stageFile.addEventListener("change", () => {
  const file = stageFile.files && stageFile.files[0];
  if (!file) return;
  // Refused here rather than after the upload: a 20 MB photograph posted over
  // localhost is a few seconds of nothing happening, and the reason is known
  // before the bytes move.
  if (file.size > 16 * 1024 * 1024) {
    agentAppend("error", "\u56fe\u7247\u592a\u5927\uff08\u4e0a\u9650 16 MB\uff09");
    stageFile.value = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    fetch("stage-image", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: reader.result }),
    }).then(r => r.json()).then(d => {
      if (d.error) {
        agentAppend("error", `\u80cc\u666f\u8bbe\u7f6e\u5931\u8d25\uff1a${d.error}`);
        return;
      }
      stageImageUrl = d.url || "";
      stageApply("custom");
      try {
        localStorage.setItem(STAGE_KEY, "custom");
        localStorage.setItem(STAGE_IMAGE_KEY, stageImageUrl);
      } catch (e) { /* private mode */ }
    }).catch(e => agentAppend("error", `\u80cc\u666f\u8bbe\u7f6e\u5931\u8d25\uff1a${e.message}`));
  };
  reader.onerror = () => agentAppend("error", "\u8bfb\u4e0d\u4e86\u8fd9\u4e2a\u6587\u4ef6");
  reader.readAsDataURL(file);
  // Cleared so choosing the same file twice in a row fires change again —
  // otherwise the second pick is indistinguishable from no pick at all.
  stageFile.value = "";
});

// `snap` is a per-tab snapshot from captureState(), or null for a
// structure arriving fresh from a publish.
function renderStructure(data, meta, snap) {
  state.meta = meta;

  // Restore this tab's selection before anything reads it.
  //
  // state.selection and state.hiddenChains still hold the previous tab's
  // contents on entry. applyStyle() below paints from them, so restoring
  // afterwards left the old tab's highlights drawn on the new structure
  // while the panel showed the new tab's state — a residue appearing
  // selected in two tabs at once, and the tab it belonged to showing
  // nothing.
  restoreState(snap);

  const fmt = meta.format === "pdb" ? "pdb" : "mmcif";

  // Clear, then build, then render — all before yielding to the browser.
  //
  // The flicker came from removeAllModels() emptying the scene while
  // render() was not reached until the styles were set several statements
  // later; the browser painted one blank frame in between. Everything from
  // here to viewer.render() is synchronous, so no frame is produced until
  // the new model is fully styled.
  //
  // removeModel(id) is not an alternative: viewer.models is a sparse array
  // keyed by ID, and deleting a middle entry leaves its length unchanged,
  // so the model count climbs on every poll even though only one is drawn.
  //
  // Any distance line belongs to the model going away — its coordinates are
  // meaningless in the new structure's frame. Clearing it here rather than
  // in drawDistanceLines keeps a stale line from flashing for one frame
  // between the model swap and the next applyStyle.
  clearDistanceLines();
  viewer.removeAllModels();
  // keepH, because 3Dmol discards hydrogens by default.
  //
  // Its PDB parser does `const s = !t.keepH; ... "H"===f && s && continue` —
  // every hydrogen in the file is dropped on load unless the options say
  // otherwise, and the CIF parser has the same switch. The skills build
  // hydrogens deliberately: prepare_complex.py runs PDBFixer and
  // Modeller.addHydrogens so the MD system has 11k of them, and the
  // molecule-editing skill places them on every group it grafts. Publishing
  // that structure and having the viewer silently throw the hydrogens away
  // reads as "the structure has no hydrogens" — the user asks for them to be
  // filled in, they are already there, and nothing on screen says why they
  // are not visible.
  viewer.addModel(data, fmt, { keepH: true });

  // removeAllModels() clears click bindings — re-attach for the new model
  viewer.setClickable({}, true, onAtomClick);
  // 3Dmol waits 500 ms before firing a hover, which feels laggy for a
  // tooltip that is only naming the residue under the cursor.
  viewer.setHoverDuration(0);
  viewer.setHoverable({}, true, onAtomHover, onHoverOut);

  state.chains = extractChains(viewer.getModel());
  const isPeptide = state.chains.length > 0;
  if (isPeptide) {
    applyStyle();
  } else {
    // Non-protein (ligands, nucleic acids): plain sticks
    viewer.setStyle({}, { stick: { radius: 0.15, colorscheme: "Jmol" } });
  }
  viewer.zoomTo();
  viewer.render();

  hint.classList.add("hidden");

  // The view is always the whole complex; per-chain control lives in the
  // sequence panel's eye toggles.
  const metaChains = meta.chains || [];
  const ligandChains = metaChains.filter(c => c.ligand);
  if (state.chains.length === 0 && ligandChains.length === 0) {
    seqPanel.classList.remove("show");
  } else {
    renderSequence(null);
  }

  renderMetrics(meta);

  // Enable the style controls. The state.selection state was restored at the top
  // of this function, before applyStyle() painted from it.
  stylePicker.disabled = false;
  colorPicker.disabled = false;
  ligandStylePicker.disabled = ligandChains.length === 0;
  resetBtn.disabled = false;
  viewer.removeAllLabels();
  // A publish's highlight applies once, when the structure arrives. On a
  // tab switch it would re-add residues the user has since dismissed, so
  // it is skipped when restoring a saved snapshot.
  if (!snap) applyHighlights(meta);
  renderSelectionPanel();
}

// A skill can ask for residues to be highlighted on publish, so the user
// sees what was just changed without hunting for it. current.json carries
//
//   "highlight": [{"chain": "A", "resi": 385}, ...]
//
// and those residues are selected exactly as if the user had clicked them
// — same colours, same panel rows, same state.selection.json. The user can then
// dismiss them individually or clear the lot.
//
// Residues that are not in the loaded model are skipped rather than
// erroring: a skill may name a residue the published structure does not
// contain (a chain it dropped, a numbering that shifted).
function applyHighlights(meta) {
  const wanted = meta.highlight;
  if (!Array.isArray(wanted) || !wanted.length) return;

  const model = viewer.getModel();
  if (!model) return;
  const atoms = model.atoms || [];
  const byKey = {};
  atoms.forEach(a => { byKey[selKey(a)] = a; });

  wanted.forEach(w => {
    if (!w || !w.chain || w.resi === undefined) return;
    const key = `${w.chain}:${w.resi}`;
    const atom = byKey[key];
    if (!atom) return;
    if (state.selection[key]) return;
    state.selection[key] = {
      sel: { chain: atom.chain, resi: atom.resi },
      label: selLabel(atom),
      color: nextColor(atom.chain),
    };
  });
  applyStyle();
}

/* ---------------- style controls ---------------- */

// A blue-white palette, keyed by chain ID. Chains beyond the list fall
// back to the last entry, so a structure with more chains than colours
// A blue-to-white ramp, keyed by chain ID. Chains beyond the list fall back
// to the last entry, so a structure with more chains than colours still
// renders. Chosen over a 3Dmol gradient because CustomLinear does not apply
// to cartoon rendering in this build.
//
// The ramp starts light and ends white. A ramp that begins at a saturated
// navy looks uniformly dark on a two- or three-chain complex, since those
// only ever use the first few entries — the pale end has to be reachable
// from the start, not reserved for the eighth chain.
const BLUE_WHITE = ["#7dd3fc", "#bae6fd", "#e0f2fe", "#f0f9ff",
                    "#ffffff", "#ffffff", "#ffffff", "#ffffff"];

// `chains` is the array from extractChains: [{chain, seq, residues}]. The
// key is the chain ID string, not the object — using the object made every
// entry "[object Object]" and the whole structure rendered in one colour.
function chainColorMap(chains) {
  const map = {};
  (chains || []).forEach((c, i) => {
    const id = typeof c === "string" ? c : c.chain;
    if (id == null) return;
    map[id] = BLUE_WHITE[Math.min(i, BLUE_WHITE.length - 1)];
  });
  return map;
}

// Secondary structure follows the same ramp: helices deepest, sheets mid,
// coils the palest — so the fold is legible without leaving the palette.
const SS_BLUE_WHITE = { h: "#38bdf8", s: "#bae6fd", c: "#f0f9ff" };

// Element colours for the per-atom styles (stick, sphere, line). A
// chain-coloured stick render makes every atom the same colour, which
// hides the chemistry; these keep O, N and S readable while staying in a
// cool palette. Jmol's own element colours are the reference here.
const ELEMENT_COLORS = {
  C: "#9ca3af", N: "#2563eb", O: "#ef4444", S: "#eab308",
  H: "#f8fafc", P: "#0ea5e9", SE: "#f59e0b", FE: "#f97316",
};

// Same hues, lifted in brightness, for a selected ligand. Flattening to a
// single highlight colour destroys the O/N/C readout, and merely making
// the sticks thicker looks clumsy — a brighter version of the same palette
// says "selected" while keeping the chemistry legible.
const ELEMENT_COLORS_HI = {
  C: "#e5e7eb", N: "#60a5fa", O: "#fb7185", S: "#fde047",
  H: "#ffffff", P: "#38bdf8", SE: "#fbbf24", FE: "#fb923c",
};

// Blend a hex colour toward another by t (0 = base, 1 = target).
function mixHex(base, target, t) {
  const b = parseInt(base.slice(1), 16);
  const g = parseInt(target.slice(1), 16);
  const r = Math.round(((b >> 16) & 255) * (1 - t) + ((g >> 16) & 255) * t);
  const gr = Math.round(((b >> 8) & 255) * (1 - t) + ((g >> 8) & 255) * t);
  const bl = Math.round((b & 255) * (1 - t) + (g & 255) * t);
  return "#" + ((1 << 24) | (r << 16) | (gr << 8) | bl).toString(16).slice(1);
}

// Element colours tinted toward the user's state.selection colour. The molecule
// keeps its O/N/C identity but visibly carries the state.selection colour, which
// is what the swatch in the Selection panel promises.
function elementColorsTinted(selColor, t = 0.55) {
  const out = {};
  for (const [el, hex] of Object.entries(ELEMENT_COLORS)) {
    out[el] = mixHex(hex, selColor, t);
  }
  return out;
}

// 3Dmol distinguishes two style fields: `color` takes a literal colour
// ("red", "#ff0000") while `colorscheme` takes the name of a built-in
// scheme. Passing a scheme name to `color` logs "color not found" for
// every atom and falls back to the default.
//
// "spectrum" is the exception — it is a gradient, not an entry in the
// scheme table, and only works through `color`. Verified by pixel count:
// color:"spectrum" gives 63% coloured pixels, colorscheme:"spectrum" 13%.
//
// `perAtom` selects element colours instead of the chain/secondary
// scheme, for styles that draw individual atoms.
function colorSpec(scheme, chains, perAtom = false) {
  if (perAtom) {
    return { colorscheme: { prop: "elem", map: ELEMENT_COLORS } };
  }
  switch (scheme) {
    case "chain":
      return { colorscheme: { prop: "chain", map: chainColorMap(chains) } };
    case "secondary":
      return { colorscheme: { prop: "ss", map: SS_BLUE_WHITE } };
    default:          return { color: "spectrum" };
  }
}

function styleSpec(kind, scheme, chains) {
  // stick/sphere/line draw atoms, so they get element colours; cartoon and
  // surface draw the fold, so they keep the chain/secondary scheme.
  const perAtom = (kind === "stick" || kind === "sphere" || kind === "line");
  const color = colorSpec(scheme, chains, perAtom);
  // 3Dmol's default lighting is a single hard key light, which carves deep
  // shadows out of a surface and buries anything inside a pocket. A strong
  // ambient term lifts the shadow side to a mid tone rather than black, and
  // the emission keeps the pale end of the ramp reading as white instead of
  // grey.
  const soft = { ...color, ambientColor: "#c8d6e8", emissiveColor: "#5b6b80" };
  switch (kind) {
    case "stick":   return { stick: { ...color, radius: 0.18 } };
    case "sphere":  return { sphere: { ...color, scale: 0.5 } };
    case "line":    return { line: { ...color, linewidth: 2 } };
    case "surface": return { cartoon: soft, surface: { opacity: 0.15, color: "white", ambientColor: "#7f8ea3" } };
    default:        return { cartoon: soft, stick: {} };
  }
}

// How a small molecule is drawn. Jmol element colours throughout — blue
// N, red O, grey C — the convention chemists read at a glance, and it
// keeps the ligand distinguishable from a protein coloured by chain.
//
// `thick` is set when the protein is drawn as a surface: that shell is
// depth-sorted and opaque, so anything inside the pocket needs extra
// visual weight to read through it.
// A ligand chain's rendering style, chosen independently of the protein's.
//
// This is the style the user picked, applied as-is. Isolated atoms — metal
// ions — need a sphere on top, because stick and line render only bonds and
// a single atom has none; that is added by the caller, per atom, so a
// bonded molecule's appearance is untouched.
function ligandStyleSpec(kind, thick) {
  switch (kind) {
    case "stick":
      return { stick: { radius: thick ? 0.3 : 0.22, colorscheme: "Jmol" } };
    case "spacefill":
      return { sphere: { scale: thick ? 0.55 : 0.45, colorscheme: "Jmol" } };
    case "line":
      return { line: { linewidth: thick ? 4 : 3, colorscheme: "Jmol" } };
    case "ballstick":
    default:
      return {
        stick: { radius: thick ? 0.3 : 0.22, colorscheme: "Jmol" },
        sphere: { scale: thick ? 0.42 : 0.32, colorscheme: "Jmol" }
      };
  }
}

// The sphere an isolated atom needs to be visible at all. A metal ion has
// no bonds, and stick and line draw only bonds, so without this a zinc ion
// renders as nothing while the chain panel lists it as a ligand.
const ION_SPHERE = { sphere: { scale: 0.32, colorscheme: "Jmol" } };

// True when an atom has no bonds to anything — a lone ion rather than part
// of a molecule.
function isIsolatedAtom(atom) {
  return !atom.bonds || atom.bonds.length === 0;
}

// How a selected residue is marked. It has to match the style the protein
// is drawn in, otherwise the highlight replaces that residue's rendering
// and looks detached — sticks over a surface float outside the shell.
//
// Every case also draws the side chain as sticks. A residue selected in a
// surface or cartoon view is otherwise just a patch of colour, which says
// "here" but not "what is here" — and the side chain is what a mutation
// actually changes. The backbone representation is kept underneath, so the
// residue stays in context rather than being replaced by loose sticks.
function selectionHighlightSpec(kind) {
  const sidechain = { stick: { radius: 0.22, colorscheme: "Jmol" } };
  switch (kind) {
    case "surface":
      return { cartoon: {}, surface: { opacity: 0.85 }, ...sidechain };
    case "stick":
      return { stick: { radius: 0.3 }, ...sidechain };
    case "sphere":
      return { sphere: { scale: 0.6 }, ...sidechain };
    case "line":
      return { line: { linewidth: 5 }, ...sidechain };
    default:
      return { cartoon: {}, stick: { radius: 0.25 }, ...sidechain };
  }
}

// Hover preview: the same treatment a click would apply, at reduced
// opacity, so the user sees what selecting this residue would look like
// before committing to it.
//
// The side chain is drawn in Jmol element colours rather than the hover
// tint — a preview that flattens the chemistry tells the user less than
// the residue's own O/N/C readout does.
function hoverHighlightSpec(kind) {
  const spec = selectionHighlightSpec(kind);
  const out = {};
  for (const [k, v] of Object.entries(spec)) {
    if (k === "stick" && v.colorscheme) {
      out[k] = { ...v };                       // side chain keeps its colours
    } else if (k === "surface") {
      out[k] = { ...v, color: HOVER_COLOR };
    } else {
      out[k] = { ...v, color: HOVER_COLOR };
    }
  }
  return out;
}

const HOVER_COLOR = "#93c5fd";
// How long the pointer must rest on a residue before the 3D preview
// appears. Long enough that sweeping across the structure does not
// repaint every residue it crosses; short enough to feel immediate.
const HOVER_PREVIEW_MS = 100;
let hoverPreviewTimer = null;
// Whether a preview is currently painted. 3Dmol fires hover-out only when
// the pointer leaves the model, so moving between residues has to clear
// the previous preview itself.
let hoverPreviewed = false;

// What the hover preview applies to, per selection mode. In res mode it is
// the residue; in atom/bond mode it is the atom or bond under the cursor,
// matching what a click would select.
// What the hover preview covers. Always the whole residue, in every mode.
//
// In atom and bond mode a click selects one atom or one bond, but that is
// a poor thing to preview: a lone atom is a dot with no context, and the
// user is usually asking "what is this residue" rather than "what is this
// atom". The residue carries the side chain and the backbone, which is
// what makes the preview readable. The narrower selection still happens
// on click — only the preview is wider.
function hoverSel(atom) {
  return { chain: atom.chain, resi: atom.resi };
}

// The selection key the hovered thing would occupy, so the preview can be
// suppressed when it is already selected.
// Whether the hovered residue already carries a selection, so the preview
// can be suppressed. Residue-level in every mode, matching what hoverSel
// paints: an atom or bond selected anywhere in this residue counts, since
// the real highlight is stronger than the preview and repainting over it
// would flicker.
function hoverAlreadySelected(atom) {
  const resKey = `${atom.chain || "_"}:${atom.resi}`;
  if (state.selection[resKey] || state.selection[`chain:${atom.chain}`]) {
    return true;
  }
  // Atom and bond selections are keyed by index, so scan for one whose
  // atom belongs to this residue.
  return Object.values(state.selection).some(item => {
    if (!item.atom && !item.bond) return false;
    const idx = Array.isArray(item.sel.index) ? item.sel.index : [item.sel.index];
    return idx.some(i => {
      const a = viewer.getModel().atoms.find(x => x.index === i);
      return a && a.chain === atom.chain && a.resi === atom.resi;
    });
  });
}

function applyStyle() {
  const kind = stylePicker.value;
  const scheme = colorPicker.value;

  viewer.setStyle({}, {});

  // Every chain keeps the chosen style; picking one only moves the camera
  // onto it, so the rest of the complex stays on screen for context.
  viewer.setStyle({}, styleSpec(kind, scheme, state.chains.map(c => c.chain)));

  // Ligands (non-amino-acid chains from metadata) get their own rendering
  // style, chosen independently of the protein's, so a small molecule
  // stays legible inside a structure of thousands of atoms.
  // current.json chains carry "id", not "chain" — see publish.py.
  const ligandChains = (state.meta.chains || [])
    .filter(c => c.ligand)
    .map(c => c.id);
  if (ligandChains.length) {
    const spec = ligandStyleSpec(ligandStylePicker.value, kind === "surface");
    ligandChains.forEach(ch => viewer.setStyle({ chain: ch }, spec));
    // A lone ion has no bonds, so stick and line draw nothing for it. Give
    // those atoms a sphere of their own; bonded molecules are untouched.
    // `index` is 3Dmol's own atom index — `serial` is the PDB atom number,
    // which is a different thing and selects nothing here.
    const ions = (viewer.getModel().atoms || []).filter(
      a => ligandChains.includes(a.chain) && isIsolatedAtom(a));
    if (ions.length) {
      viewer.setStyle({ index: ions.map(a => a.index) }, ION_SPHERE);
    }
  }

// Alpha-sphere clouds from fpocket are a point set, not a molecule: the
// atoms have no bonds between them, so a stick render draws nothing but
// isolated dots and a ball-and-stick adds stray spheres. Spheres alone
// read as the cavity's shape, which is what they are.
//
// White rather than a hue: the cloud sits on top of a protein already
// coloured by chain, and a saturated default competes with it. White reads
// as "cavity" without taking a side, and leaves the selection colours
// free to mean "chosen".
//
// Opacity has to clear two bars at once: high enough that the cloud
// reads as a volume against the surface shell, low enough that the
// lining residues stay visible through it. 0.55 washed out to nothing.
const POCKET_SPHERE = { scale: 0.35, color: "#ffffff", opacity: 0.85 };

viewer.setStyle({ resn: "STP" }, { sphere: { ...POCKET_SPHERE } });

  // Hidden chains get an empty style, which removes them from the render
  // without touching the model — so toggling the eye is reversible.
  // This has to come last: the ligand block above would otherwise re-style
  // a hidden ligand and undo the hide.
  state.hiddenChains.forEach(ch => viewer.setStyle({ chain: ch }, {}));

  // A selected ligand keeps exactly the geometry it already had; only the
  // element colours change, each tinted toward the user's state.selection colour.
  // Overwriting with one flat tone would destroy the O/N/C readout, and
  // changing the radius makes the molecule look fatter than its neighbours.
  const highlight = selectionHighlightSpec(kind);
  const ligandIds = new Set((state.meta.chains || [])
    .filter(c => c.ligand).map(c => c.id));
  Object.entries(state.selection).forEach(([key, item]) => {
    // A selected pocket takes the state.selection colour and grows slightly.
    // Opacity stays put: changing it reorders 3Dmol's transparent pass and
    // the other pockets fade with it, which reads as "selecting one dims
    // them all". A slightly larger sphere in the selection colour marks
    // the chosen one without touching the render queue.
    if (item.pocket) {
      viewer.setStyle(item.sel, {
        sphere: { scale: 0.45, color: item.color, opacity: 0.85 },
      });
      return;
    }
    // A single atom or a bond: keep the geometry exactly as it was and
    // only shift the element colours toward the state.selection colour. Scaling
    // the sphere up made the atom look like a different, larger atom
    // rather than the same one marked; tinting says "selected" while the
    // O/N/C readout and the size stay honest.
    if (item.atom || item.bond) {
      const map = elementColorsTinted(item.color);
      viewer.setStyle(item.sel, {
        stick: { radius: item.bond ? 0.3 : 0.22,
                 colorscheme: { prop: "elem", map } },
        sphere: { scale: item.bond ? 0.42 : 0.32,
                  colorscheme: { prop: "elem", map } },
      });
      return;
    }
    if (ligandIds.has(item.sel.chain)) {
      const spec = ligandStyleSpec(ligandStylePicker.value, kind === "surface");
      const map = elementColorsTinted(item.color);
      const styled = {};
      for (const [k, v] of Object.entries(spec)) {
        styled[k] = { ...v, colorscheme: { prop: "elem", map } };
      }
      // A selected ion needs the same treatment an unselected one does, or
      // selecting it makes it vanish.
      if (!styled.sphere) {
        const lone = (viewer.getModel().atoms || []).filter(
          a => a.chain === item.sel.chain && isIsolatedAtom(a));
        if (lone.length) {
          styled.sphere = { ...ION_SPHERE.sphere,
                            colorscheme: { prop: "elem", map } };
        }
      }
      viewer.setStyle(item.sel, styled);
      return;
    }
    const styled = {};
    for (const [k, v] of Object.entries(highlight)) {
      // The side chain keeps Jmol element colours — blue N, red O, grey C
      // — so the residue's chemistry stays legible. Only the backbone
      // representation carries the state.selection colour, which is what marks
      // the residue as chosen.
      styled[k] = k === "stick" && v.colorscheme
        ? { ...v }
        : { ...v, color: item.color };
    }
    viewer.setStyle(item.sel, styled);
  });

  // Hover preview goes last so it wins over both the base style and any
  // selection on the same residue — the user is asking about this one right
  // now. Skipped when the residue is already selected, since the real
  // highlight is stronger than the preview and repainting it would flicker.
  if (state.hover && !hoverAlreadySelected(state.hover)) {
    viewer.setStyle(hoverSel(state.hover), hoverHighlightSpec(kind));
  }

  drawDistanceLines();

  viewer.render();

  // The sequence panel is the other half of the same picture: a residue
  // highlighted in the 3D view has to be highlighted there too, or the two
  // halves of the screen disagree about what is selected.
  paintSequenceSelection();

  // Report the view to any agent reading selection.json. applyStyle runs
  // on every tab switch, style change and chain toggle, so this is the one
  // place that sees all of them — persistSelection alone only fires when
  // the selection itself changes.
  persistView();
}

// Everything about the view an agent needs to know which structure the
// user means. Serialised so the write can be skipped when nothing changed:
// hover previews also route through applyStyle, and posting on every one
// of those would be both wasteful and noisy.
function viewSignature() {
  return JSON.stringify({
    tab: state.activeTab,
    name: state.structureName,
    tabs: state.tabs.map(t => t.meta.name),
    mode: state.selMode,
    style: stylePicker.value,
    color: colorPicker.value,
    ligand: ligandStylePicker.value,
    hidden: [...state.hiddenChains].sort(),
    sel: Object.keys(state.selection).sort(),
  });
}

let lastViewSig = null;
function persistView() {
  const sig = viewSignature();
  if (sig === lastViewSig) return;
  lastViewSig = sig;
  persistSelection(Object.keys(state.selection));
}

/* ---------------- distance lines ---------------- */

// When exactly two residues are selected, draw a dashed line between them
// with the distance at its midpoint. "How far apart are these two?" is the
// first question anyone asks of a pair of residues, and answering it meant
// leaving the viewer for a script.
//
// Two selections draw one line with its length. Three draw the triangle's
// three edges with their lengths, plus the angle at each corner — the
// shape three points make is the question "are these three arranged the way
// I think", and lengths alone do not answer it. Four or more draw nothing:
// the edges cross, the labels overlap into noise, and there is no longer a
// single shape to read.
//
// Residues and atoms both count, and the two can be mixed — "how far is
// this side-chain oxygen from that residue" is the same question. Chain,
// bond and pocket selections are dropped: a whole chain, a pair of atoms,
// and a cloud of spheres have no single position to measure from.
//
// Residues measure from their centroid rather than the closest atom pair.
// Centroids are symmetric — the line reads as "these two residues" — while
// a closest-atom line lands on whatever side chain happens to point the
// right way and looks arbitrary. The trade-off is that the numbers are
// centroid distances, not contact distances.

// White rather than a hue: the structure is already coloured by chain, and
// a saturated line competes with it. White reads as "measurement" without
// taking a side, and leaves the selection colours free to mean "chosen".
const DIST_LINE_COLOR = "#ffffff";
const DIST_LABEL_BG = "rgba(11,15,20,.85)";

function clearDistanceLines() {
  distShapes.forEach(s => {
    try { viewer.removeShape(s); } catch (e) { /* already gone */ }
  });
  distShapes = [];
  distLabels.forEach(l => {
    try { viewer.removeLabel(l); } catch (e) { /* already gone */ }
  });
  distLabels = [];
}

// Centroid of a residue's atoms, or null if the residue is not in the model.
function residueCentroid(chain, resi) {
  const model = viewer.getModel();
  if (!model) return null;
  const atoms = (model.atoms || []).filter(
    a => a.chain === chain && a.resi === resi);
  if (!atoms.length) return null;
  let x = 0, y = 0, z = 0;
  atoms.forEach(a => { x += a.x; y += a.y; z += a.z; });
  return { x: x / atoms.length, y: y / atoms.length, z: z / atoms.length };
}

function dist(a, b) {
  return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2 + (a.z - b.z) ** 2);
}

// addShape({cylinder: {...}}) does not work: GLShape's constructor stores
// the spec but only updateFromStyle reads it, and that handles colour and
// opacity — never geometry. The shape ends up with an empty bounding
// sphere and draws nothing. The geometry has to be added explicitly on
// the returned object.
//
// The colour has to be given twice. addCylinder writes it into the geo's
// colour array, but globj() runs updateColor(geo, shape.color) over the
// whole array before drawing — and a shape built from an empty spec has
// color black, because updateFromStyle falls back to CC.color(0) when the
// spec carries no colour. Passing it only to addCylinder leaves the line
// black.
//
// Dashed needs addDashedCylinder, not a `dashed` flag on addCylinder:
// addCylinder reads only start, end, radius, color, fromCap and toCap, and
// silently ignores everything else — including `dashed`.
function addDashedLine(a, b) {
  const shape = viewer.addShape({ color: DIST_LINE_COLOR });
  shape.addDashedCylinder({
    start: a,
    end: b,
    // 0.12: thin enough to read as a measurement rather than a bond, thick
    // enough to survive the canvas's device pixel ratio. At 0.1 it was a
    // couple of pixels wide and vanished against the surface shell.
    radius: 0.12,
    // Dash and gap in angstroms along the line. Roughly equal so the line
    // reads as dashed at any length rather than as a dotted or solid one.
    dashLength: 0.4,
    gapLength: 0.35,
    color: DIST_LINE_COLOR,
  });
  distShapes.push(shape);
}

function addTextLabel(text, at) {
  const label = viewer.addLabel(text, {
    position: at,
    backgroundColor: DIST_LABEL_BG,
    fontColor: DIST_LINE_COLOR,
    // 18 rather than 14: the label is the point of the line, and at 14 it
    // read as a caption for the structure rather than a measurement. 3Dmol
    // label sizes are in pixels at the canvas's device ratio, so what looks
    // right on screen is larger than the CSS-equivalent number.
    fontSize: 18,
    font: "monospace",
    padding: 5,
    borderThickness: 0,
  });
  distLabels.push(label);
}

function midpoint(a, b) {
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, z: (a.z + b.z) / 2 };
}

// Angle at corner `v`, between the edges to `p` and `q`, in degrees.
function angleAt(v, p, q) {
  const u = { x: p.x - v.x, y: p.y - v.y, z: p.z - v.z };
  const w = { x: q.x - v.x, y: q.y - v.y, z: q.z - v.z };
  const dot = u.x * w.x + u.y * w.y + u.z * w.z;
  const lu = Math.sqrt(u.x ** 2 + u.y ** 2 + u.z ** 2);
  const lw = Math.sqrt(w.x ** 2 + w.y ** 2 + w.z ** 2);
  if (!lu || !lw) return null;
  // Clamp: floating point can push the ratio a hair outside [-1, 1] for a
  // straight or fully folded corner, and acos of that is NaN.
  const c = Math.max(-1, Math.min(1, dot / (lu * lw)));
  return Math.acos(c) * 180 / Math.PI;
}

// Position of one selection entry, or null if it has none.
//
// Residues measure from their centroid; atoms from the atom itself. Chain,
// bond and pocket entries have no single position — a whole chain, a pair
// of atoms, or a cloud of spheres — so they return null and are dropped.
function selectionPoint(item) {
  if (!item || !item.sel) return null;
  if (item.atom) {
    const model = viewer.getModel();
    const a = (model && model.atoms || []).find(x => x.index === item.sel.index);
    return a ? { x: a.x, y: a.y, z: a.z } : null;
  }
  if (item.chain || item.bond || item.pocket) return null;
  if (item.sel.resi !== undefined) {
    return residueCentroid(item.sel.chain, item.sel.resi);
  }
  return null;
}

function drawDistanceLines() {
  clearDistanceLines();

  // Residue and atom selections. Chain, bond and pocket entries are dropped
  // by selectionPoint — none of them has one position to measure from.
  const pts = Object.values(state.selection)
    .map(selectionPoint)
    .filter(Boolean);
  if (pts.length < 2 || pts.length > 3) return;

  if (pts.length === 2) {
    addDashedLine(pts[0], pts[1]);
    addTextLabel(`${dist(pts[0], pts[1]).toFixed(2)} Å`, midpoint(pts[0], pts[1]));
    return;
  }

  // Three residues: the triangle. Each edge gets its length at the
  // midpoint, and each corner gets its angle pushed slightly toward the
  // interior so the three labels do not sit on top of each other.
  const [a, b, c] = pts;
  const edges = [[a, b], [b, c], [c, a]];
  edges.forEach(([p, q]) => {
    addDashedLine(p, q);
    addTextLabel(`${dist(p, q).toFixed(2)} Å`, midpoint(p, q));
  });

  const corners = [
    { at: a, p: b, q: c },
    { at: b, p: a, q: c },
    { at: c, p: a, q: b },
  ];
  corners.forEach(({ at, p, q }) => {
    const deg = angleAt(at, p, q);
    if (deg === null) return;
    // Nudge toward the interior: the centroid of the three points is always
    // inside the triangle, so a point part-way from the corner to it is too.
    const inner = { x: (a.x + b.x + c.x) / 3,
                    y: (a.y + b.y + c.y) / 3,
                    z: (a.z + b.z + c.z) / 3 };
    const t = 0.28;
    addTextLabel(`${deg.toFixed(1)}°`, {
      x: at.x + (inner.x - at.x) * t,
      y: at.y + (inner.y - at.y) * t,
      z: at.z + (inner.z - at.z) * t,
    });
  });
}

stylePicker.addEventListener("change", applyStyle);
colorPicker.addEventListener("change", applyStyle);
ligandStylePicker.addEventListener("change", applyStyle);

resetBtn.addEventListener("click", () => {

  viewer.render();
});


/* ---------------- residue selection ---------------- */

const selectionPanel = document.getElementById("selection");
const selList = document.getElementById("sel-list");
const selClear = document.getElementById("sel-clear");

// What a click selects: "res" — the single residue under the cursor;
// "chain" — that residue's whole chain; "atom" — one atom; "bond" — a
// bond to a neighbour. Lives in state so a tab can keep its own mode.
const PALETTE = ["#ff6b6b", "#4ecdc4", "#ffe66d", "#a78bfa",
                 "#fb923c", "#34d399", "#f472b6", "#60a5fa"];

function selKey(atom) {
  return `${atom.chain || "_"}:${atom.resi}`;
}

// Atom-level key. `index` is 3Dmol's global atom index, unique across the
// whole model, so it identifies one atom unambiguously — unlike
// chain:resi:name, which repeats for altlocs and for the same residue name
// in different models.
function atomKey(atom) {
  return `atom:${atom.index}`;
}

// Bond key from two atom indices, ordered so the same bond clicked from
// either end yields the same key.
function bondKey(a, b) {
  return `bond:${Math.min(a, b)}-${Math.max(a, b)}`;
}

function atomLabel(atom) {
  const where = `${atom.resn || "?"} ${atom.resi}${atom.chain ? " · " + atom.chain : ""}`;
  return `${atom.atom || atom.elem || "?"} — ${where}`;
}

function bondLabel(a, b) {
  // Ligand atoms often share a residue number, so "C1–O1" is ambiguous
  // when both ends are carbon. Include the element and, when the two ends
  // would otherwise read the same, the atom index.
  const name = x => `${x.atom || x.elem}${x.resi}`;
  const same = name(a) === name(b);
  const tag = x => same ? `${name(x)}#${x.index}` : name(x);
  return `${tag(a)}–${tag(b)}`;
}

// Turn one tab's selection object into the JSON shape skills read.
// Kept separate from persistSelection so the same code can serialise the
// active tab and every background tab.
function serializeSelection(sel) {
  const residues = [];
  const chainSelections = [];
  const atoms = [];
  const bonds = [];
  const pockets = [];
  Object.keys(sel || {}).forEach(k => {
    const item = sel[k];
    if (item.pocket) {
      pockets.push({
        chain: item.sel.chain,
        color: item.color,
      });
      return;
    }
    if (item.chain) {
      chainSelections.push({
        chain: item.sel.chain,
        whole_chain: true,
        color: item.color,
      });
      return;
    }
    if (item.atom) {
      atoms.push({
        index: item.sel.index,
        // The PDB atom number alongside 3Dmol's index. The two differ: 3Dmol
        // reorders atoms when it builds a model, so its index is not a
        // position in the file and cannot be walked back to a serial. A skill
        // that needs to edit the structure has to know which atom was meant,
        // and only the serial says that.
        serial: item.serial,
        resn: item.sel.resn,
        resi: item.sel.resi,
        chain: item.sel.chain,
        label: item.label,
        color: item.color,
      });
      return;
    }
    if (item.bond) {
      bonds.push({
        indices: item.sel.index,
        label: item.label,
        color: item.color,
      });
      return;
    }
    const [chain, resi] = k.split(":");
    residues.push({
      chain,
      resi: isNaN(Number(resi)) ? resi : Number(resi),
      resn: item.label.split(" ")[0],
      color: item.color,
    });
  });
  return { residues, chainSelections, atoms, bonds, pockets };
}

// Persist the current state.selection so an agent can read it.
// Written to static/state.selection.json — see the structure-viewer skill.
// Chain-level selections are written as {"chain": "B", "whole_chain": true}
// so a skill can act on them without expanding hundreds of residues.
function persistSelection(keys) {
  const { residues, chainSelections, atoms, bonds, pockets } =
    serializeSelection(state.selection);

  const payload = {
    structure: state.structureName || null,
    count: residues.length + chainSelections.length
         + atoms.length + bonds.length + pockets.length,
    residues,
    updated: new Date().toISOString(),
  };
  if (pockets.length) payload.pockets = pockets;
  if (chainSelections.length) payload.chains = chainSelections;
  if (atoms.length) payload.atoms = atoms;
  if (bonds.length) payload.bonds = bonds;

  // What the user is currently looking at. Without this an agent can read
  // the selection but not which tab it was made on, so "design a binder
  // for this" is ambiguous the moment more than one structure is open.
  //
  // Every open tab is reported, not just the active one. A request like
  // "superimpose the two chains I selected" needs both selections, and they
  // are usually made on different tabs — the active tab alone would make
  // that request impossible to fulfil.
  payload.view = {
    // Index and name of the tab on screen, plus every tab open, so the
    // agent can tell "the one I am looking at" from "the ones I have".
    tab: state.activeTab,
    tab_name: state.structureName || null,
    tabs: state.tabs.map(t => t.meta.name || "structure"),
    // What a click would select right now.
    sel_mode: state.selMode,
    // How the structure is drawn.
    style: stylePicker.value,
    color: colorPicker.value,
    ligand_style: ligandStylePicker.value,
    // Chains the user has hidden with the eye toggles.
    hidden_chains: [...state.hiddenChains],
  };

  // Selections on the other open tabs, keyed by tab name. The active tab's
  // selection is already in the top-level fields, so it is skipped here.
  const others = {};
  state.tabs.forEach((t, i) => {
    if (i === state.activeTab) return;
    const name = t.meta.name || "structure";
    const s = serializeSelection(t.state && t.state.selection);
    const n = s.residues.length + s.chainSelections.length
            + s.atoms.length + s.bonds.length + s.pockets.length;
    if (!n) return;
    const entry = { count: n };
    if (s.residues.length) entry.residues = s.residues;
    if (s.chainSelections.length) entry.chains = s.chainSelections;
    if (s.atoms.length) entry.atoms = s.atoms;
    if (s.bonds.length) entry.bonds = s.bonds;
    if (s.pockets.length) entry.pockets = s.pockets;
    others[name] = entry;
  });
  if (Object.keys(others).length) payload.other_tabs = others;

  // Fire-and-forget: the viewer must not block on this write.
  fetch("selection.json", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  }).catch(() => { /* static server may reject POST; selection still works */ });
}

function selLabel(atom) {
  return `${atom.resn || "?"} ${atom.resi}${atom.chain ? " · " + atom.chain : ""}`;
}

/* ---------------- agent chat ---------------- */

const agentPanel = document.getElementById("agent-panel");
const agentLog = document.getElementById("ag-log");
const agentInput = document.getElementById("ag-input");
const agentSend = document.getElementById("ag-send");
const agentSendIcon = document.getElementById("ag-send-icon");
const agentStopIcon = document.getElementById("ag-stop-icon");
const agentCompose = document.getElementById("ag-compose");
const agentCollapse = document.getElementById("ag-collapse");
const agentCtx = document.getElementById("ag-context");
const agentCtxText = document.getElementById("ag-ctx-text");
const agentModelLabel = document.getElementById("ag-model");
const agentNewBtn = document.getElementById("ag-new");
const agentHistBtn = document.getElementById("ag-history-btn");
const agentSesBox = document.getElementById("ag-sessions");
const agentSesList = document.getElementById("ag-ses-list");

// The conversation, in the shape the API wants. Kept here rather than read
// back out of the DOM: the DOM holds rendered text, and re-deriving roles
// and tool calls from markup is how a transcript quietly loses a turn.
let agentMessages = [];
// The opencode session the current turn runs in. A permission request has to
// name the session it belongs to, and the only place that is known is the
// stream itself — so it is recorded from the events as they arrive.
let agentSessionId = null;
// The AbortController for the turn in progress, or null when none is. The stop
// button aborts through it.
let agentAbort = null;
let agentBusy = false;

// One agent, and it can run skills. A read-only mode was tried and removed:
// it could not use bash at all, so a question that needed a command was
// answered from a guess instead of a look, and the switch asked the user to
// decide something they had no way to judge. The permission system already
// asks before anything changes, which is the guard that matters.
const agentName = "biobench";

// Whether the agent is installed and running, asked once on load. Without it
// the panel looks ready and the first message fails, which reads as a bug in
// the panel rather than a missing install.
fetch("agent/status").then(r => r.json()).then(s => {
  if (!s.installed) {
    agentAppend("error",
      "Agent 未安装。运行：bash vendor/install_opencode.sh");
    agentSend.disabled = true;
  } else if (!s.running) {
    agentModelLabel.textContent = "启动中…";
  }
  // The switch is read from the same response rather than a second request:
  // it is part of what the panel needs to know before it is usable, and two
  // round trips for one page load is one more than necessary.
  agentAutoRender(s.auto_approve);
  // The conversation this page opens into may have a turn still running — a
  // reload during a long turn, or a page left open overnight. The button is
  // put in its stopping state so the first thing on screen matches what the
  // session is doing, rather than offering a send that would queue behind it.
  if (s.busy) agentSetBusy(true);
  agentRestore();
}).catch(() => { /* the panel still works; the first send reports the fault */ });

// Rebuild the transcript after a reload.
//
// The conversation lives in opencode's session store, which survives the
// reload — but the panel's copy of it was in memory and did not. So a refresh
// showed an empty chat beside an agent that still remembered everything, and
// the next message was answered with the whole earlier conversation as
// context the user could no longer see. The history is read back and rendered
// in the same shape a live turn produces, so a restored transcript and a live
// one are indistinguishable.
function agentRestore() {
  fetch("agent/history").then(r => r.json()).then(d => {
    const turns = d.turns || [];
    if (!turns.length) return;
    turns.forEach(t => {
      if (t.role === "user") {
        agentAppend("user", t.content);
        agentMessages.push({ role: "user", content: t.content });
      } else if (t.role === "assistant") {
        agentAppend("assistant", t.reply, t.tools, t.reasoning);
        agentMessages.push({ role: "assistant", content: t.reply });
      }
    });
    agentScrollToEnd();
  }).catch(() => { /* nothing to restore; the panel starts empty as before */ });
}

function agentScrollToEnd() {
  agentLog.scrollTop = agentLog.scrollHeight;
}

/* ---------------- automatic approval ---------------- */

// The switch that answers permission requests without asking. Its state lives
// on the server so it survives a reload and is shared by every tab — a switch
// that resets on refresh is one the user has to set again every time, and one
// that differs between tabs is one they cannot trust.
const agentAutoBtn = document.getElementById("ag-auto");

function agentAutoRender(on) {
  agentAutoBtn.classList.toggle("on", !!on);
  agentAutoBtn.textContent = on ? "⏸" : "⏵";
  agentAutoBtn.title = on
    ? "自动许可：开启（Agent 将直接执行，不再询问）"
    : "自动许可：关闭（点击开启）";
}

function agentAutoSet(on) {
  fetch("agent/auto-approve", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ on: !!on }),
  }).then(r => r.json()).then(d => {
    // The server's state is what counts, not what was asked for: if the file
    // it writes to is unwritable the switch stays off, and showing it as on
    // would tell the user the agent is running unattended when it is not.
    agentAutoRender(d.auto_approve);
  }).catch(() => {
    agentAutoBtn.title = "切换失败";
  });
}

agentAutoBtn.addEventListener("click", () => {
  agentAutoSet(!agentAutoBtn.classList.contains("on"));
});

/* ---------------- conversation management ---------------- */

// Replace the transcript with one that came back from the server. Used after
// switching, creating or deleting a conversation, so the panel always shows
// the session the agent will actually answer from.
function agentRenderTurns(turns) {
  agentMessages = [];
  agentLog.innerHTML = "";
  (turns || []).forEach(t => {
    if (t.role === "user") {
      agentAppend("user", t.content);
      agentMessages.push({ role: "user", content: t.content });
    } else if (t.role === "assistant") {
      agentAppend("assistant", t.reply, t.tools, t.reasoning);
      agentMessages.push({ role: "assistant", content: t.reply });
    }
  });
  agentScrollToEnd();
}

function agentToggleSessions(force) {
  const show = force !== undefined ? force : agentSesBox.hidden;
  agentSesBox.hidden = !show;
  if (show) agentLoadSessions();
}

function agentLoadSessions() {
  agentSesList.innerHTML =
    '<div class="ag-ses-empty">加载中…</div>';
  fetch("agent/sessions").then(r => r.json()).then(d => {
    const list = d.sessions || [];
    if (!list.length) {
      agentSesList.innerHTML =
        '<div class="ag-ses-empty">还没有历史对话</div>';
      return;
    }
    agentSesList.innerHTML = "";
    list.forEach(s => {
      const row = document.createElement("div");
      row.className = "ag-ses-row" + (s.current ? " on" : "");

      const title = document.createElement("span");
      title.className = "ag-ses-title";
      title.textContent = s.title;
      title.title = s.title;

      const turns = document.createElement("span");
      turns.className = "ag-ses-turns";
      turns.textContent = `${s.turns} 轮`;

      const del = document.createElement("button");
      del.className = "ag-ses-del";
      del.type = "button";
      del.textContent = "×";
      del.title = "删除这个对话";
      // The delete stops here rather than bubbling to the row, which would
      // otherwise switch to the conversation the user just asked to remove.
      del.addEventListener("click", ev => {
        ev.stopPropagation();
        agentDeleteSession(s.id, s.title);
      });

      row.append(title, turns, del);
      row.addEventListener("click", () => agentSwitchSession(s.id));
      agentSesList.appendChild(row);
    });
  }).catch(() => {
    agentSesList.innerHTML =
      '<div class="ag-ses-empty">读取失败</div>';
  });
}

// After the panel has moved to another conversation: rebuild the transcript,
// close the dropdown, and put the send button in the state that conversation
// needs.
//
// The button is a stop control while a turn runs and a send control when none
// does, so it has to follow the switch. Showing a send button on a busy
// conversation is a button that does nothing when pressed — and showing a
// stop button on an idle one offers to stop something that is not running.
//
// The stream from the previous conversation is dropped: it belongs to a turn
// in another session, and its events would land in this transcript.
//
// The turn itself keeps running. Switching away is not a request to stop —
// the user moved to another conversation, and a design that takes twenty
// minutes should still be running when they come back. Aborting here would
// make the ＋ button a stop button in disguise, and the work would be gone
// with nothing on screen to say so.
//
// What is dropped is this panel's *view* of it. The turn continues in
// opencode, the session stays busy, and the conversation it belongs to shows
// a stop button when it is next opened — so it can still be stopped from
// there, by the user, on purpose.
function agentAfterSwitch(d) {
  if (agentAbort) {
    agentAbort.abort();
    agentAbort = null;
  }
  if (agentJobTimer) {
    clearInterval(agentJobTimer);
    agentJobTimer = null;
  }
  agentWatchedJobs = null;
  agentDraft = "";
  agentRenderTurns(d.turns);
  agentToggleSessions(false);
  agentSetBusy(!!d.busy);
  // A turn still running in the conversation just opened is picked up live.
  //
  // The work continued in opencode while the user was elsewhere — switching
  // away is not a request to stop, and a design that takes twenty minutes
  // should still be running when they come back. So the panel subscribes to
  // that turn and renders it as it continues, rather than leaving a snapshot
  // taken when they left and a stop button that stops nothing they can see.
  //
  // The transcript is rebuilt first, so the turn's earlier messages are
  // already on screen when the live part starts appending to them.
  if (d.busy && d.session) agentAttach(d.session);
  if (!d.busy) agentInput.focus();
}

// Watch a turn that is already running, without sending anything.
//
// The panel's own stream was dropped when the user switched away — it
// belonged to a turn in another conversation, and its events would have
// landed in that transcript. The turn itself kept going. This re-subscribes
// to it, so what the user sees on returning is the work in progress rather
// than a frozen copy of it.
function agentAttach(sid) {
  agentTurn(null, sid);
}

function agentSwitchSession(id) {
  fetch("agent/session", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id }),
  }).then(r => r.json()).then(d => {
    if (d.error) {
      agentAppend("error", d.error);
      return;
    }
    agentAfterSwitch(d);
  }).catch(e => agentAppend("error", `切换失败：${e.message}`));
}

function agentNewSession() {
  fetch("agent/session", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: null }),
  }).then(r => r.json()).then(d => {
    if (d.error) {
      agentAppend("error", d.error);
      return;
    }
    agentAfterSwitch(d);
  }).catch(e => agentAppend("error", `新建失败：${e.message}`));
}

function agentDeleteSession(id, title) {
  // Confirmed, because a conversation is not recoverable once it is gone and
  // the click that gets here is a small × that only appears on hover.
  if (!confirm(`删除对话「${title}」？此操作不可撤销。`)) return;
  fetch("agent/session?id=" + encodeURIComponent(id), { method: "DELETE" })
    .then(r => r.json())
    .then(d => {
      if (d.error) {
        agentAppend("error", d.error);
        return;
      }
      // The deleted conversation may have been the one on screen, in which
      // case the server has already started a fresh one — so the panel is
      // rebuilt from whatever is current now rather than left showing a
      // transcript that no longer exists.
      return fetch("agent/history").then(r => r.json());
    })
    .then(d => {
      if (!d) return;
      agentRenderTurns(d.turns || []);
      // The panel is now on a different conversation than the one it was on,
      // so the send button has to be re-derived rather than left as it was.
      // A deleted session cannot be busy — it is gone — and the one that
      // replaced it has only just been created, so a send button is right in
      // both cases.
      agentSetBusy(false);
    })
    .then(() => agentLoadSessions())
    .catch(e => agentAppend("error", `删除失败：${e.message}`));
}

agentNewBtn.addEventListener("click", agentNewSession);
agentHistBtn.addEventListener("click", () => agentToggleSessions());

// Clicking outside the dropdown closes it. Without this the list stays open
// over the transcript until the button is pressed again, which is not where
// the user's attention went.
document.addEventListener("click", ev => {
  if (agentSesBox.hidden) return;
  if (agentSesBox.contains(ev.target)) return;
  if (agentHistBtn.contains(ev.target)) return;
  agentSesBox.hidden = true;
});

// Render the model's inline markdown — bold, code, and nothing else.
//
// The model writes `**bold**` and `` `code` `` whether or not it is asked to,
// and showing the asterisks makes a careful answer look like a broken one.
// A full markdown parser is not worth a dependency here; these two cover
// what the model actually emits in a short reply.
//
// Everything is escaped first and the marks are then re-inserted as elements,
// so a model that emits `<script>` in its answer gets it shown as text rather
// than executed. Building the nodes directly rather than assigning innerHTML
// is what makes that hold.
// Render the model's markdown: fenced blocks, bold, inline code, and nothing
// else.
//
// The model writes ``` blocks whether or not it is asked to, and they are how
// it lays out anything columnar — a docking summary, a parameter table, a
// list of chains. Rendered as prose those lose their alignment entirely,
// because the panel's font is proportional and the spaces that did the
// lining up collapse to nothing. A fenced block is set in a monospace font
// with whitespace preserved, which is the only thing that makes it readable.
//
// A full markdown parser is not worth a dependency here. These three cover
// what the model actually emits in a short reply.
//
// Everything is escaped first and the marks are then re-inserted as elements,
// so a model that emits `<script>` in its answer gets it shown as text rather
// than executed. Building the nodes directly rather than assigning innerHTML
// is what makes that hold.
function agentFormat(el, text) {
  el.textContent = "";
  const src = String(text);

  // Fenced blocks first, so their contents are never scanned for the inline
  // marks — a `**` inside a code block is literal, not bold.
  const fenceRe = /```[^\n]*\n([\s\S]*?)```/g;
  let last = 0;
  let m;
  while ((m = fenceRe.exec(src)) !== null) {
    if (m.index > last) agentInline(el, src.slice(last, m.index));
    const pre = document.createElement("pre");
    pre.className = "ag-pre";
    pre.textContent = m[1].replace(/\n$/, "");
    el.appendChild(pre);
    last = m.index + m[0].length;
  }
  if (last < src.length) agentInline(el, src.slice(last));
}

// The inline marks: **bold** and `code`. Split on them, keeping them, so the
// pieces between are literal.
function agentInline(el, text) {
  if (!text) return;
  const parts = text.split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
  parts.forEach(part => {
    if (!part) return;
    let node;
    if (part.startsWith("**") && part.endsWith("**") && part.length > 4) {
      node = document.createElement("b");
      node.textContent = part.slice(2, -2);
    } else if (part.startsWith("`") && part.endsWith("`") && part.length > 2) {
      node = document.createElement("code");
      node.textContent = part.slice(1, -1);
    } else {
      node = document.createTextNode(part);
    }
    el.appendChild(node);
  });
}

// Ask the user to allow or refuse something the agent wants to run.
//
// The agent blocks on this — it cannot proceed and it cannot time out — so a
// request nobody answers is a turn that hangs forever. The prompt lives in
// its own docked strip rather than in the transcript: a long conversation
// would push an inline prompt out of sight, and an unseen prompt is a hung
// turn with nothing on screen to explain it.
function agentAskPermission(ev) {
  const box = document.getElementById("ag-perm");
  const head = box.querySelector(".ag-perm-head");
  const cmd = box.querySelector(".ag-perm-cmd");
  const btns = box.querySelector(".ag-perm-btns");

  head.textContent = `需要许可 · ${ev.permission || "bash"}`;
  // The patterns are what the rules matched against. Showing them rather than
  // a summary is what lets the user judge the request — "ls *" and
  // "rm -rf /*" are both one bash call.
  cmd.textContent = (ev.patterns || []).join("\n") || "(no detail)";
  btns.innerHTML = "";

  // Answered, so the prompt goes away. Leaving it up would suggest the agent
  // is still waiting when it is not.
  //
  // Two answers, not three. "Always allow" used to sit between them and was
  // removed when the panel grew the auto-approve switch in the header: that
  // switch is the same decision made once for the whole session instead of
  // once per command, and having both meant two controls that each covered
  // part of what the agent could run.
  function respond(response) {
    box.hidden = true;
    btns.innerHTML = "";
    fetch("agent/permission", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session: agentSessionId,
        id: ev.id,
        response,
      }),
    }).catch(() => {
      agentAppend("error", "许可答复失败");
    });
  }

  [["once", "允许一次", "ag-perm-allow"],
   ["reject", "拒绝", "ag-perm-deny"]].forEach(([resp, label, cls]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = cls;
    b.textContent = label;
    b.addEventListener("click", () => respond(resp));
    btns.appendChild(b);
  });

  box.hidden = false;
}

// The model's working, as a collapsed block. Built once here so the streaming
// placeholder and the finished message render it the same way.
function agentThinkBlock(reasoning) {
  const d = document.createElement("details");
  d.className = "ag-think";
  const sum = document.createElement("summary");
  sum.textContent = "思考过程";
  const body = document.createElement("div");
  body.className = "ag-think-text";
