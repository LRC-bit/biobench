      // seen. A notice means "this happened while you were here", so the
      // baseline is taken on arrival and only a later change counts.
      // The first poll of a page load records the timestamp and says
      // nothing — a notice means "this happened while you were here", and
      // whatever was published before the page opened did not.
      //
      // It still has to *load* the structure, which is a different thing
      // from announcing it. restoreTabs() deliberately leaves the newest
      // archive entry for the poll to add, on the assumption that the poll
      // will see it as a change. That holds while a run is publishing:
      // `updated` moves, the next poll takes the branch below, the structure
      // lands.
      //
      // It does not hold for a static copy — a page deployed to a host with
      // no server behind it, where `updated` is frozen at whatever was
      // published last. There the first poll is also the last, the branch
      // below never runs, and the newest structure is the one thing nobody
      // loads: the page opens on the welcome screen with a full archive
      // behind it.
      //
      // So the baseline is set to a value the file cannot hold, which sends
      // this first read down the same path as a real change — structure
      // loaded, tab added. The notice stays suppressed on its own: the
      // seen-jobs set is seeded further down, on this same first pass, from
      // status.json, and nothing has compared against it yet.
      if (state.contractUpdated === null) {
        state.contractUpdated = "\u0000first-read";
      }
      if (meta.updated && meta.updated !== state.contractUpdated) {
        const cif = await fetch("current.cif?t=" + Date.now());
        if (!cif.ok) return;
        const text = await cif.text();

        // A new publish is recorded as a tab but never takes over the screen.
        //
        // Following the contract file used to switch the view whenever the
        // user was already on the newest tab, which yanked them off whatever
        // they were reading the moment a background run published — a
        // docking that finished while they were inspecting the previous
        // result would replace it mid-inspection. The tab is added and a
        // notice is raised instead; the user goes to it when they choose.
        //
        // The contract file holds only the latest structure, so the notice
        // has to name it rather than assume it is on screen.
        if (state.activeTab >= 0 && state.tabs[state.activeTab]) {
          state.tabs[state.activeTab].state = captureState();
        }
        // The tab records where the structure lives rather than carrying the
        // contract file's text. `current.cif` holds only the latest publish
        // and is overwritten by the next one, so a tab built from it caches
        // whatever happened to be current at that moment — which is not
        // always what the archive has under that name. An MD run publishes
        // `final.pdb` (the whole solvated trajectory frame, tens of thousands
        // of atoms) while the archive keeps the complex it was asked to
        // publish; the tab then showed the trajectory, and 3Dmol read one
        // chain out of it. The archive is the record of what was published,
        // so that is what the tab points at.
        //
        // current.json carries no file path — it describes the contract file,
        // not the archive — so the path is looked up. Without it the tab has
        // neither text nor file: nothing to open, and clicking it falls back
        // to whatever tab happened to have text. A publish whose archive
        // entry is gone — deleted from under us, or never written — is not
        // recorded as a tab at all. The notice still names it and the
        // switcher lists only structures that can actually be opened.
        const withFile = Object.assign({}, meta);
        if (!withFile.file) {
          try {
            const ar = await fetch("structures.json?t=" + Date.now());
            if (ar.ok) {
              const list = await ar.json();
              const e = (Array.isArray(list) ? list : [])
                .find(x => x && x.meta && x.meta.name === meta.name);
              if (e && e.file) withFile.file = e.file;
            }
          } catch (e) { /* no archive yet */ }
        }
        if (withFile.file) addTab(null, withFile, false);
        state.contractUpdated = meta.updated;
        // A new publish is newer than whatever step the user had pinned, so
        // the pin goes and the pill follows the run again. Leaving it would
        // freeze the pill on a step that finished before this one started.
        state.pinnedJob = null;
        renderTabs();
      }
    }
  } catch (e) { /* viewer not published yet */ }

  try {
    const res = await fetch("status.json?t=" + Date.now());
    if (res.ok) {
      lastStatus = await res.json();
      renderStatus(lastStatus, pillJob());
      // The notice is raised here rather than where the contract file
      // changed, because this is the only place that knows a run finished.
      // `current.json` is rewritten by every publish — including the
      // `--status --state running` one a skill makes before it does any work
      // — so keying the notice on it rang the bell when a task was queued.
      //
      // Only a job that turned done since the last poll counts, so a page
      // loaded mid-run does not announce the runs that finished before it
      // arrived, and a run that publishes several structures raises one
      // notice rather than one per publish.
      if (state.seenDoneJobs === null) {
        // First read of this page load: record what is already done and say
        // nothing. A notice means "this happened while you were here", and
        // none of these did.
        state.seenDoneJobs = new Set(
          ((lastStatus && lastStatus.jobs) || [])
            .filter(j => j && j.state === "done" && j.id)
            .map(j => j.id));
      } else {
        const fresh = newlyDoneJobs(lastStatus, state.seenDoneJobs);
        if (fresh.length) {
          const last = fresh[fresh.length - 1];
          raisePublishNotice({
            name: last.structure || state.structureName || "structure",
          });
        }
      }
    }
  } catch (e) { /* no status file */ }

  // Sampled on the same 2s tick as the status file. The server measures CPU
  // across a 250ms window, so this is a real reading rather than a
  // since-boot average.
  renderSysinfo();

  // A skill asking the viewer to select residues in what is already on
  // screen. selection.json only flows the other way, so without this a
  // computed result — the residues within 5 A of a click, say — has nowhere
  // to go.
  await pollSelect();
}

// Read select.json, apply it to the loaded model, then delete it.
//
// The delete matters: without it the same request would re-apply on every
// poll, re-selecting residues the user had since dismissed by hand. The
// server exposes DELETE for this one file.
async function pollSelect() {
  try {
    const res = await fetch("select.json?t=" + Date.now());
    // 404 is the normal case — the file exists only while a skill has a
    // pending request. Letting it through to the console as a failed
    // resource fills the log with an error every two seconds for something
    // that is working exactly as intended.
    if (res.status === 404) return;
    if (!res.ok) return;
    const req = await res.json();
    if (Array.isArray(req.residues) && req.residues.length) {
      applyHighlights({ highlight: req.residues });
      renderSelectionPanel();
      persistSelection(Object.keys(state.selection));
    }
    await fetch("select.json", { method: "DELETE" });
  } catch (e) { /* no pending request */ }
}

// Reopen the structures published before this page load.
//
// current.cif holds only the latest publish, so a reload would otherwise
// show one structure and forget the rest — and the task list's finished
// steps, which promise to show what each step produced, would lead nowhere.
// The publisher archives every publish and lists them in structures.json,
// so the tabs can be rebuilt here.
//
// The newest entry is left out: the poll below picks it up through the
// normal path, which also sets the contract timestamp. Adding it here as
// well would give it two tabs.
// The tabs are rebuilt from the archive, but their structures are not fetched
// here. Loading a dozen at once put eight megabytes of PDB text in memory and
// eventually had the browser refusing every request — including the selection
// write, which fails silently. Each tab records where its structure lives and
// fetches it when opened; only the one on screen is resident.
async function restoreTabs() {
  try {
    const res = await fetch("structures.json?t=" + Date.now());
    if (!res.ok) return;
    const entries = await res.json();
    if (!Array.isArray(entries) || !entries.length) return;

    for (const e of entries.slice(0, -1)) {
      if (!e || !e.file || !e.meta) continue;
      // Already open — a reload of a page that had been running a while.
      if (state.tabs.some(t => t.meta.name === e.meta.name)) continue;
      state.tabs.push({ file: e.file, text: null, meta: e.meta, state: null });
      if (state.tabs.length > MAX_TABS) state.tabs.shift();
    }
    // Land on the newest restored tab rather than the oldest, so the view
    // opens on the most recent thing that happened. The poll then adds the
    // one entry left out above and activates it, which is why activeTab is
    // pointed at the end here: the poll's "am I on the newest tab" test has
    // to answer yes for the latest publish to take the screen.
    if (state.tabs.length) {
      state.activeTab = state.tabs.length - 1;
      const t = state.tabs[state.activeTab];
      state.structureName = t.meta.name || null;
      const text = await tabText(t);
      if (text !== null) renderStructure(text, t.meta, null);
      renderTabs();
      trimTabText();
    }
  } catch (e) { /* no archive yet */ }
}

// Portrait: fold the agent panel away and ask for landscape.
//
// The viewer is three columns across and a portrait phone is a third of that
// wide. Two things make the narrow screen usable rather than merely small:
//
//   1. The agent panel starts collapsed. It is the widest of the three and
//      the least needed at first glance — the structure and the metrics are
//      what the page was opened for. Collapsed it is a tab, and the tab opens
//      it on demand.
//
//   2. A notice asks for landscape. Not a forced rotation: the page stays as
//      it is and the user turns the phone, which is a gesture they already
//      know and which yields the interface that was actually designed.
//
// The Screen Orientation API is asked for too, where it exists. It is a
// request the browser may refuse — it needs fullscreen on iOS, and it fails
// outright on desktop or when the user has a rotation lock on. A refusal is
// fine; the notice is the fallback that always works.
// Portrait: the structure gets the screen, the left column becomes a drawer,

// The full-screen button.
//
// A button, not something the page does on load. requestFullscreen() outside a
// user gesture is refused by every browser — the earlier version called it
// during load and got a silent rejection, which is why nothing ever went full
// screen. One tap is the whole cost, and on a phone it buys back the 80-100px
// the address bar and browser toolbar were taking.
//
// The button is hidden where the API is missing, and on iPhone, where Safari
// has never implemented it. There the equivalent is "add to home screen",
// which opens the page in a standalone window with no browser chrome at all —
// the rotate hint says so, because that is the only route to the same result.
(function fullScreenButton() {
  const btn = document.getElementById("fs-btn");
  const el = document.documentElement;
  const iPhone = /iPhone|iPod/.test(navigator.userAgent);

  const supported = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!supported || iPhone) return;   // nothing this button could do
  btn.hidden = false;

  const isFull = () => !!(document.fullscreenElement ||
                          document.webkitFullscreenElement);

  // The icon is the same four corners in both states; the label and the
  // rotation say which way it will go. Redrawing a second SVG for the exit
  // state would be two icons doing one job.
  const sync = () => {
    btn.title = isFull() ? "退出全屏" : "全屏观看";
    btn.classList.toggle("on", isFull());
  };

  btn.addEventListener("click", () => {
    if (isFull()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      // Locking landscape is attempted only once full screen is granted. The
      // lock needs a fullscreen context on the platforms that have it at all,
      // and asking before that is a guaranteed rejection.
      supported.call(el).then(() => {
        try {
          const so = screen.orientation;
          if (so && typeof so.lock === "function") {
            Promise.resolve(so.lock("landscape")).catch(() => {});
          }
        } catch (e) { /* not supported; the rotate hint covers it */ }
      }, () => { /* refused; the page stays as it is */ });
    }
  });

  document.addEventListener("fullscreenchange", sync);
  document.addEventListener("webkitfullscreenchange", sync);
  sync();
})();

// Scale the whole desktop layout to fit a small screen.
//
// The layout above is written for a screen with room for three columns. Every
// attempt to re-flow it for a phone made things worse, not better: three
// columns at 130px with 10px type and mouse-sized touch targets is not a phone
// interface, it is a cramped desktop one. A drawer fixed the width and broke
// the height; a scrolling toolbar fixed the overlap and hid half the controls;
// a folded panel fixed the 3D view and left the metrics unreachable.
//
// So the layout is not re-flowed at all. Everything in the body is moved into
// a wrapper, the wrapper is given the desktop's design size, and a transform
// scales it down to whatever the screen is. The result is the desktop layout,
// proportionally smaller — the same columns in the same places with the same
// relationships between them, just little. Nothing overlaps because nothing
// moved.
//
// The two panels are bottom sheets, both closed on arrival.
//
// The left column and the agent panel are the two things that compete with the
// structure for space, and on a small screen they win too often: three columns
// across a 390px phone leaves the structure a card-sized slit. So both start
// closed and both open as a sheet over the bottom of the screen, where there is
// room for their content at full width and where a thumb already is.
//
// One sheet at a time. Two sheets over each other is not a thing anyone wants,
// and the one underneath would be unreachable rather than merely hidden — so
// opening one closes the other. The closed handle dims instead of hiding, so
// the user can still see that the other panel exists.
//
// Tapping the stage closes whatever is open, for the same reason a dropdown
// closes on a click outside it: a sheet covering the thing you were looking at
// should get out of the way on a tap anywhere else.
(function bottomSheets() {
  const sheets = {
    left: {
      panel: document.getElementById("left-col"),
      handle: document.getElementById("left-handle"),
    },
    agent: {
      panel: document.getElementById("agent-panel"),
      handle: document.getElementById("agent-handle"),
    },
  };

  const setOpen = (key, open) => {
    const s = sheets[key];
    if (!s || !s.panel || !s.handle) return;
    s.panel.classList.toggle("open", open);
    s.handle.classList.toggle("on", open);
    // The other sheet closes, and its handle dims to say so.
    for (const k of Object.keys(sheets)) {
      if (k === key) continue;
      const o = sheets[k];
      if (!o.panel || !o.handle) continue;
      o.panel.classList.remove("open");
      o.handle.classList.remove("on");
      o.handle.classList.toggle("dim", open);
    }
    if (!open) {
      // Nothing open: neither handle is dimmed.
      Object.values(sheets).forEach(o => o.handle && o.handle.classList.remove("dim"));
    }
  };

  Object.entries(sheets).forEach(([key, s]) => {
    if (!s.handle) return;
    s.handle.addEventListener("click", () => {
      setOpen(key, !s.panel.classList.contains("open"));
    });
  });

  // A tap on the stage closes the open sheet. The viewer's own click handler is
  // untouched — this only acts when a sheet is open, so a tap that selects a
  // residue while both are shut behaves exactly as before.
  document.getElementById("viewer-wrap").addEventListener("click", () => {
    const open = Object.keys(sheets).find(
      k => sheets[k].panel && sheets[k].panel.classList.contains("open"));
    if (open) setOpen(open, false);
  });

  // The handles only exist on a small screen. On a desktop the panels are
  // always open in place and there is nothing to open.
  const mq = window.matchMedia("(max-width: 1023px)");
  const apply = () => {
    const small = mq.matches;
    Object.values(sheets).forEach(s => {
      if (s.handle) s.handle.hidden = !small;
    });
    if (!small) {
      // Back to the desktop layout: both panels open in place, no sheets.
      Object.values(sheets).forEach(s => {
        if (s.panel) s.panel.classList.remove("open");
      });
    }
  };
  if (mq.addEventListener) mq.addEventListener("change", apply);
  apply();
})();

// Why a wrapper rather than scaling `body`: `body` is the containing block for
// every absolutely-positioned panel, and a transform on it would make those
// panels' `position: absolute` resolve against the transformed box. Scaling a
// plain div that happens to contain them leaves their containing block alone.
//
// The scale is recomputed on resize and on orientation change, and once after
// load — the first computation can land before the canvas has its final size,
// which would leave 3Dmol drawing at the wrong scale until the next resize.
(function scaleToFit() {
  // Below this width the desktop layout is scaled rather than re-flowed. Above
  // it the page is the page and no transform is involved.
  const NARROW = "(max-width: 1023px)";
  // The height the layout is given. Not measured — see the note in apply() for
  // why measuring it feeds back on itself. 900 is the height the desktop layout
  // is comfortable at: the columns are anchored 58px from the top and the
  // bottom, which at 900 leaves 784px of column, and the status pill sits 22px
  // above the bottom edge. A shorter screen than this is scaled to fit; a
  // taller one is not stretched, because there is nothing to stretch.
  const MIN_H = 900;

  const mq = window.matchMedia(NARROW);
  let wrapper = null;

  const build = () => {
    if (wrapper) return wrapper;
    wrapper = document.createElement("div");
    wrapper.id = "bb-scale";
    // Every child of body moves into the wrapper, in order. The script tags
    // are not children — they have already run — so what moves is the visible
    // page and nothing else.
    while (document.body.firstChild) {
      wrapper.appendChild(document.body.firstChild);
    }
    document.body.appendChild(wrapper);
    return wrapper;
  };

  const teardown = () => {
    if (!wrapper) return;
    while (wrapper.firstChild) {
      document.body.appendChild(wrapper.firstChild);
    }
    wrapper.remove();
    wrapper = null;
  };

  const apply = () => {
    if (!mq.matches) {
      teardown();
      return;
    }
    const el = build();
    // Measure the layout's width from its panels; take the height from a
    // fixed floor.
    //
    // The wrapper starts at the viewport's size and its children are all
    // `position: absolute` — out of flow, so they push neither its scroll size
    // nor its box. Reading the wrapper tells us about the screen, not about the
    // layout, and a scale computed from it comes out as 1.0: the panels keep
    // their desktop pixel sizes and run off the edges of a 390px screen. That
    // is what put the status pill out of sight.
    //
    // Width is measured, because it is the axis that actually varies — the
    // panels' widths are what add up to the layout's extent, and none of them
    // is anchored to the right edge in a way that feeds back.
    //
    // Height is *not* measured, and the reason is a feedback loop. Half the
    // panels are positioned with `bottom`, so their rect.bottom is a function
    // of the wrapper's current height. Sizing the wrapper to the measured
    // bottom moves every `bottom` anchor, the next measurement comes back
    // smaller, and the layout shrinks a little on every call until the status
    // pill falls off the bottom of the screen. A fixed floor breaks the loop:
    // the anchors resolve against a number that does not depend on them.
    const prev = el.style.transform;
    el.style.transform = "none";
    let wantW = 0;
    for (const child of el.children) {
      const r = child.getBoundingClientRect();
      if (r.right > wantW) wantW = r.right;
    }
    el.style.width = `${wantW}px`;
    el.style.height = `${MIN_H}px`;
    el.style.transform = prev;

    // Both axes, smaller ratio wins: the whole layout stays visible,
    // letterboxed rather than cropped. A phone in landscape is wider than it
    // is tall relative to a three-column layout, so height usually binds.
    const scale = Math.min(window.innerWidth / wantW,
                           window.innerHeight / MIN_H);
    el.style.transform = `scale(${scale})`;
    // The wrapper is now the layout's size, which is larger than the screen,
    // so the body would scroll the unscaled layout into view. Hidden: the
    // scaled result is what should be on screen and nothing more.
    document.body.style.overflow = "hidden";
    // 3Dmol sized its canvas from the container before the transform existed.
    // A transform does not change the layout box, so the canvas is still the
    // right size and the GPU scales it — which is exactly what is wanted, and
    // why there is no resize call here.
  };

  if (mq.addEventListener) mq.addEventListener("change", apply);
  window.addEventListener("resize", apply);
  window.addEventListener("orientationchange", apply);
  apply();
  // Once more after the first paint. The initial computation can run before
  // the browser has settled the viewport on a phone whose toolbars appear and
  // disappear, and a scale computed against the wrong height sticks until the
  // next resize.
  requestAnimationFrame(apply);
})();

// Restore first, then start polling. Both are async and both touch the tab
// list, so running them concurrently lets the poll's "am I on the newest
// tab" test answer against a half-built list — which decides whether the
// latest publish takes the screen or is quietly added behind it.
restoreTabs().then(() => {
  poll();
  setInterval(poll, 2000);
});

// The backdrop is applied before anything is drawn, so the canvas is created
// with the right colour rather than repainted into it — a viewer made dark
// and then switched shows the old colour through the model for a frame.
stageLoad();
</script>
</body>
</html>
